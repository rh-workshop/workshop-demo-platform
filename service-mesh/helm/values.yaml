# Valores por defecto del chart, COMUNES a todos los ambientes.
#
# Cada ambiente (envs/values-dev.yaml, envs/values-prod.yaml) sobreescribe solo
# lo que cambia. Esto es lo que diferencia a Helm de Kustomize: en Kustomize se
# parchea un YAML; aqui se inyectan estos valores en las {{ plantillas }} de
# templates/.

# Namespace del plano de control de Istio.
namespace: istio-system

istio:
  # Version de Istio que instala el operador Sail (OSSM 3).
  version: v1.30.3
  # Estrategia de actualizacion: InPlace (en sitio) o RevisionBased (canary).
  updateStrategy: InPlace
  # Perfil de instalacion. En OpenShift el perfil 'openshift' se aplica siempre
  # encima del 'default'.
  profile: openshift

# El IstioCNI es obligatorio en OpenShift: sin el, el CR Istio queda en
# IstioCNINotFound. Se despliega en su propio namespace del operador.
cni:
  enabled: true
  namespace: istio-cni

# Recursos del plano de control. Se suben en prod (ver values-prod.yaml).
resources:
  pilot:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
