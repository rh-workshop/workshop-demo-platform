# Valores por defecto del chart, COMUNES a todos los ambientes.
#
# Cada ambiente (envs/values-dev.yaml, envs/values-prod.yaml) sobreescribe solo
# lo que cambia. Esto es lo que diferencia a Helm de Kustomize: en Kustomize se
# parchea un YAML; aqui se inyectan estos valores en las {{ plantillas }}.
#
# Estructura PLANA a proposito: la guia oficial de Helm recomienda flat sobre
# nested (mas facil de leer y de sobreescribir con --set). Cada valor va
# documentado en su linea, como pide la misma guia.

# namespace: donde vive el plano de control de Istio.
namespace: istio-system

# istioVersion: version de Istio que instala el operador Sail (OSSM 3).
istioVersion: v1.30.3

# updateStrategy: como se actualiza el plano de control. InPlace (en sitio) o
# RevisionBased (canary del propio control plane, mas seguro en prod).
updateStrategy: InPlace

# istioProfile: perfil de instalacion. En OpenShift, 'openshift' se aplica
# siempre encima del 'default'.
istioProfile: openshift

# cniEnabled: el IstioCNI es obligatorio en OpenShift; sin el, el CR Istio queda
# en IstioCNINotFound. Si es false, no se renderiza el CR IstioCNI.
cniEnabled: true

# cniNamespace: namespace propio del componente IstioCNI.
cniNamespace: istio-cni

# pilotCpuRequest / pilotMemoryRequest: recursos garantizados al control plane.
pilotCpuRequest: 100m
pilotMemoryRequest: 128Mi

# pilotCpuLimit / pilotMemoryLimit: techo de recursos del control plane.
pilotCpuLimit: 500m
pilotMemoryLimit: 512Mi

# mtlsMode: postura mTLS del mesh. PERMISSIVE acepta texto plano (default de dev);
# STRICT solo cifrado (prod). Lo aplica una PeerAuthentication.
mtlsMode: PERMISSIVE

# pilotMinReplicas / pilotMaxReplicas: HA del control plane (istiod). Con 1 replica,
# un drain de nodo corta la inyeccion de sidecars y el push de config.
pilotMinReplicas: 1
pilotMaxReplicas: 3
