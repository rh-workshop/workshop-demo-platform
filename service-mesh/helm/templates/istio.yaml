# CR Istio: el plano de control de Service Mesh.
#
# Aqui se ve el contraste con Kustomize: version, namespace, perfil y estrategia
# NO estan escritos fijos, se INYECTAN desde los values. Cambiar de dev a prod no
# parchea este fichero, cambia el values que se le pasa.
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: {{ .Values.namespace }}
  version: {{ .Values.istioVersion }}
  updateStrategy:
    type: {{ .Values.updateStrategy }}
  values:
    pilot:
      resources:
        requests:
          cpu: {{ .Values.pilotCpuRequest }}
          memory: {{ .Values.pilotMemoryRequest }}
        limits:
          cpu: {{ .Values.pilotCpuLimit }}
          memory: {{ .Values.pilotMemoryLimit }}
