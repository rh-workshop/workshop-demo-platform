# Ejecución del pipeline de CI.
#
# Un PipelineRun es una EJECUCIÓN concreta, no una definición: por eso vive en
# "workshop-pipelines/runs/" (junto al pipeline) y no lo gestiona Argo CD. Se crea con "oc create" (no "oc apply"),
# porque cada ejecución necesita un nombre distinto; de ahí "generateName".
#
# REGLA DEL MONOREPO: si el cambio toca el código común (internal/ de la raíz),
# afecta a TODAS las apps — hay que lanzar también el run de api-service, o la
# otra imagen queda construida con la versión antigua de lo común. La etiqueta
# OCI org.opencontainers.image.revision de cada imagen dice con qué commit se
# construyó ("oc image info <imagen>").
#
#   oc create -f workshop-pipelines/runs/pipelinerun-ci-build-image.yaml -n workshop-demo-dev
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: ci-build-image-
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  pipelineRef:
    name: ci-build-image
  # Identidad con permiso para publicar en el registro de imágenes.
  taskRunTemplate:
    serviceAccountName: builder
  # Cota explícita: si el run se cuelga (registro caído, push bloqueado) no queda corriendo para siempre.
  timeouts:
    pipeline: 1h0m0s
  params:
    # Repositorio SIN tag en el registro corporativo (Quay, la variable quay_host del bootstrap): el tag git-<sha> lo pone el pipeline.
    - name: image-repository
      value: CHANGE_ME_QUAY_HOST/company-dev/demo-service
    # Umbral del escaneo como PARÁMETRO: CRITICAL corta solo lo crítico; súbelo a IMPORTANT para endurecer la puerta.
    - name: scan-severity-threshold
      value: CRITICAL
  workspaces:
    # Solución canónica de Tekton para compartir un PVC RWO entre tareas: el asistente de afinidad (activo por defecto) las coprograma en el mismo nodo.
    # Por eso NO se deshabilita con la anotación pipeline.tekton.dev/affinity-assistant y basta ReadWriteOnce.
    # El asistente además actúa de primer consumidor, así que también funciona con StorageClasses WaitForFirstConsumer.
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          # Sin storageClassName se usa la StorageClass por defecto del cluster (debe ser RWO).
          resources:
            requests:
              storage: 1Gi
    - name: config
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          # Sin storageClassName se usa la StorageClass por defecto del cluster (debe ser RWO).
          resources:
            requests:
              storage: 1Gi
    - name: git-credentials
      # Secret basic-auth con permiso de push al repo de configuración. Se crea
      # aparte (nunca se versiona) y se referencia aquí por su nombre.
      secret:
        secretName: git-credentials
    - name: registry-credentials
      # Secret con la credencial del robot del registro, creado FUERA de Git:
      #   oc create secret generic quay-push-credentials --from-file=config.json=<docker config del robot>
      secret:
        secretName: quay-push-credentials
    - name: signing-key
      # Llavero cosign generado FUERA de Git: cosign generate-key-pair k8s://<ns>/cosign-signing-key
      secret:
        secretName: cosign-signing-key
    - name: acs-credentials
      # Token de Central (rol Continuous Integration) + CA, creado FUERA de Git:
      #   oc create secret generic acs-pipeline-credentials --from-literal=rox-api-token=<token> --from-file=ca.pem=<CA>
      secret:
        secretName: acs-pipeline-credentials
