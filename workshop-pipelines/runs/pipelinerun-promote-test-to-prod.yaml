# Promoción TEST -> PROD (segundo salto de la cadena).
#
# Es el MISMO pipeline que el resto de saltos: solo cambian las organizaciones y
# el overlay destino. Lo que hace distinto a este salto NO está en el fichero,
# está en el RBAC: la credencial `quay-promotion-credentials` con escritura sobre
# `company-prod` solo debe existir donde esté autorizado promocionar a producción,
# y crear PipelineRuns en ese namespace debe limitarse por Role (ver el README).
# Ese es el punto de control que un auditor pide: quién aprobó el paso a producción.
#
# El digest NO se elige: es el que ya está corriendo y validado en TEST, que se lee
# del overlay de origen (apps/demo-service/overlays/test). Promocionar es copiar
# ese manifiesto exacto, no reconstruir.
#
#   oc create -f workshop-pipelines/runs/pipelinerun-promote-test-to-prod.yaml -n workshop-demo-dev
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: promote-test-to-prod-
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  pipelineRef:
    name: promote-image
  taskRunTemplate:
    serviceAccountName: builder
  # Cota explícita: si el run se cuelga (registro caído, push bloqueado) no queda corriendo para siempre.
  timeouts:
    pipeline: 30m0s
  params:
    # Host del registro corporativo (Quay), sin protocolo.
    - name: registry-host
      value: CHANGE_ME_QUAY_HOST
    - name: source-org
      value: company-test
    - name: target-org
      value: company-prod
    - name: image-name
      value: app-workshop
    # Digest EXACTO que corre en TEST: se lee del overlay de origen, no se inventa.
    - name: image-digest
      value: sha256:CHANGE_ME_DIGEST
    # Tag inmutable con el que la imagen aparece en la organización destino (el git-<sha> del CI).
    - name: image-tag
      value: git-CHANGE_ME
    # Overlay del ENTORNO DESTINO: la promoción escribe el digest ahí, nunca en el de origen.
    - name: target-overlay-path
      value: apps/demo-service/overlays/prod
    # Vacío = sin sync explícito (el auto-sync de Argo despliega igual); poner el nombre real para validar la salud.
    - name: argocd-application
      value: ""
  workspaces:
    - name: config
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          # Sin storageClassName se usa la StorageClass por defecto del cluster (debe ser RWO).
          resources:
            requests:
              storage: 1Gi
    - name: git-credentials
      # Secret basic-auth con permiso de push al repo de configuración; el mismo que usa el CI.
      secret:
        secretName: git-credentials
    - name: source-registry-credentials
      # LECTURA sobre company-test.
      secret:
        secretName: quay-push-credentials
    - name: promotion-credentials
      # ESCRITURA sobre company-prod: credencial SEPARADA del CI, creada FUERA de Git (ver README).
      secret:
        secretName: quay-promotion-credentials
    - name: signing-key
      # Llavero cosign: la promoción solo usa la clave PÚBLICA para verificar la
      # firma antes de copiar. En un namespace de release donde no deba existir la
      # clave privada, se monta un Secret que contenga únicamente cosign.pub.
      secret:
        secretName: cosign-signing-key
