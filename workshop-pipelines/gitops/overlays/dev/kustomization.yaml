# El pipeline se instala en el namespace de desarrollo, que es donde se
# construye y se publica la imagen del entorno.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop-demo-dev

resources:
  - ../../base

# El host del registro es un dato del ENTORNO: la base deja CHANGE_ME_QUAY_HOST
# y el overlay lo resuelve. Argo no sustituye marcadores, asi que sin esto la
# Task recibe el literal y falla con "couldn't parse image name".
patches:
  - path: pipeline-ci-tooling-images.yaml
    target:
      kind: Pipeline
      name: ci-build-image
