# Pipeline de CD: valida el manifiesto y sincroniza con Argo CD.
#
# Es la mitad "despliegue" del flujo. Lo dispara el git push que hace el CI al
# repo de configuración. CD NO reconstruye ni toca el código: solo lee el repo de
# CONFIGURACIÓN, valida que el overlay renderiza, y le pide a Argo que sincronice
# la Application.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-deploy-application
spec:
  params:
    - {name: config-repo, default: "https://github.com/rh-workshop/workshop-demo-app-config.git"}
    # Rama del repo de configuración que se valida y se sincroniza.
    - {name: config-revision, default: main}
    - {name: overlay-path, default: apps/demo-service/overlays/dev}
    # Nombre REAL de la Application en Argo CD (el ApplicationSet la genera con prefijo "app-").
    - {name: argocd-application, default: app-demo-service-dev}
  workspaces:
    - name: config
  tasks:
    - name: clone-config-repo
      # Un reintento absorbe los fallos transitorios de red contra el repositorio remoto.
      retries: 1
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: URL, value: $(params.config-repo)}
        - {name: REVISION, value: $(params.config-revision)}
      workspaces: [{name: output, workspace: config}]

    - name: validate-kustomize-manifests
      runAfter: [clone-config-repo]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: openshift-client}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: SCRIPT, value: "oc kustomize $(params.overlay-path)"}
      workspaces: [{name: manifest_dir, workspace: config}]

    - name: sync-with-argocd
      runAfter: [validate-kustomize-manifests]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: argocd-task-sync-and-wait}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: application-name, value: $(params.argocd-application)}
        # Con auto-sync activo Argo solo acepta sincronizar a la MISMA revisión que sigue la Application (HEAD lo rechaza).
        - {name: revision, value: $(params.config-revision)}
