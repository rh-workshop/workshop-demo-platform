# Pipeline de CD: valida el manifiesto y sincroniza con Argo CD.
#
# Es la mitad "despliegue" del flujo, y se lanza A MANO (oc create -f runs/...):
# no hay Triggers/EventListener configurados. Con el auto-sync de las Applications
# (Automated + Prune) el despliegue ocurre solo tras el push del CI; este pipeline
# NO es la puerta del despliegue, sino una herramienta de validación bajo demanda:
# comprueba que el overlay renderiza (kustomize), fuerza un sync explícito a una
# revisión concreta y ESPERA a que la Application quede Healthy, con diagnóstico
# si no converge. Útil antes de una demo o tras tocar overlays a mano.
# CD NO reconstruye ni toca el código: solo lee el repo de CONFIGURACIÓN.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-deploy-application
spec:
  params:
    - {name: config-repo, default: "https://github.com/rh-workshop/workshop-demo-app-config.git"}
    # Rama del repo de configuración que se valida y se sincroniza.
    - {name: config-revision, default: main}
    - {name: overlay-path, default: apps/demo-service/overlays/dev}
    # Nombre REAL de la Application en Argo CD (el ApplicationSet la genera con prefijo "app-").
    - {name: argocd-application, default: app-demo-service-dev}
    # URL del servicio ya expuesto, para la prueba de humo. Vacío = no se comprueba.
    - {name: target-url, default: ""}
    # Código HTTP esperado: 200 si la ruta es abierta, 401 si exige JWT y solo se
    # quiere verificar que el gateway y la AuthPolicy están en su sitio.
    - {name: expected-status, default: "200"}
  workspaces:
    - name: config
  tasks:
    - name: clone-config-repo
      # Un reintento absorbe los fallos transitorios de red contra el repositorio remoto.
      retries: 1
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: URL, value: $(params.config-repo)}
        - {name: REVISION, value: $(params.config-revision)}
      workspaces: [{name: output, workspace: config}]

    - name: validate-kustomize-manifests
      runAfter: [clone-config-repo]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: openshift-client}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: SCRIPT, value: "oc kustomize $(params.overlay-path)"}
      workspaces: [{name: manifest_dir, workspace: config}]

    - name: sync-with-argocd
      runAfter: [validate-kustomize-manifests]
      # Task propia (imagen Red Hat de Argo CD, timeout explícito y diagnóstico), no la ClusterTask community.
      taskRef: {name: argocd-sync}
      params:
        - {name: application-name, value: $(params.argocd-application)}
        # Con auto-sync activo Argo solo acepta sincronizar a la MISMA revisión que sigue la Application (HEAD lo rechaza).
        - {name: revision, value: $(params.config-revision)}

    # Última comprobación: que el servicio RESPONDA. Que Argo diga Healthy solo
    # significa que los pods arrancaron; un HTTPRoute mal formado, un hostname
    # equivocado o una AuthPolicy que rechaza todo dejan la Application en verde y
    # el servicio inalcanzable. Se omite si no se pasa target-url.
    - name: smoke-test
      runAfter: [sync-with-argocd]
      when:
        - input: $(params.target-url)
          operator: notin
          values: [""]
      taskRef: {name: smoke-test}
      params:
        - {name: target-url, value: $(params.target-url)}
        - {name: expected-status, value: $(params.expected-status)}
