# Cuenta de servicio con la que se ejecuta el pipeline.
#
# Se declara una cuenta propia en lugar de reutilizar "pipeline" o "default"
# para poder concederle exactamente los permisos que necesita: publicar en el
# registro corporativo (Quay, con su Secret de robot) y nada más.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: builder
  labels:
    app.kubernetes.io/part-of: workshop-gitops
