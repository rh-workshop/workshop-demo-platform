# Task de TAGGING: avanza el tag MÓVIL hacia el digest ya firmado y escaneado.
#
# Esquema de etiquetado del pipeline:
#   - Tag INMUTABLE git-<sha-corto>: lo publica la construcción y nunca se mueve;
#     es la trazabilidad humana commit -> imagen.
#   - Tag MÓVIL (p. ej. "dev"): puntero de conveniencia al último digest BUENO;
#     solo avanza cuando la imagen ya pasó firma y escaneo, por eso esta task
#     corre DESPUÉS de esas puertas.
#   - El DESPLIEGUE va SIEMPRE por digest: un tag móvil puede reapuntarse (o
#     envenenarse) sin que el cluster lo note, y además rompe la reproducibilidad
#     y el rollback; el digest identifica criptográficamente el binario exacto.
#
# skopeo copia por digest DENTRO del mismo registro: no reconstruye ni re-sube
# capas, solo añade la referencia del tag al manifiesto ya existente.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: image-tag
spec:
  params:
    # Repositorio de la imagen SIN tag, p. ej. quay.example.com/company/api-service.
    - {name: image-repository, type: string}
    # Digest firmado y escaneado al que se apunta el tag móvil.
    - {name: image-digest, type: string}
    # Nombre del tag móvil; "latest" está prohibido por política de ACS.
    - {name: moving-tag, type: string, default: dev}
  workspaces:
    # Secret con config.json (credencial del robot del registro) para escribir el tag.
    - name: registry-credentials
  steps:
    - name: skopeo-retag
      image: registry.redhat.io/rhel9/skopeo:9.8
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      script: |
        #!/usr/bin/env sh
        set -eu
        AUTH="$(workspaces.registry-credentials.path)/config.json"
        skopeo copy --authfile "$AUTH" \
          "docker://$(params.image-repository)@$(params.image-digest)" \
          "docker://$(params.image-repository):$(params.moving-tag)"
        echo "Tag móvil $(params.moving-tag) -> $(params.image-digest)"
