# Permiso para publicar imágenes en el registro interno de OpenShift.
#
# El rol "system:image-builder" autoriza a escribir ImageStreams del namespace.
# En una plataforma real, la publicación sería contra el registro corporativo
# (Quay) y la credencial se inyectaría como Secret de tipo docker, referenciado
# por NOMBRE desde el workspace "dockerconfig" de la tarea de construcción.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: builder-image-builder
  labels:
    app.kubernetes.io/part-of: workshop-gitops
subjects:
  - kind: ServiceAccount
    name: builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
