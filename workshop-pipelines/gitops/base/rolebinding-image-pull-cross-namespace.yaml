# Permiso de descarga de imagen para TODOS los servicios del workshop.
#
# El pipeline publica las imágenes en el ImageStream de workshop-demo-dev (el
# namespace que fija el overlay), pero los pods corren cada uno en su propio
# namespace: sin este permiso caerían en ImagePullBackOff.
#
# Es UN solo RoleBinding porque el permiso es idéntico para todos: solo cambia
# el grupo de ServiceAccounts consumidor. Al crear un servicio nuevo se añade
# una línea a subjects, no un fichero ni una Application.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-pull-cross-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:api-demo-dev
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:bluegreen-demo-dev
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:canary-demo-dev
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:circuit-breaker-demo-dev
