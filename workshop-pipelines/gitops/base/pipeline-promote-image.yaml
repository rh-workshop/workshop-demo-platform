# Pipeline de PROMOCIÓN: copia una imagen entre organizaciones de Quay y
# escribe el MISMO digest en el overlay del entorno destino.
#
# Es el tercer pipeline, complementario del CI y del CD: el CI publica en la
# organización del entorno de desarrollo; a test/prod/contingencia NO se publica
# nunca desde CI (sus robots pusher son de solo lectura) — se PROMOCIONA con
# este pipeline. La copia va con `skopeo copy --all` (manifiesto completo,
# todas las arquitecturas): copiar el manifiesto en vez de reconstruir es lo que
# conserva el digest, así lo validado en test es byte a byte lo que corre en prod.
#
# CREDENCIALES — el corazón del aislamiento:
#   · source-registry-credentials: LECTURA sobre la organización origen (vale el puller).
#   · promotion-credentials: ESCRITURA sobre la organización destino. Es una
#     credencial SEPARADA del pusher del CI a propósito: el pusher de CI no tiene
#     write en prod/contingencia, y dársela rompería el aislamiento que justifica
#     separar las organizaciones.
#
# DOS PUERTAS ANTES DE COPIAR: verify-signature (el digest viene firmado por el
# pipeline) y verify-provenance (con require-release-provenance=true, el commit
# de la imagen está en main y lleva tag semver — GitFlow: a prod solo entran
# releases, no builds de una rama cualquiera).
#
# UN SOLO PIPELINE PARAMETRIZADO sirve para dev->test y test->prod: la barrera
# hacia prod NO la pone el pipeline sino el RBAC — quién puede crear un
# PipelineRun en el namespace donde existe el Secret con escritura sobre
# company-prod (ver el README de workshop-pipelines).
#
# La promoción del overlay es el mismo patrón que el CI: kustomize edit set
# image + push con reintento; el auto-sync de Argo despliega. El sync explícito
# final es OPCIONAL (param argocd-application vacío = no se pide).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: promote-image
spec:
  params:
    # Host del registro corporativo (Quay), sin protocolo, p. ej. quay.example.com.
    - name: registry-host
    # Organización ORIGEN de la copia (donde la imagen ya está validada), p. ej. company-dev.
    - name: source-org
    # Organización DESTINO de la promoción, p. ej. company-test o company-prod.
    - name: target-org
    # Nombre del repositorio de la imagen en Quay (igual en todas las organizaciones), p. ej. app-workshop.
    - name: image-name
    # Digest EXACTO a promocionar (sha256:...): la identidad criptográfica, nunca un tag.
    - name: image-digest
    # Tag con el que la imagen aparece en la organización destino; el inmutable git-<sha> del CI.
    - name: image-tag
    # CÓMO llega el digest a Git. Por defecto "pr": este pipeline es el camino a
    # test, prod y contingencia, y esos ambientes exigen revisión. "direct"
    # empuja a la rama sin que nadie apruebe — solo para ambientes de trabajo.
    - {name: config-push-mode, default: pr}
    # Repo de configuración donde vive el overlay del entorno destino.
    - {name: config-repo, default: "https://github.com/rh-workshop/workshop-demo-app-config.git"}
    # Rama del repo de configuración: los entornos se separan por OVERLAY, no por rama.
    - {name: config-revision, default: main}
    # Overlay del entorno destino donde se fija el digest, p. ej. apps/demo-service/overlays/test.
    - name: target-overlay-path
    # "true" (por defecto) exige que el digest venga FIRMADO antes de promocionarlo.
    # Nunca se pone en "false" en un entorno regulado: es la unica puerta que impide
    # promocionar a prod una imagen que no salio del pipeline.
    - {name: verify-signature, default: "true"}
    # PROCEDENCIA GitFlow (Zero Trust): con "true", el commit del que salió la imagen
    # debe estar en main Y llevar un tag semver de git — solo así entra a prod. Va en
    # "true" en los runs hacia prod/contingencia; dev->test se queda en "false"
    # (a test llegan builds de develop/release que aún no están en main).
    - {name: require-release-provenance, default: "false"}
    # Repo de APLICACIÓN contra el que se comprueba la procedencia del commit.
    - {name: app-repo, default: "https://github.com/rh-workshop/workshop-demo-app.git"}
    # Nombre LÓGICO de la imagen en el kustomization (campo images[].name), no la URL del registro.
    - {name: kustomize-image-name, default: app-workshop}
    # Application de Argo a sincronizar tras el push; VACÍO = no se pide sync (el auto-sync despliega igual).
    - {name: argocd-application, default: ""}
  workspaces:
    - name: config
    # Token con permiso de push al repo de configuración (mismo formato basic-auth que el CI).
    - name: git-credentials
    # Authfile de LECTURA sobre la organización origen (el robot puller basta).
    - name: source-registry-credentials
    # Authfile de ESCRITURA sobre la organización destino: la credencial de promoción, SEPARADA del pusher de CI.
    - name: promotion-credentials
    # Secret cosign-signing-key: solo se usa la clave PÚBLICA, para verificar antes de promocionar.
    - name: signing-key
  results:
    - name: promoted-image
      value: $(tasks.copy-image.results.promoted-image)
  tasks:
    # PUERTA DE ENTRADA: el digest a promocionar DEBE venir firmado por el pipeline.
    # Sin esto, quien tenga la credencial de promoción puede subir a prod cualquier
    # digest que exista en la organización origen — incluida una imagen colocada a
    # mano — porque skopeo copia lo que se le diga sin preguntar de dónde salió.
    #
    # El interruptor se evalúa DENTRO del step y no con un `when` de Tekton: una
    # task saltada por `when` arrastra a sus dependientes por runAfter, así que la
    # promoción entera se saltaría con ella.
    - name: verify-signature
      params:
        - {name: image-ref, value: "$(params.registry-host)/$(params.source-org)/$(params.image-name)@$(params.image-digest)"}
        - {name: verify-signature, value: $(params.verify-signature)}
      workspaces:
        - {name: signing-key, workspace: signing-key}
        - {name: registry-credentials, workspace: source-registry-credentials}
      taskSpec:
        params:
          - {name: image-ref, type: string}
          - {name: verify-signature, type: string}
        workspaces:
          - name: signing-key
          - name: registry-credentials
        steps:
          - name: cosign-verify
            # Imagen de cosign soportada por Red Hat (Trusted Artifact Signer): la misma que firma.
            image: registry.redhat.io/rhtas/cosign-rhel9:1.3.7
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            env:
              - name: DOCKER_CONFIG
                value: $(workspaces.registry-credentials.path)
            script: |
              #!/usr/bin/env sh
              set -eu
              if [ "$(params.verify-signature)" != "true" ]; then
                echo "AVISO: verificacion de firma DESACTIVADA (verify-signature=$(params.verify-signature))."
                echo "Se promocionara un digest cuya procedencia NO se ha comprobado."
                exit 0
              fi
              # Solo se usa cosign.pub: la clave PRIVADA no hace falta para verificar.
              # --insecure-ignore-tlog porque la firma se emite sin subir a Rekor (ver image-sign-task).
              cosign verify --key "$(workspaces.signing-key.path)/cosign.pub" \
                --insecure-ignore-tlog "$(params.image-ref)" > /dev/null
              echo "Firma verificada en origen: $(params.image-ref)"

    # PUERTA DE PROCEDENCIA (Zero Trust): la firma prueba que la imagen salió del
    # pipeline, pero NO de qué rama — cualquier digest firmado desde una feature
    # podría promocionarse a prod. Esta task cierra ese hueco: lee el commit que
    # el build estampó como etiqueta OCI org.opencontainers.image.revision (viaja
    # DENTRO del config de la imagen, cubierto por el digest que cosign firma, así
    # que es a prueba de manipulación una vez firmada) y comprueba contra el repo
    # de aplicación REAL que ese commit (1) existe, (2) es ancestro de main y
    # (3) lleva un tag semver de git. Solo lo publicado desde main entra a prod.
    #
    # LO QUE ESTA PUERTA NO CUBRE (control compensatorio = RBAC + revisión): se
    # confía en que el CI estampó GIT_COMMIT honestamente — la cadena es firma
    # (identidad del pipeline) + etiqueta (identidad del commit) + git (identidad
    # de la rama). Quien tenga la llave de firma puede fabricar la cadena entera;
    # esa llave está fuera del alcance de los desarrolladores (ver README).
    #
    # El interruptor se evalúa DENTRO del step, no con `when`: una task saltada
    # arrastraría por runAfter a toda la promoción (misma trampa que en verify-signature).
    - name: verify-provenance
      runAfter: [verify-signature]
      params:
        - {name: image-ref, value: "$(params.registry-host)/$(params.source-org)/$(params.image-name)@$(params.image-digest)"}
        - {name: require-release-provenance, value: $(params.require-release-provenance)}
        - {name: app-repo, value: $(params.app-repo)}
      workspaces:
        - {name: registry-credentials, workspace: source-registry-credentials}
      taskSpec:
        params:
          - {name: image-ref, type: string}
          - {name: require-release-provenance, type: string}
          - {name: app-repo, type: string}
        workspaces:
          - name: registry-credentials
        # Volumen efímero entre pasos: el commit extraído de la imagen pasa al paso de git.
        volumes:
          - {name: provenance, emptyDir: {}}
        stepTemplate:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: provenance, mountPath: /var/prov}
        steps:
          # Paso 1: extraer del CONFIG de la imagen el commit que estampó el build.
          - name: read-image-revision
            image: registry.redhat.io/rhel9/skopeo:9.8
            script: |
              #!/usr/bin/env sh
              set -eu
              if [ "$(params.require-release-provenance)" != "true" ]; then
                echo "Procedencia de release NO exigida en este salto (require-release-provenance=false)."
                printf 'skip' > /var/prov/commit
                exit 0
              fi
              # La etiqueta viaja en el config de la imagen, cuyo hash cubre el digest firmado.
              COMMIT=$(skopeo inspect --config --authfile "$(workspaces.registry-credentials.path)/config.json" \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "docker://$(params.image-ref)")
              # Falla CERRADO: sin etiqueta no hay procedencia que verificar, y eso ya descalifica.
              if [ -z "$COMMIT" ] || [ "$COMMIT" = "<no value>" ]; then
                echo "ERROR: la imagen no trae la etiqueta org.opencontainers.image.revision; procedencia inverificable." >&2
                exit 1
              fi
              printf '%s' "$COMMIT" > /var/prov/commit
              echo "Commit estampado en la imagen: ${COMMIT}"
          # Paso 2: contrastar ese commit con el repositorio de aplicación REAL.
          - name: check-commit-on-main
            # La imagen de Argo CD del operador GitOps ya instalado trae git: no hace falta traer nada nuevo al cluster.
            image: registry.redhat.io/openshift-gitops-1/argocd-rhel9:1.21
            env:
              # HOME escribible para git (el pod corre con UID aleatorio de OpenShift).
              - {name: HOME, value: /tmp}
            script: |
              #!/usr/bin/env sh
              set -eu
              COMMIT=$(cat /var/prov/commit)
              if [ "$COMMIT" = "skip" ]; then
                echo "Verificación de procedencia saltada en este salto."
                exit 0
              fi
              # Clone COMPLETO de solo lectura (repo público; para uno privado se monta git-credentials).
              git clone --quiet "$(params.app-repo)" /var/prov/src
              cd /var/prov/src
              # (1) El commit tiene que EXISTIR en el repositorio canónico.
              if ! git cat-file -e "${COMMIT}^{commit}" 2>/dev/null; then
                echo "ERROR: el commit ${COMMIT} no existe en $(params.app-repo); la imagen no salió de este repositorio." >&2
                exit 1
              fi
              # (2) Tiene que estar en la historia de main: nada de ramas sueltas hacia prod.
              if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
                echo "ERROR: el commit ${COMMIT} no es ancestro de main; a prod solo se promociona lo publicado en main." >&2
                exit 1
              fi
              # (3) Tiene que llevar un tag semver: una RELEASE deliberada, no un commit cualquiera de main.
              TAG_SEMVER=$(git tag --points-at "$COMMIT" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
              if [ -z "$TAG_SEMVER" ]; then
                echo "ERROR: el commit ${COMMIT} está en main pero no lleva tag semver; etiqueta la release (git tag vX.Y.Z) antes de promocionar." >&2
                exit 1
              fi
              echo "Procedencia verificada: commit ${COMMIT}, en main, release ${TAG_SEMVER}."

    # Copia el manifiesto completo (--all: todas las arquitecturas y la lista de
    # manifiestos) y VERIFICA que el digest en destino es el mismo que salió.
    - name: copy-image
      runAfter: [verify-signature, verify-provenance]
      # Un reintento absorbe los fallos transitorios de red contra el registro.
      retries: 1
      params:
        - {name: registry-host, value: $(params.registry-host)}
        - {name: source-org, value: $(params.source-org)}
        - {name: target-org, value: $(params.target-org)}
        - {name: image-name, value: $(params.image-name)}
        - {name: image-digest, value: $(params.image-digest)}
        - {name: image-tag, value: $(params.image-tag)}
      workspaces:
        - {name: source-registry-credentials, workspace: source-registry-credentials}
        - {name: promotion-credentials, workspace: promotion-credentials}
      taskSpec:
        params:
          - {name: registry-host, type: string}
          - {name: source-org, type: string}
          - {name: target-org, type: string}
          - {name: image-name, type: string}
          - {name: image-digest, type: string}
          - {name: image-tag, type: string}
        workspaces:
          - name: source-registry-credentials
          - name: promotion-credentials
        results:
          # Referencia completa por digest en la organización destino: lo que se escribe en el overlay.
          - name: promoted-image
        steps:
          - name: skopeo-copy-and-verify
            image: registry.redhat.io/rhel9/skopeo:9.8
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              set -eu
              SRC="docker://$(params.registry-host)/$(params.source-org)/$(params.image-name)@$(params.image-digest)"
              DST="docker://$(params.registry-host)/$(params.target-org)/$(params.image-name):$(params.image-tag)"
              echo "Promocionando ${SRC} -> ${DST}"
              # --all copia el manifiesto COMPLETO: es lo que hace que el digest se conserve en destino.
              skopeo copy --all \
                --src-authfile "$(workspaces.source-registry-credentials.path)/config.json" \
                --dest-authfile "$(workspaces.promotion-credentials.path)/config.json" \
                "$SRC" "$DST"
              # Verificación: el digest en destino DEBE ser el promocionado; si difiere, algo reescribió el manifiesto y se aborta.
              DIGEST_DESTINO=$(skopeo inspect --no-tags --format '{{.Digest}}' \
                --authfile "$(workspaces.promotion-credentials.path)/config.json" "$DST")
              if [ "$DIGEST_DESTINO" != "$(params.image-digest)" ]; then
                echo "ERROR: el digest en destino (${DIGEST_DESTINO}) no coincide con el promocionado ($(params.image-digest))." >&2
                exit 1
              fi
              echo "Digest verificado en destino: ${DIGEST_DESTINO}"
              # La firma y la atestación SBOM de cosign NO viajan con el manifiesto:
              # cosign las publica como TAGS aparte del mismo repositorio, con el
              # patrón sha256-<hex>.sig y sha256-<hex>.att. Sin copiarlas, la imagen
              # llega a test/prod DESNUDA: la política de admisión que exige firma la
              # rechazaría y se perdería la evidencia de procedencia justo en el
              # entorno donde más falta hace demostrarla.
              ADJUNTO="$(printf '%s' "$(params.image-digest)" | tr ':' '-')"
              for SUFIJO in sig att; do
                SRC_ADJ="docker://$(params.registry-host)/$(params.source-org)/$(params.image-name):${ADJUNTO}.${SUFIJO}"
                DST_ADJ="docker://$(params.registry-host)/$(params.target-org)/$(params.image-name):${ADJUNTO}.${SUFIJO}"
                if skopeo inspect --no-tags --raw --authfile "$(workspaces.source-registry-credentials.path)/config.json" "$SRC_ADJ" >/dev/null 2>&1; then
                  skopeo copy --all \
                    --src-authfile "$(workspaces.source-registry-credentials.path)/config.json" \
                    --dest-authfile "$(workspaces.promotion-credentials.path)/config.json" \
                    "$SRC_ADJ" "$DST_ADJ"
                  echo "Adjunto .${SUFIJO} promocionado."
                else
                  # La firma es OBLIGATORIA; la atestación SBOM puede no existir en imágenes anteriores al SBOM.
                  if [ "$SUFIJO" = "sig" ]; then
                    echo "ERROR: la imagen origen no tiene firma (.sig) publicada; no se promociona sin cadena de custodia." >&2
                    exit 1
                  fi
                  echo "AVISO: la imagen origen no tiene atestación SBOM (.att); se promociona igualmente."
                fi
              done
              printf '%s/%s/%s@%s' "$(params.registry-host)" "$(params.target-org)" "$(params.image-name)" "$(params.image-digest)" \
                | tee $(results.promoted-image.path)

    - name: clone-config-repo
      runAfter: [copy-image]
      # Un reintento absorbe los fallos transitorios de red contra el repositorio remoto.
      retries: 1
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-clone}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: URL, value: $(params.config-repo)}
        - {name: REVISION, value: $(params.config-revision)}
      workspaces: [{name: output, workspace: config}]

    # Fija en el overlay destino la imagen de la ORGANIZACIÓN DESTINO con el MISMO
    # digest: el entorno promocionado descarga de su propia organización.
    - name: set-image-digest
      runAfter: [clone-config-repo]
      params:
        - {name: target-overlay-path, value: $(params.target-overlay-path)}
        - {name: kustomize-image-name, value: $(params.kustomize-image-name)}
        - {name: promoted-image, value: $(tasks.copy-image.results.promoted-image)}
      taskSpec:
        params:
          - {name: target-overlay-path, type: string}
          - {name: kustomize-image-name, type: string}
          - {name: promoted-image, type: string}
        workspaces:
          - name: config
        steps:
          - name: kustomize-set-image
            # La imagen de Argo CD del operador GitOps ya instalado trae kustomize y git: no hace falta traer nada nuevo al cluster.
            image: registry.redhat.io/openshift-gitops-1/argocd-rhel9:1.21
            workingDir: $(workspaces.config.path)/$(params.target-overlay-path)
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
              set -eu
              # newName y digest completos: al promocionar cambia la ORGANIZACIÓN de la imagen, no solo el digest.
              kustomize edit set image "$(params.kustomize-image-name)=$(params.promoted-image)"
              echo "Overlay actualizado:" && cat kustomization.yaml

    - name: push-config
      runAfter: [set-image-digest]
      taskRef: {resolver: cluster, params: [{name: kind, value: task}, {name: name, value: git-cli}, {name: namespace, value: openshift-pipelines}]}
      params:
        - {name: GIT_USER_NAME, value: "pipeline-promote"}
        - {name: GIT_USER_EMAIL, value: "pipeline-promote@ejemplo.local"}
        # La task git-cli borra el workspace entero antes de correr (DELETE_EXISTING vale "true" por defecto): hay que apagarlo o pierde el clon de la tarea anterior.
        - {name: DELETE_EXISTING, value: "false"}
        - name: GIT_SCRIPT
          value: |
            set -eu
            # El workspace se monta en rutas distintas según la task (git-clone lo llama "output" y git-cli "source"): se parte de la ruta que declara ESTA task.
            cd $(workspaces.source.path)
            # Se añade SOLO el fichero tocado: un "commit -a" arrastraría cualquier otro cambio del workspace.
            git add $(params.target-overlay-path)/kustomization.yaml
            # Sin cambios (mismo digest ya promocionado) no hay nada que hacer: se sale con éxito.
            if git diff --cached --quiet; then
              echo "El overlay ya apunta a este digest en la organización destino; no se promociona nada."
              exit 0
            fi
            git commit -m "ci: promote $(params.image-name) to $(params.target-org) at digest $(params.image-digest)"

            # PROMOCIONAR POR PULL REQUEST ES EL MODO POR DEFECTO, y aquí importa
            # más que en el CI: este pipeline es el único camino hacia test, prod
            # y contingencia. Empujar directo a la rama de configuración dejaría
            # que una promoción llegue a producción sin que nadie la mire, que es
            # justo lo que el RBAC y la verificación de firma existen para evitar.
            # Argo CD recomienda promocionar por PR; con "direct" se pierde esa
            # barrera y solo debería usarse en ambientes de trabajo.
            if [ "$(params.config-push-mode)" = "pr" ]; then
              # La rama lleva el destino y el digest corto: dos promociones
              # distintas nunca colisionan y el nombre dice qué promociona.
              RAMA="ci/promote-$(params.image-name)-$(params.target-org)-$(printf '%s' "$(params.image-digest)" | cut -c8-19)"
              # --force sobre SU propia rama: reejecutar reescribe la suya, no la de otro.
              if git push --force origin "HEAD:refs/heads/${RAMA}"; then
                echo "Rama publicada: ${RAMA}"
                echo "Abre el Pull Request hacia $(params.config-revision) para completar la promoción."
                exit 0
              fi
              echo "No se pudo publicar la rama ${RAMA}." >&2
              exit 1
            fi

            # Reintento con rebase: si otro PipelineRun empujó antes, el push sería non-fast-forward.
            # git-clone deja el repo en detached HEAD: hay que calificar la rama destino.
            for intento in 1 2 3; do
              if git push origin HEAD:$(params.config-revision); then
                exit 0
              fi
              echo "Push rechazado (intento ${intento}): se rebasa sobre el remoto y se reintenta."
              git fetch origin $(params.config-revision)
              git rebase FETCH_HEAD
            done
            echo "No se pudo empujar tras 3 intentos." >&2
            exit 1
      workspaces:
        - {name: source, workspace: config}
        - {name: basic-auth, workspace: git-credentials}

    # OPCIONAL: sync explícito + espera de salud de la Application del entorno
    # destino. Con el param vacío la tarea se salta: el auto-sync despliega igual.
    - name: sync-application
      runAfter: [push-config]
      when:
        - input: $(params.argocd-application)
          operator: notin
          values: [""]
        # En modo "pr" el digest aún NO está en la rama que Argo observa: vive en
        # una rama pendiente de revisión. Sincronizar aquí desplegaría lo viejo y
        # daría un falso "promoción completada" — el despliegue ocurre cuando se
        # aprueba el Pull Request, que es exactamente el punto de la revisión.
        - input: $(params.config-push-mode)
          operator: in
          values: ["direct"]
      taskRef: {name: argocd-sync}
      params:
        - {name: application-name, value: $(params.argocd-application)}
        - {name: revision, value: $(params.config-revision)}

  # El resumen corre SIEMPRE (finally), incluso si una tarea cortó el pipeline.
  finally:
    - name: pipeline-summary
      params:
        - {name: verify-status, value: $(tasks.verify-signature.status)}
        - {name: provenance-status, value: $(tasks.verify-provenance.status)}
        - {name: copy-status, value: $(tasks.copy-image.status)}
        - {name: promote-status, value: $(tasks.push-config.status)}
        - {name: sync-status, value: $(tasks.sync-application.status)}
      taskSpec:
        params:
          - {name: verify-status, type: string}
          - {name: provenance-status, type: string}
          - {name: copy-status, type: string}
          - {name: promote-status, type: string}
          - {name: sync-status, type: string}
        steps:
          - name: report
            image: registry.redhat.io/ubi9/ubi-minimal:9.6
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
            script: |
              #!/usr/bin/env sh
