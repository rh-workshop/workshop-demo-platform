apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - namespace-gateway.yaml
  - kuadrant.yaml
  - gateway.yaml
  - shared-gateway-tlspolicy.yaml
  - shared-gateway-default-authpolicy.yaml
  # Puerta de entrada del router al gateway; una sola para todos los servicios.
  - route-shared-gateway.yaml
  # Activa el plugin de Kuadrant en la consola web de OpenShift.
  - console-kuadrant-plugin.yaml
