# TLSPolicy: cert-manager emite el cert del Gateway compartido automaticamente.
#
# Sin esto, el secret shared-gateway-https del Gateway no lo genera nadie de forma
# declarativa (antes salia de un recurso fuera de Git). El issuer se parchea por
# overlay: en el lab un selfsigned; en prod la CA corporativa o ACME real
# (NO-PRODUCCION usar selfsigned; ver docs/production-outside-the-lab.md).
#
# CUBRE LOS DOS LISTENERS. El targetRef apunta al Gateway entero, no a un
# listener, asi que cert-manager emite un certificado por cada uno: el del
# dominio del cluster y el del dominio de NEGOCIO. Eso es lo que hace posible el
# failover — sin cert para el hostname compartido, conmutar el DNS fallaria en el
# handshake TLS aunque la ruta si estuviera adjunta.
apiVersion: kuadrant.io/v1
kind: TLSPolicy
metadata:
  name: shared-gateway-tls
  namespace: platform-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-gateway
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
