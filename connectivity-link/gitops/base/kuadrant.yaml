# Instancia de Kuadrant: enciende el plano de control de Connectivity Link.
#
# Kuadrant es la capa de politicas sobre Gateway API nativo: AuthPolicy (quien
# entra), RateLimitPolicy (cuanto), DNSPolicy y TLSPolicy. Este CR solo levanta
# los controladores (Authorino, Limitador); las politicas concretas de cada
# servicio viven en el repo de configuracion de despliegue, junto a su ruta.
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
spec:
  observability:
    # enable: true crea los ServiceMonitors/PodMonitors de Authorino, Limitador y
    # el gateway. Requiere user workload monitoring habilitado en el cluster. Con
    # {} (vacio) no se habilitaba nada.
    enable: true
  mtls:
    # Cifra el trafico interno gateway<->Authorino (decisiones de auth) y
    # gateway<->Limitador (counters de rate-limit), que por defecto viaja en claro.
    # Postura Zero Trust para un entorno bancario.
    enable: true
    authorino: true
    limitador: true
