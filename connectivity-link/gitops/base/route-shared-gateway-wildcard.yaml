# Route de OpenShift que entrega al Gateway compartido el tráfico que entra por
# el router. NO expone ningún servicio: eso lo hacen los HTTPRoute (Connectivity
# Link), que viven junto a cada aplicación.
#
# POR QUÉ HACE FALTA: en este cluster el IngressController publica con
# HostNetwork y el DNS wildcard *.apps.<dominio> resuelve al router HAProxy.
# MetalLB sí da IP externa al gateway, pero es una RFC1918 alcanzable solo desde
# la red de los nodos, y ningún DNS público apunta ahí. El tráfico de fuera entra
# por el router, y el router solo enruta hosts con una Route admitida: sin esto,
# 503 antes de llegar al gateway. En un cluster cuyo LoadBalancer sí tenga IP
# pública, esta Route sobra.
#
# passthrough porque el TLS lo termina el propio Gateway (listener mode:
# Terminate + TLSPolicy de Kuadrant): el router no debe abrir la conexión.
#
# UNA SOLA para todos: wildcardPolicy Subdomain hace que admita *.apps.<dominio>,
# el mismo ámbito que el listener del Gateway. Antes había una Route por servicio
# —declaradas además desde el repo de aplicaciones, que no debe tocar el
# namespace platform-gateway— y decenas más aplicadas a mano fuera de Git. Con
# esta, un servicio nuevo solo necesita su HTTPRoute.
#
# Requiere routeAdmission.wildcardPolicy: WildcardsAllowed en el IngressController.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shared-gateway-wildcard
  namespace: platform-gateway
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  # Host "ancla": lo que admite es su subdominio (*.apps.<dominio>), no este nombre.
  # Se parchea por overlay con el dominio real del cluster.
  host: gw.apps.cluster.ejemplo.com
  wildcardPolicy: Subdomain
  port:
    targetPort: 443
  tls:
    termination: passthrough
  to:
    kind: Service
    name: shared-gateway-istio
