apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: shared-gateway-default
  namespace: platform-gateway
spec:
  defaults:
    rules:
      authentication:
        token-valido:
          jwt:
            # Sustituir por el dominio del cluster de DESARROLLO: https://sso.apps.<cluster-dev>.<dominio-base>/realms/workshop
            issuerUrl: https://sso.apps.cluster-dev.ejemplo.com/realms/workshop
