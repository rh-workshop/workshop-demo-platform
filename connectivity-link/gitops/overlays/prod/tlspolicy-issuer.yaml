# En prod el cert del Gateway lo emite una CA real (ACME o CA corporativa), no el
# selfsigned del lab.
apiVersion: kuadrant.io/v1
kind: TLSPolicy
metadata:
  name: shared-gateway-tls
  namespace: platform-gateway
spec:
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: acme-produccion
