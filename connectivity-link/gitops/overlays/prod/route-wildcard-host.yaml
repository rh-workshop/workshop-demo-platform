# El host ancla debe caer bajo el MISMO dominio que el comodin del Gateway en
# este overlay: es lo que hace que el router admita *.apps.<cluster-prod> y se lo
# entregue al gateway.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: shared-gateway-wildcard
  namespace: platform-gateway
spec:
  # Sustituir por el dominio del cluster de PRODUCCION: gw.apps.<cluster-prod>.<dominio-base>
  host: gw.apps.cluster-prod.ejemplo.com
