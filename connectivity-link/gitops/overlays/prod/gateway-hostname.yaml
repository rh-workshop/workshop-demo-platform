# El dominio *.apps del cluster de prod.
#
# ES UN PATCH JSON, NO UN MERGE. Un strategic merge patch sobre `listeners`
# REEMPLAZA la lista entera —Kustomize no conoce la clave de mezcla de un CRD— y
# se llevaria por delante el listener `https-business`, que es justamente el que
# hace posible el DR. Con `op: replace` sobre un indice se toca SOLO el hostname.
#
# El indice 0 es el listener `https`; el 1 es `https-business`, que NO se parchea
# en ningun overlay a proposito: su hostname es el mismo en todos los sitios.
- op: replace
  path: /spec/listeners/0/hostname
  value: '*.apps.ocp.2rndh.sandbox213.opentlc.com'
