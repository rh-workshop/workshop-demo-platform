# El comodin apunta al dominio de apps del cluster HUB.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shared-gateway
  namespace: platform-gateway
spec:
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    # Dominio del cluster HUB. Un overlay por CLUSTER, no por ambiente: el hostname
    # es literal y dos clusters no pueden compartirlo.
    hostname: '*.apps.ocp.hq2ss.sandbox3270.opentlc.com'
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            shared-gateway-access: 'true'
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        name: shared-gateway-https
