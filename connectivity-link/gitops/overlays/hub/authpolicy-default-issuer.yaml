kind: AuthPolicy
metadata:
  name: shared-gateway-default
  namespace: platform-gateway
spec:
  defaults:
    rules:
      authentication:
        token-valido:
          jwt:
            # El hub NO despliega Keycloak (solo va a los spokes): el issuer del gateway del hub es el SSO del ambiente dev, que sirve a los servicios del workshop.
            issuerUrl: https://sso.apps.ocp.lplb4.sandbox3335.opentlc.com/realms/workshop
