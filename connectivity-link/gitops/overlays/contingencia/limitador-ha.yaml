# HA de Limitador en prod: 2 replicas + PDB. Limitador cuenta el rate-limit; con 1
# replica un drain corta el rate-limit del gateway.
# NO-PRODUCCION: con counters en memoria, escalar Limitador MULTIPLICA el limite
# efectivo (cada replica cuenta por su lado). En prod hace falta Redis compartido
# (ver docs/production-outside-the-lab.md) ANTES de subir replicas.
apiVersion: limitador.kuadrant.io/v1alpha1
kind: Limitador
metadata:
  name: limitador
  namespace: kuadrant-system
  annotations:
    # Mismo criterio que Authorino: el CR lo crea el operador Kuadrant; aqui solo se aportan replicas/pdb via SSA para no reemplazar el CR entero.
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  replicas: 2
  pdb:
    maxUnavailable: 1
