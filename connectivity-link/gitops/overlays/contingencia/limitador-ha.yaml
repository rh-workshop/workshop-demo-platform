# Limitador con UNA replica.
#
# Los contadores del rate-limit viven en memoria y no se comparten entre replicas:
# con 2, cada una cuenta por su lado y el limite efectivo se DUPLICA. Una replica
# aplica el limite correcto, a costa de que un drain corte el rate-limit unos
# segundos -- preferible a que el gateway deje pasar el doble de trafico del
# declarado en las RateLimitPolicy.
#
# Para HA real hace falta almacenamiento compartido (Redis) en spec.storage; con el
# se puede subir replicas y anadir un PDB. Ver docs/production-outside-the-lab.md.
apiVersion: limitador.kuadrant.io/v1alpha1
kind: Limitador
metadata:
  name: limitador
  namespace: kuadrant-system
  annotations:
    # El CR lo crea el operador Kuadrant: se aportan solo estos campos via SSA para no reemplazar el CR entero.
    argocd.argoproj.io/sync-options: ServerSideApply=true,SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  # Sin resources el pod corre BestEffort y es el primero en morir bajo presion.
  resourceRequirements:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
