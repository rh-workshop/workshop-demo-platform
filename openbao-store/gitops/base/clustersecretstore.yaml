# EL PUENTE entre el almacen y los ExternalSecret.
#
# Es LA PIEZA QUE CAMBIA al adoptar el material: un ExternalSecret nombra a este
# store y describe QUE clave quiere; el store dice DONDE esta el almacen y COMO
# autenticarse. Migrar a Azure Key Vault, AWS Secrets Manager o un Vault
# corporativo es reescribir ESTE fichero — los ExternalSecret no se tocan.
#
# Es `ClusterSecretStore` y no `SecretStore` porque debe servir a ExternalSecret
# de CUALQUIER namespace; un SecretStore solo alcanza el suyo.
#
# AUTENTICACION. Aqui por token, que es lo que admite el modo dev. En produccion
# se usa el metodo del proveedor: Workload Identity en Azure, IRSA en AWS o el
# auth de Kubernetes de Vault, donde la credencial es EFIMERA y no hay ningun
# token estatico que rotar ni custodiar.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: platform-vault
spec:
  provider:
    vault:
      # OpenBao habla el mismo protocolo que Vault: ESO lo trata igual.
      #
      # El ENDPOINT depende del cluster y lo resuelve el overlay: dentro del hub
      # es el Service interno; desde un cluster de carga, la Route publica del
      # hub. Por eso el valor de la base es un marcador.
      server: CHANGE_ME_VAULT_ENDPOINT
      # KV version 2: guarda historico de versiones de cada secreto, lo que
      # permite ver que cambio y volver atras. Es el modo recomendado.
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-dev-token
          key: token
          # El token vive en UN solo namespace del cluster, no repartido por ahi.
          # En el hub lo genera el playbook junto al almacen; en cada cluster de
          # carga lo replica la Policy de ACM require-vault-token, que lo lee del
          # hub sin que su valor pase por Git.
          namespace: openbao
