# En el HUB el almacen es local: se habla con su Service, sin salir del cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - target: {kind: ClusterSecretStore, name: platform-vault}
    patch: |
      - op: replace
        path: /spec/provider/vault/server
        value: https://openbao.openbao.svc:8200
      # La CA que firma el certificado del almacen. Sin ella ESO rechaza la
      # conexion con "x509: certificate signed by unknown authority": el
      # certificado lo emite la CA interna del cluster, no una publica.
      - op: add
        path: /spec/provider/vault/caProvider
        value:
          type: Secret
          name: openbao-tls
          namespace: openbao
          key: ca.crt
