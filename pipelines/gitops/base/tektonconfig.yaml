# Configuración global de OpenShift Pipelines (Tekton).
#
# El operador crea un TektonConfig con muchos valores por defecto; aquí solo se
# fija lo que de verdad se decide, para no pelear con el drift del operador. Lo
# importante es el bloque `chain`: activa Tekton Chains, que FIRMA cada imagen
# que construye un pipeline y guarda la firma junto a la imagen en el registro.
#
# `simplesigning` + almacenamiento `oci` es el formato que ACS 4.x sabe
# descubrir. La clave de firma NO va aquí: vive en el Secret `signing-secrets`
# del namespace.
#
# IMPORTANTE: Chains firma solo si `signing-secrets` TIENE la clave cosign. Si el
# secret está vacío (como salía por defecto), Chains no firma nada y ACS no
# encuentra ninguna .sig que verificar. Generar la clave (una vez):
#   cosign generate-key-pair k8s://openshift-pipelines/signing-secrets
#   oc delete pod -n openshift-pipelines -l app=tekton-chains-controller
# NO-PRODUCCIÓN: en prod la clave privada vive en Azure Key Vault y se sincroniza
# por ESO; y se firma en formato clásico .sig (cosign v3 firma DSSE por defecto y
# ACS 4.x no lo descubre). Ver docs/production-outside-the-lab.md.
#
# El almacenamiento oci de Chains empuja las firmas al registro: el SA
# 'pipeline' del namespace necesita credenciales de push a Quay (un pull/push
# secret con el robot 'pusher'). Se enlaza con:
#   oc secrets link pipeline <quay-push-secret> --for=mount -n openshift-pipelines
apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  targetNamespace: openshift-pipelines
  # profile: all incluye el dashboard y triggers. En un hub de CI de prod se puede
  # bajar a 'basic' (sin dashboard) para reducir superficie; se deja 'all' para que
  # el workshop tenga la consola de pipelines.
  profile: all
  # Retención de PipelineRuns: decisión explícita (auditoría vs disco), no el
  # default implicito del operador.
  pruner:
    resources:
      - pipelinerun
      - taskrun
    keep: 100
    schedule: "0 8 * * *"
  chain:
    # REPARTO DE FIRMA (evita firmar el mismo artefacto dos veces con dos llaves):
    #   · Chains  -> atestación in-toto del PipelineRun/TaskRun = PROCEDENCIA.
    #   · La Task image-sign -> firma de la IMAGEN por digest = lo que ACS verifica
    #     en la admisión y lo que la promoción exige antes de copiar.
    # Por eso artifacts.oci queda DESACTIVADO aquí: con 'oci' activo Chains firmaba
    # también la imagen, y cada verificador reconocía una llave distinta — algo
    # imposible de defender en una auditoría ("¿cuál firma es la autoritativa?").
    # Ambos mecanismos usan LA MISMA llave, en dos Secrets por dónde corre cada uno.
    artifacts.oci.storage: ""
    artifacts.taskrun.format: in-toto
    artifacts.taskrun.storage: oci
    artifacts.pipelinerun.format: in-toto
    artifacts.pipelinerun.storage: oci
    # transparency: registra las firmas en un log Rekor (prueba de que se firmó y
    # cuándo). Sin log, la firma pierde la mitad de su valor probatorio.
    #
    # DESACTIVADO A PROPÓSITO hasta que haya un Rekor INTERNO. Sin
    # `transparency.url`, Chains publica en el log PÚBLICO rekor.sigstore.dev: cada
    # entrada deja para siempre, y de forma inmutable, el nombre del registro
    # interno, el repositorio y el digest de artefactos corporativos. En banca eso
    # es una fuga de metadatos de infraestructura (ISO 27001:2022 5.14) y además
    # ata el pipeline a un servicio externo — si no hay egress a internet, Chains
    # falla al firmar. Se reactiva con las DOS líneas juntas, apuntando al Rekor
    # que despliega Red Hat Trusted Artifact Signer dentro del cluster.
    # transparency.url: https://rekor-server.trusted-artifact-signer.svc
    transparency.enabled: "false"
    disabled: false
