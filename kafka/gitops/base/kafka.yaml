# Cluster Kafka en modo KRaft (sin ZooKeeper): los roles viven en KafkaNodePool dedicados.
# Las réplicas y el almacenamiento NO se fijan aquí sino en los KafkaNodePool, y cada overlay los ajusta por ambiente.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: demo-kafka
  namespace: kafka
spec:
  kafka:
    # Reparte las réplicas de cada partición entre zonas usando la etiqueta estándar de los nodos:
    # sin esto las 3 réplicas pueden acabar en la misma zona y una caída de zona se las lleva todas.
    # En un cluster de una sola zona la etiqueta existe igual y no estorba.
    rack:
      topologyKey: topology.kubernetes.io/zone
    # Versión fijada: un upgrade del operador NO debe arrastrar un upgrade de brokers por sorpresa.
    # Se sube por PR, igual que la CSV del operador. Consultar la vigente con:
    # oc get kafka demo-kafka -n kafka -o jsonpath='{.status.kafkaVersion}'
    version: 4.2.0
    metadataVersion: 4.2-IV1
    listeners:
      # Listener interno con mTLS para los clientes que corren dentro del cluster.
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      # Listener externo por balanceador (MetalLB, que la plataforma ya despliega). Una Route no
      # sirve aquí: enruta por nombre de host sobre HTTP, y el protocolo de Kafka es binario sobre
      # TCP. Un balanceador entrega la conexión tal cual.
      # Consume una direccion del pool por CADA broker mas una de arranque: con un broker en
      # desarrollo son 2. El rango se ajusta al segmento real en el IPAddressPool de la plataforma.
      - name: external
        port: 9094
        type: loadbalancer
        tls: true
        authentication:
          type: tls
    # Autorización por ACL declarativas: cada cliente recibe sus permisos vía KafkaUser.
    # Sin superUsers a propósito: un superusuario bypasearía toda la autorización.
    authorization:
      type: simple
    # Métricas JMX en formato Prometheus, que recoge la monitorización de la plataforma.
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
    config:
      # Durabilidad: 3 réplicas por partición y 2 en sincronía como mínimo para aceptar escrituras.
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      # Los tópicos se declaran en Git: crear uno por accidente desde un cliente queda prohibido.
      auto.create.topics.enable: false
      # Un registro cifrado y comprimido supera el millón de bytes que trae Kafka por defecto.
      # Los clientes (Java y .NET) anuncian 2.5 MB: si el broker se queda en el default, rechaza
      # con RecordTooLargeException lo que el productor cree poder enviar. Ambos lados deben
      # declarar el MISMO límite, y replica.fetch.max.bytes ha de acompañarlo o el seguidor no
      # puede replicar un mensaje que el líder sí aceptó.
      message.max.bytes: 2500000
      replica.fetch.max.bytes: 2500000
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Cruise Control permite rebalancear particiones entre brokers sin parar el servicio.
  cruiseControl:
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: cruise-control-metrics-config.yml
  # Exporta el retraso (lag) de los grupos de consumo: la señal que más alerta en operación.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
