# Tópico de eventos de la aplicación de demostración.
# El número de particiones fija el paralelismo máximo de consumo: 3 permite 3 consumidores activos por grupo.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: demo.events
  namespace: kafka
  labels:
    strimzi.io/cluster: demo-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    # Retención de 24 h: suficiente para reprocesar un día ante un fallo del consumidor.
    retention.ms: 86400000
    segment.bytes: 268435456
    cleanup.policy: delete
    # Con 2 réplicas en sincronía, el tópico sigue aceptando escrituras aunque caiga un broker.
    min.insync.replicas: 2
    # El productor decide la compresión; el broker no recomprime y ahorra CPU.
    compression.type: producer
