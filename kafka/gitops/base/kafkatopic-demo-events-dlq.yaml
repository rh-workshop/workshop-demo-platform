# Cola de descarte: recibe los mensajes que el consumidor no logra procesar.
# Sin ella, un solo mensaje defectuoso bloquea su partición indefinidamente.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: demo.events.dlq
  namespace: kafka
  labels:
    strimzi.io/cluster: demo-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    # Retención mayor que la del tópico principal: da margen para analizar la causa antes de que expire.
    retention.ms: 259200000
    segment.bytes: 268435456
    cleanup.policy: delete
    min.insync.replicas: 2
    compression.type: producer
