# Los tópicos siguen al cluster: una sola réplica y una sola en sincronía.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: demo.events
  namespace: kafka
spec:
  replicas: 1
  config:
    min.insync.replicas: 1
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: demo.events.dlq
  namespace: kafka
spec:
  replicas: 1
  config:
    min.insync.replicas: 1
