---
# Deposita en el almacen la llave de cifrado del pipeline de auditoria, UNA POR AMBIENTE.
#
# POR QUE UNA POR AMBIENTE. Con una llave compartida, quien accede al ambiente menos
# protegido puede descifrar los eventos de produccion. Cada ambiente lee su propia ruta
# (`platform/kafka-audit/<ambiente>`), que fija el overlay correspondiente del repo de
# configuracion.
#
# QUE NO HACE. No escribe ningun Secret en el cluster: eso lo materializa el
# ExternalSecret que gobierna Argo. Escribirlo aqui ademas dejaria DOS duenos sobre el
# mismo objeto, peleandose en cada reconciliacion.
#
# POR QUE NO ES ARGO NI UNA POLICY. Argo sincroniza lo que esta en Git, y una llave de
# cifrado no puede estar en Git. Una Policy de ACM tampoco sirve: sabe COPIAR un secreto
# del hub, no GENERARLO. Alguien tiene que crear el material aleatorio una primera vez, y
# ese es el unico papel de este playbook. A partir de ahi todo el reparto es declarativo:
# el almacen -> ExternalSecret -> Secret en cada cluster.
#
# IDEMPOTENTE. Si una llave ya existe NO se regenera: rehacerla dejaria indescifrable todo
# lo ya publicado en ese ambiente. Para rotarla de forma deliberada, ver la nota del final.
#
#   ansible-playbook kafka/ansible/llaves-cifrado.yml
- name: Depositar las llaves de cifrado del pipeline de auditoria
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [kafka, secretos]

  vars:
    vault_namespace: openbao
    # Prefijo comun; a cada ambiente se le añade su nombre.
    vault_path_base: platform/kafka-audit
    ambientes: [dev, test, prod, contingencia]

  tasks:
    - name: Exigir el token de operación
      ansible.builtin.fail:
        msg: >-
          Falta el token de operación. Exportalo antes de ejecutar:
            export BAO_OPERATOR_TOKEN='<token raiz o de un operador con permisos>'
          Los tokens eso-read-* son de solo lectura y no sirven para escribir
          en el almacén.
      when: lookup('env', 'BAO_OPERATOR_TOKEN') | length == 0

    - name: Localizar el almacen
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ vault_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=openbao
      register: bao_pod

    - name: Comprobar que el almacen esta desplegado
      ansible.builtin.assert:
        that: bao_pod.resources | length > 0
        fail_msg: >-
          No hay ningun pod del almacen en {{ vault_namespace }}. Ejecuta antes
          openbao/ansible/bootstrap.yml, que lo arranca y genera su token.

    - name: Fijar los datos de acceso
      ansible.builtin.set_fact:
        bao_env: >-
          env BAO_TOKEN={{ lookup('env', 'BAO_OPERATOR_TOKEN') }}
          BAO_ADDR=https://127.0.0.1:8200
          BAO_CACERT=/openbao/tls/ca.crt

    # Se consulta ANTES de escribir: una llave que ya existe no se toca.
    - name: Comprobar que llaves hay ya depositadas
      kubernetes.core.k8s_exec:
        namespace: "{{ vault_namespace }}"
        pod: "{{ bao_pod.resources[0].metadata.name }}"
        command: >-
          {{ bao_env }}
          bao kv get -mount=secret -field=aes-key {{ vault_path_base }}/{{ item }}
      loop: "{{ ambientes }}"
      register: llaves_existentes
      failed_when: false
      changed_when: false

    - name: Depositar la llave de los ambientes que aun no la tienen
      kubernetes.core.k8s_exec:
        namespace: "{{ vault_namespace }}"
        pod: "{{ bao_pod.resources[0].metadata.name }}"
        command: >-
          {{ bao_env }}
          bao kv put -mount=secret {{ vault_path_base }}/{{ item.item }}
          aes-key={{ lookup('community.general.random_string',
                            length=32, base64=true) | quote }}
      loop: "{{ llaves_existentes.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc | default(1) != 0

    - name: Informar del resultado
      ansible.builtin.debug:
        msg:
          - "Llaves de cifrado en {{ vault_path_base }}/<ambiente>: {{ ambientes | join(', ') }}"
          - "Las ya existentes NO se han tocado: regenerarlas dejaria indescifrable lo ya publicado."
          - "ROTACION deliberada: depositar la llave nueva y montar la anterior como PREVIOUS_KEY"
          - "hasta que la retencion del topico supere el momento del cambio."
