# En produccion la retencion la fija el requisito de auditoria, no el disco
# disponible: por eso aqui se amplia Y se declara volumen persistente.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
    prometheusK8s:
      retention: 15d
      retentionSize: 40GiB
      volumeClaimTemplate:
        spec:
          # StorageClass del cluster de PRODUCCIÓN (variable storage_class del bootstrap; ajustar al cambiar de entorno).
          storageClassName: ocs-external-storagecluster-ceph-rbd
          resources:
            requests:
              storage: 50Gi
