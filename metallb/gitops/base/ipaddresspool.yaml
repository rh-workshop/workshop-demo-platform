# Rango de IPs que MetalLB reparte para Services de tipo LoadBalancer.
#
# ESTE RANGO ES DEL ENTORNO: pertenece a la red donde vive el cluster y hay que
# ajustarlo a la red real (se parchea por overlay: dev y prod usan rangos
# distintos para no chocar en un mismo segmento L2).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: workshop-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.10.10.202-10.10.10.220
  autoAssign: true
  # avoidBuggyIPs: no asigna las .0 ni .255 del rango (direcciones problematicas).
  avoidBuggyIPs: true
---
# Pool DEDICADO al Gateway compartido: autoAssign false para que su IP sea estable
# y no se la lleve otro Service por orden de llegada. El Service del gateway la pide
# con la annotation metallb.io/address-pool: gateway-pool.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: gateway-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.10.10.200-10.10.10.201
  autoAssign: false
  avoidBuggyIPs: true
