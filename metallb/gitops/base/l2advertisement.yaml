# Como MetalLB anuncia las IPs del pool: modo capa 2 (L2/ARP).
#
# En L2 un nodo del cluster responde al ARP de la IP virtual y atrae el trafico;
# no necesita configuracion en los routers, por eso es lo habitual en entornos
# de este tipo. La alternativa, BGP, exige acuerdo con la red y aqui no se usa.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: workshop-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - workshop-pool
