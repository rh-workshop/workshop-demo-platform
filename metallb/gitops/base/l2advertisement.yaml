# Como MetalLB anuncia las IPs de los pools: modo capa 2 (L2/ARP).
#
# NO-PRODUCCION: L2 tiene un solo nodo activo por VIP (cuello de botella, failover
# ARP lento). En prod = BGP+BFD (ECMP real, failover sub-segundo). Ver
# docs/production-outside-the-lab.md.
#
# Se anuncian ambos pools. En prod conviene acotar `interfaces` a la NIC de datos
# y `nodeSelectors` a los nodos de borde, para no anunciar por cualquier interfaz
# de cualquier nodo.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: workshop-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - workshop-pool
    - gateway-pool
