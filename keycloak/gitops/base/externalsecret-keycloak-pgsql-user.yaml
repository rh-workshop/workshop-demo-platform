# Credenciales del PostgreSQL de Keycloak.
#
# Las consumen los dos lados: el Deployment del motor (POSTGRESQL_USER/PASSWORD/
# DATABASE) y el CR Keycloak (spec.db.usernameSecret/passwordSecret). Ningun valor
# vive aqui: solo la ruta en el almacen.
#
# La ruta lleva CHANGE_ME_ENVIRONMENT: cada overlay la sustituye por su ambiente,
# de modo que dev y prod no comparten credencial.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pgsql-user
  namespace: keycloak
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-pgsql-user
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: platform/keycloak/db-CHANGE_ME_ENVIRONMENT
        property: user
    - secretKey: password
      remoteRef:
        key: platform/keycloak/db-CHANGE_ME_ENVIRONMENT
        property: password
    - secretKey: dbname
      remoteRef:
        key: platform/keycloak/db-CHANGE_ME_ENVIRONMENT
        property: dbname
