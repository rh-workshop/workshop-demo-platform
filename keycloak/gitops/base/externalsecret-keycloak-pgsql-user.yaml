# Credenciales del PostgreSQL de Keycloak.
#
# Las consumen los dos lados: el Deployment del motor (POSTGRESQL_USER/PASSWORD/
# DATABASE) y el CR Keycloak (spec.db.usernameSecret/passwordSecret). Ningun valor
# vive aqui: solo la ruta en el almacen.
#
# La ruta lleva CHANGE_ME_ENVIRONMENT: cada overlay la sustituye por su ambiente,
# de modo que dev y prod no comparten credencial.
#
# AL ROTAR LA CONTRASENA HAY QUE REINICIAR LOS DOS LADOS, EN ORDEN. Actualizar el
# almacen no basta: ESO refresca el Secret, pero los procesos ya arrancados
# conservan la credencial que leyeron al iniciar. Y PostgreSQL solo aplica
# POSTGRESQL_PASSWORD cuando inicializa un volumen vacio -- sobre un PVC existente
# la ignora, asi que el rol de la base de datos conserva la contrasena vieja.
#
#   1. Cambiar el valor en el almacen y esperar al refresco (o forzarlo con
#      `oc annotate externalsecret keycloak-pgsql-user -n keycloak force-sync=$(date +%s) --overwrite`).
#   2. Cambiar el rol EN la base de datos, que es lo que se olvida:
#        oc exec deployment/keycloak-pgsql -n keycloak -- \
#          psql -U postgres -c "ALTER USER keycloak WITH PASSWORD '<nueva>'"
#   3. Reiniciar Keycloak: `oc rollout restart statefulset/keycloak -n keycloak`.
#
# SI SE OMITE EL PASO 3, el sintoma es un StatefulSet a 1/2 replicas para siempre:
# el pod viejo falla su probe con `password authentication failed for user
# "keycloak"` y el rollout no avanza porque espera a que ese pod este listo. La
# Application queda Synced/Progressing indefinidamente y Keycloak sigue
# respondiendo con la replica sana, asi que no se nota como caida.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-pgsql-user
  namespace: keycloak
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: keycloak-pgsql-user
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: platform/keycloak/db-CHANGE_ME_ENVIRONMENT
        property: user
    - secretKey: password
      remoteRef:
        key: platform/keycloak/db-CHANGE_ME_ENVIRONMENT
        property: password
    - secretKey: dbname
      remoteRef:
        key: platform/keycloak/db-CHANGE_ME_ENVIRONMENT
        property: dbname
