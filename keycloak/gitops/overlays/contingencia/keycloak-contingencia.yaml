# Ajustes de CONTINGENCIA de Keycloak (mismo perfil que produccion): HA (2 instancias), hostname del cluster prod
# y hostname strict (evita host spoofing sobre URLs de tokens/redirects).
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 2
  hostname:
    # Sustituir por el dominio del cluster de CONTINGENCIA: sso.apps.<cluster-contingencia>.<dominio-base>
    hostname: sso.apps.ocp.krzn5.sandbox3491.opentlc.com
    strict: true
    strictBackchannel: true
