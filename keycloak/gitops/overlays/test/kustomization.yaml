apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - ../../base
patches:
  - path: keycloak-hostname.yaml
  - target:
      kind: Route
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/host
        # Sustituir por el dominio del cluster de PRUEBAS: sso.apps.<cluster-test>.<dominio-base>
        value: sso.apps.ocp.zrnk2.sandbox1444.opentlc.com
labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-platform
      workshop.redhat.com/environment: test
