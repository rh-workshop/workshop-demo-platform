apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - ../../base
patches:
  - path: keycloak-hostname.yaml
  - target:
      kind: Route
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/host
        value: sso.apps.cluster-pvsbw.dyn.redhatworkshops.io
labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-platform
      workshop.redhat.com/environment: dev
