# El hostname es lo unico que cambia entre ambientes: se parchea aqui.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  hostname:
    # Sustituir por el dominio del cluster de DESARROLLO: sso.apps.<cluster-dev>.<dominio-base>
    hostname: sso.apps.cluster-dev.ejemplo.com
