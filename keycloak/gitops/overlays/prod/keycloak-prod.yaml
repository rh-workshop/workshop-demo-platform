# Ajustes de PRODUCCION de Keycloak: HA (2 instancias), hostname del cluster prod
# y hostname strict (evita host spoofing sobre URLs de tokens/redirects).
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 2
  hostname:
    # Sustituir por el dominio del cluster de PRODUCCIÓN: sso.apps.<cluster-prod>.<dominio-base>
    hostname: sso.apps.cluster-prod.ejemplo.com
    strict: true
    strictBackchannel: true
