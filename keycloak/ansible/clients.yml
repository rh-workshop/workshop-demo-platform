---
# Clientes de Keycloak.
#
# POR QUÉ ESTO NO ES GITOPS: el CR `Keycloak` y el `KeycloakRealmImport` SÍ son
# declarativos y los reconcilia Argo CD (están en keycloak/gitops/). Pero un
# cliente creado después del arranque —o cuyo secreto hay que rotar— vive dentro
# de la base de datos de Keycloak y solo se toca por su API de administración.
# Ese es el trabajo de este playbook, y es idempotente.
#
# CREDENCIALES: se leen del entorno, nunca de un fichero versionado.
#
#   export KEYCLOAK_HOST=<host-de-keycloak>
#   export KEYCLOAK_ADMIN=<usuario-admin>
#   export KEYCLOAK_PASSWORD=<contraseña>
#   ansible-playbook keycloak/ansible/clients.yml

- name: Configurar clientes de Keycloak
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    keycloak_host: "{{ lookup('env', 'KEYCLOAK_HOST') }}"
    keycloak_admin: "{{ lookup('env', 'KEYCLOAK_ADMIN') }}"
    keycloak_password: "{{ lookup('env', 'KEYCLOAK_PASSWORD') }}"
    keycloak_url: "https://{{ keycloak_host }}"
    realm: workshop
    validar_certificados: false

    # El "qué" de este playbook: lo único que se edita al añadir una aplicación.
    # Cada servicio expuesto por el gateway (con su AuthPolicy que exige JWT) tiene
    # aquí su client machine-to-machine. El realm es 'workshop'.
    clients:
      - id: demo-service
        displayName: Servicio de ejemplo
        # Flujo máquina-a-máquina: la aplicación pide el token con su propio
        # identificador y secreto, sin intervención de una persona.
        service_account: true
        publicAccess: false
      # Client del servicio canary: su AuthPolicy exige un JWT de este realm.
      - id: canary-service
        displayName: Servicio canary (canary deployment)
        service_account: true
        publicAccess: false
      # Client del servicio circuit-breaker.
      - id: circuit-breaker-service
        displayName: Servicio circuit breaker
        service_account: true
        publicAccess: false

  tasks:
    - name: Comprobar que hay credenciales
      ansible.builtin.assert:
        that:
          - keycloak_host | length > 0
          - keycloak_admin | length > 0
          - keycloak_password | length > 0
        fail_msg: >-
          Faltan KEYCLOAK_HOST, KEYCLOAK_ADMIN o KEYCLOAK_PASSWORD en el
          entorno. Expórtalos antes de ejecutar; nunca los escribas aquí.

    - name: Obtener el token de administración
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: "{{ keycloak_admin }}"
          password: "{{ keycloak_password }}"
        validate_certs: "{{ validar_certificados }}"
      register: respuesta_token
      no_log: true

    - name: Guardar el token en una variable
      ansible.builtin.set_fact:
        admin_token: "{{ respuesta_token.json.access_token }}"
      no_log: true

    - name: Crear cada cliente del realm
      ansible.builtin.uri:
        url: "{{ keycloak_url }}/admin/realms/{{ realm }}/clients"
        method: POST
        headers:
          Authorization: "Bearer {{ admin_token }}"
        body_format: json
        body:
          clientId: "{{ item.id }}"
          name: "{{ item.displayName }}"
          enabled: true
          publicClient: "{{ item.publicAccess }}"
          serviceAccountsEnabled: "{{ item.service_account }}"
          standardFlowEnabled: false
          directAccessGrantsEnabled: false
        # 201 = creado; 409 = ya existe. Ambas son éxito: el playbook es
        # idempotente.
        status_code: [201, 409]
        validate_certs: "{{ validar_certificados }}"
      loop: "{{ clients }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Recordar cómo se obtiene el secreto del cliente
      ansible.builtin.debug:
        msg: >-
          Clientes listos. El secreto de cada uno se consulta con GET
          /admin/realms/{{ realm }}/clients/<uuid>/client-secret y se guarda como
          Secret en el cluster para que lo consuma la aplicación. Nunca se
          versiona en Git.
