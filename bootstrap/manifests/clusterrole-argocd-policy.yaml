# Permisos de la instancia de CARGAS sobre las Policies de ACM: SOLO LECTURA.
#
# La escritura se movio a la instancia de gobierno
# (bootstrap/manifests/clusterrole-argocd-governance.yaml). Una Policy con
# `remediationAction: enforce` es ejecucion remota en toda la flota: su
# controlador en cada spoke es ['*']/['*']/['*'], asi que puede crear cualquier
# objeto en cualquier cluster gestionado. Esa capacidad no debe convivir con la
# de desplegar aplicaciones en la misma identidad.
#
# La lectura se conserva para que el diff de las Applications que solo OBSERVAN
# Policies no quede incompleto.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openshift-gitops-policy-admin
  labels:
    app.kubernetes.io/part-of: workshop-gitops
rules:
- apiGroups:
  - policy.open-cluster-management.io
  resources:
  - policies
  - placementbindings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cluster.open-cluster-management.io
  resources:
  - placements
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-policy-admin
  labels:
    app.kubernetes.io/part-of: workshop-gitops
subjects:
- kind: ServiceAccount
  name: openshift-gitops-argocd-application-controller
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openshift-gitops-policy-admin
