# AppProject de la plataforma multi-cluster: la frontera de gobierno de Argo CD.
#
# Acota de qué repositorio se despliega, a qué clusters y qué recursos se pueden
# crear. Sin él, las Applications usarían 'default', que no restringe nada.
# Permite tanto el hub (in-cluster) como los spokes registrados por el
# GitOpsCluster.
#
# Lo crea el BOOTSTRAP (antes vivía en gitops/apps/ y lo sincronizaba el propio
# root): el proyecto es la barandilla del root y no debe ser instalable por el
# mecanismo al que limita.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop-multicluster
  namespace: openshift-gitops
spec:
  description: Productos de plataforma del workshop.
  # Deriva visible sin prune: lo creado a mano en los namespaces de plataforma se marca huérfano.
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-platform-config.git
  # Destinos: el server queda en '*' porque los spokes los registra el
  # GitOpsCluster con URLs dinámicas, pero los namespaces se acotan a los de
  # los productos de plataforma que este repo despliega — nada de user*, ni
  # openshift-gitops, ni namespaces de negocio.
  destinations:
  # Hub: ACM, Quay, ACS, monitoring, pipelines y Developer Hub.
  - server: '*'
    namespace: open-cluster-management
  - server: '*'
    namespace: quay-enterprise
  # NooBaa (MCG standalone): solo cuando el backend de Quay es noobaa, es decir
  # en clusters SIN object storage de nube. Con backend s3 aqui no se despliega nada.
  - server: '*'
    namespace: openshift-storage
  # CredentialsRequest del bucket de Quay: el CCO acuña ahi la identidad de S3.
  # Solo se usa con el backend s3 (quay/gitops/components/storage-s3).
  - server: '*'
    namespace: openshift-cloud-credential-operator
  # Observabilidad multi-cluster: el operador SOLO reconcilia el CR en este
  # namespace exacto, asi que el nombre no es elegible.
  - server: '*'
    namespace: open-cluster-management-observability
  # Almacen de secretos de la plataforma.
  - server: '*'
    namespace: openbao
  - server: '*'
    namespace: stackrox
  - server: '*'
    namespace: openshift-monitoring
  - server: '*'
    namespace: openshift-pipelines
  - server: '*'
    namespace: developer-hub
  # Argo Rollouts (progressive delivery): el RolloutManager del canary automático.
  - server: '*'
    namespace: argo-rollouts
  # CI del workshop: el Pipeline y su identidad se instalan en el namespace de desarrollo.
  - server: '*'
    namespace: workshop-demo-dev
  # Gobierno de los namespaces de aplicaciones (namespace-governance): cuota,
  # límites, RBAC por grupo y aislamiento de red — no workloads de negocio.
  - server: '*'
    namespace: canary-demo-dev
  - server: '*'
    namespace: bluegreen-demo-dev
  - server: '*'
    namespace: circuit-breaker-demo-dev
  - server: '*'
    namespace: api-demo-dev
  # Workloads (hub y spokes): Connectivity Link, Keycloak, cert-manager, MetalLB y Service Mesh.
  - server: '*'
    namespace: kuadrant-system
  # El Gateway compartido y sus políticas (TLSPolicy/AuthPolicy) viven en su propio namespace.
  - server: '*'
    namespace: platform-gateway
  # IstioCNI (Service Mesh 3) despliega su DaemonSet en un namespace propio.
  - server: '*'
    namespace: istio-cni
  - server: '*'
    namespace: keycloak
  - server: '*'
    namespace: cert-manager
  - server: '*'
    namespace: metallb-system
  - server: '*'
    namespace: istio-system
  # Plataforma de mensajería: el cluster Kafka, sus tópicos y sus usuarios.
  - server: '*'
    namespace: kafka
  # Recursos de ámbito de cluster: allow-list del inventario real (falla
  # CERRADO: un kind cluster-scoped nuevo se rechaza hasta listarlo aquí).
  clusterResourceWhitelist:
  # Cada producto declara su Namespace.
  - group: ''
    kind: Namespace
  # CR de la observabilidad multi-cluster. Es CLUSTER-SCOPED pese a vivir
  # asociado a un namespace fijo, asi que entra por esta lista y no por la de
  # recursos namespaced — declararlo en la otra da "is not permitted in project"
  # sin mas pista. El Secret con las llaves del object storage NO entra: lo
  # siembra Ansible y sigue fuera del alcance de Argo.
  - group: observability.open-cluster-management.io
    kind: MultiClusterObservability
  # Puente entre el almacen y los ExternalSecret. Es cluster-scoped porque debe
  # servir a ExternalSecret de cualquier namespace.
  - group: external-secrets.io
    kind: ClusterSecretStore
  # Instancia del controlador de ESO (el operador solo observa este CR).
  - group: operator.openshift.io
    kind: ExternalSecretsConfig
  # ClusterIssuer del overlay de cert-manager.
  - group: cert-manager.io
    kind: ClusterIssuer
  # TektonConfig del operador de Pipelines (cluster-scoped).
  - group: operator.tekton.dev
    kind: TektonConfig
  # Console del operador de consola (singleton cluster-scoped): connectivity-link
  # la parchea para activar el plugin de Kuadrant en la consola web.
  - group: operator.openshift.io
    kind: Console
  # Istio, IstioCNI e IstioRevisionTag del sail-operator (Service Mesh 3, cluster-scoped).
  - group: sailoperator.io
    kind: Istio
  - group: sailoperator.io
    kind: IstioCNI
  # El overlay de prod ancla la revision estable del mesh con un IstioRevisionTag.
  - group: sailoperator.io
    kind: IstioRevisionTag
  # ClusterRoleBinding del analisis del canary (SA -> cluster-monitoring-view, solo
  # lectura). RIESGO ASUMIDO Y CONSCIENTE: quien commitea en ESTE repo puede
  # enlazar cualquier ClusterRole, cluster-admin incluido. Se acepta porque el repo
  # de plataforma ya es una herramienta de administrador (crea ClusterIssuer,
  # TektonConfig, Istio y las Policies de ACM) y su rama main debe estar protegida
  # con revision obligatoria. El repo de APLICACIONES no tiene este permiso.
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  # Allow-list explícita de recursos namespaced: es el inventario REAL de lo
  # que renderizan los overlays de este repo (kubectl kustomize / helm
  # template). Si aparece un kind nuevo, Argo lo rechaza con "resource ... is
  # not permitted in project" y hay que añadirlo aquí de forma consciente.
  namespaceResourceWhitelist:
  # Peticion de credenciales de nube al CCO (identidad de S3 para el bucket de
  # Quay). NO otorga permisos por si misma: describe la politica minima que el
  # CCO acuña, y el propio CCO decide si puede resolverla.
  - group: cloudcredential.openshift.io
    kind: CredentialsRequest
  # Declara DE DONDE leer un secreto; nunca contiene su valor. Es NAMESPACED
  # (vive junto al Secret que materializa), a diferencia del ClusterSecretStore,
  # que es cluster-scoped y va en la otra lista.
  - group: external-secrets.io
    kind: ExternalSecret
  # OpenBao: el almacen corre como StatefulSet con su Service e identidad.
  - group: apps
    kind: StatefulSet
  - group: ''
    kind: ServiceAccount
  # Configuración y servicios auxiliares de los productos.
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: policy
    kind: PodDisruptionBudget
  - group: route.openshift.io
    kind: Route
  # ACM: hub, placements y políticas de gobierno.
  - group: operator.open-cluster-management.io
    kind: MultiClusterHub
  - group: cluster.open-cluster-management.io
    kind: Placement
  - group: cluster.open-cluster-management.io
    kind: ManagedClusterSetBinding
  - group: policy.open-cluster-management.io
    kind: Policy
  - group: policy.open-cluster-management.io
    kind: PlacementBinding
  # ACS: Central, SecuredCluster y políticas de seguridad declarativas.
  - group: platform.stackrox.io
    kind: Central
  - group: platform.stackrox.io
    kind: SecuredCluster
  - group: config.stackrox.io
    kind: SecurityPolicy
  # Quay y Developer Hub.
  - group: quay.redhat.com
    kind: QuayRegistry
  # NooBaa (MCG standalone): object storage de Quay en este entorno sin ODF.
  - group: noobaa.io
    kind: NooBaa
  # Backing store y bucket class por defecto del MCG (quay/gitops/base): el AppProject falla cerrado, sin esto el sync se bloquea.
  - group: noobaa.io
    kind: BackingStore
  - group: noobaa.io
    kind: BucketClass
  # Kafka: el cluster, sus pools de nodos, sus tópicos y sus identidades.
  - group: kafka.strimzi.io
    kind: Kafka
  - group: kafka.strimzi.io
    kind: KafkaNodePool
  - group: kafka.strimzi.io
    kind: KafkaTopic
  - group: kafka.strimzi.io
    kind: KafkaUser
  # Recolección de métricas de los productos que las exponen (hoy, Kafka).
  - group: monitoring.coreos.com
    kind: PodMonitor
  - group: rhdh.redhat.com
    kind: Backstage
  # Connectivity Link: Gateway API + CRs de Kuadrant y sus componentes.
  - group: gateway.networking.k8s.io
    kind: Gateway
  - group: kuadrant.io
    kind: Kuadrant
  - group: kuadrant.io
    kind: AuthPolicy
  - group: kuadrant.io
    kind: TLSPolicy
  - group: limitador.kuadrant.io
    kind: Limitador
  - group: operator.authorino.kuadrant.io
    kind: Authorino
  # Certificados de cert-manager (el ClusterIssuer va en la lista de cluster).
  - group: cert-manager.io
    kind: Certificate
  # Keycloak (RHBK) y su realm.
  - group: k8s.keycloak.org
    kind: Keycloak
  - group: k8s.keycloak.org
    kind: KeycloakRealmImport
  # MetalLB y su addressing.
  - group: metallb.io
    kind: MetalLB
  - group: metallb.io
    kind: IPAddressPool
  - group: metallb.io
    kind: L2Advertisement
  # Service Mesh: mTLS del mesh.
  - group: security.istio.io
    kind: PeerAuthentication
  # Argo Rollouts: el CR RolloutManager del operador GitOps (rollouts/gitops/).
  - group: argoproj.io
    kind: RolloutManager
  # CI del workshop (workshop-pipelines/gitops/): el Pipeline, la cuenta que lo
  # ejecuta y sus RoleBinding — gobierno de plataforma, nunca del repo de apps.
  - group: tekton.dev
    kind: Pipeline
  # Las Task del pipeline (firma, escaneo, tagging): sin este kind el sync falla
  # con "resource tekton.dev:Task is not permitted" y Argo no llega a gobernarlas.
  - group: tekton.dev
    kind: Task
  # Repository de Pipelines as Code: declara QUE repositorio de Git dispara el CI.
  # El CRD lo trae OpenShift Pipelines, no se instala ningún producto aparte.
  - group: pipelinesascode.tekton.dev
    kind: Repository
  - group: ''
    kind: ServiceAccount
  # Secret de tipo service-account-token del analisis del canary: se versiona VACIO
  # (solo tipo y anotacion) y lo rellena el cluster; su contenido nunca viaja en Git.
  - group: ''
    kind: Secret
  # Role namespaced del gobierno de workshop-demo-dev (app-developer-no-secrets);
  # los ClusterRole siguen fuera: solo los aplica el bootstrap.
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  # Gobierno de namespaces (namespace-governance/gitops/): cuotas, límites y
  # aislamiento de red por namespace.
  - group: ''
    kind: ResourceQuota
  - group: ''
    kind: LimitRange
  - group: networking.k8s.io
    kind: NetworkPolicy
