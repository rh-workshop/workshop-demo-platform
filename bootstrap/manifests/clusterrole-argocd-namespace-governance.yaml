# Permisos del controlador de Argo CD para el componente namespace-governance:
# cuotas, límites y aislamiento de red por namespace.
#
# Mismo razonamiento que argocd-platform-operators: el rol del operador de
# GitOps da escritura acotada y NO incluye resourcequotas ni limitranges (son
# recursos de administración que el rol 'edit' de un namespace tampoco otorga);
# sin esto la sincronización falla con "forbidden: cannot create resourcequotas".
#
# Es plano de control: amplía los permisos del propio controller, así que lo
# aplica el bootstrap y NO una Application de Argo — un componente no debe poder
# ampliarse sus propios permisos desde un repositorio que él mismo sincroniza.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-namespace-governance
  labels:
    app.kubernetes.io/part-of: workshop-gitops
rules:
  - apiGroups:
      - ""
    resources:
      - resourcequotas
      - limitranges
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs: [get, list, watch, create, update, patch, delete]
  # Los objetos Group NO estan aqui: se movieron a la instancia de GOBIERNO
  # (clusterrole-argocd-governance.yaml). La pertenencia a un grupo ES la
  # concesion -- `platform-admins` da cluster-admin del hub y admin de ACM en los
  # cinco clusters -- asi que crear grupos no debe convivir con desplegar
  # aplicaciones en la misma identidad.
  # Conceder un rol exige tenerlo o poder hacer `bind` sobre el: Kubernetes
  # impide otorgar permisos que uno no posee. Los RoleBinding por namespace
  # referencian `view` y `admin`, que incluyen verbos que este controlador no
  # tiene, y sin esto el sync falla con "attempting to grant RBAC permissions
  # not currently held".
  #
  # Acotado por resourceNames a los tres roles que se reparten. Un `bind` sin
  # lista, o `escalate`, permitiria conceder cluster-admin desde un commit.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - view
      - admin
    verbs: [bind]
  # El Role local app-developer-no-secrets, que este mismo componente declara.
  # `bind` sobre roles va sin resourceNames porque el Role vive en cada namespace
  # y la restriccion es por nombre, no por namespace; el alcance real lo fija que
  # el controlador solo pueda crear Roles cuyos verbos ya posee.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
    resourceNames:
      - app-developer-no-secrets
    verbs: [bind]
  # Las politicas de admision NO estan aqui: se movieron a la instancia de
  # GOBIERNO (clusterrole-argocd-governance.yaml), donde vive lo cluster-scoped
  # que define barandillas. Esta instancia despliega cargas; no decide que se
  # admite en el cluster.
  # NO se concede clusterrolebindings ni `escalate`. Argo sincroniza un
  # repositorio Git: con esos permisos, quien pudiera mezclar un commit se haria
  # cluster-admin, que es exactamente lo que se quito al enumerar estos roles.
  # Los ClusterRoleBinding de los grupos los aplica el bootstrap, una vez.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-namespace-governance
  labels:
    app.kubernetes.io/part-of: workshop-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-namespace-governance
