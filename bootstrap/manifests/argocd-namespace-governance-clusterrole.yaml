# Permisos del controlador de Argo CD para el componente namespace-governance:
# cuotas, límites y aislamiento de red por namespace.
#
# Mismo razonamiento que argocd-platform-operators: el rol del operador de
# GitOps da escritura acotada y NO incluye resourcequotas ni limitranges (son
# recursos de administración que el rol 'edit' de un namespace tampoco otorga);
# sin esto la sincronización falla con "forbidden: cannot create resourcequotas".
#
# Es plano de control: amplía los permisos del propio controller, así que lo
# aplica el bootstrap y NO una Application de Argo — un componente no debe poder
# ampliarse sus propios permisos desde un repositorio que él mismo sincroniza.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-namespace-governance
  labels:
    app.kubernetes.io/part-of: workshop-gitops
rules:
  - apiGroups:
      - ""
    resources:
      - resourcequotas
      - limitranges
    verbs:
      - "*"
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-namespace-governance
  labels:
    app.kubernetes.io/part-of: workshop-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-namespace-governance
