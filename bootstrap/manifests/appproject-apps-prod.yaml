# Aplicaciones de negocio en PRODUCCION y CONTINGENCIA.
#
# Mismos repositorios y mismos kinds que apps-nonprod: lo unico que cambia es el
# DESTINO. Esa es la barandilla -- un manifiesto de este proyecto no puede
# aterrizar en un namespace de desarrollo, ni al reves.
#
# Aqui es donde entran las ventanas de mantenimiento (syncWindows) y la revision
# de quien opera el ambiente.
#
# VENTANAS DE MANTENIMIENTO. Dos bloqueos: el proceso nocturno (22:00-06:00) y el
# cierre de mes (del 28 al 31). Durante ellos no entra ningun cambio, tenga o no
# aprobacion -- `manualSync: false` impide saltarselos desde la interfaz, que es
# lo que los convierte en un control y no en una recomendacion.
#
# Horario de America/Guayaquil, no UTC: una ventana en la zona equivocada bloquea
# a media tarde y deja abierta la madrugada.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-prod
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  description: Aplicaciones de negocio en prod y contingencia
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-app-config.git
  - https://github.com/rh-workshop/workshop-demo-kafka-audit-pipeline-config.git
  # DESTINOS NOMINALES, NUNCA `server: '*'`. El comodin autoriza cualquier cluster
  # registrado en Argo, incluido el hub bajo el nombre `local-cluster`: una
  # Application con ese destino escribe con el token del addon de ACM (cluster-admin)
  # en vez del RBAC enumerado del controller. Enumerar los clusters por nombre cierra
  # esa via y ademas impide que una app de un ambiente aterrice en otro.
  destinations:
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: workshop-demo-prod
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: workshop-demo-prod
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: workshop-demo-contingencia
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: workshop-demo-contingencia
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: kafka
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: kafka
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: kafka.strimzi.io
    kind: KafkaTopic
  - group: kafka.strimzi.io
    kind: KafkaUser
  - group: external-secrets.io
    kind: ExternalSecret
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: apps
    kind: Deployment
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
  - group: kuadrant.io
    kind: AuthPolicy
  - group: kuadrant.io
    kind: RateLimitPolicy
  - group: networking.istio.io
    kind: DestinationRule
  syncWindows:
  - kind: deny
    schedule: 0 22 * * *
    duration: 8h
    timeZone: America/Guayaquil
    applications:
    - '*'
    manualSync: false
  - kind: deny
    schedule: 0 0 28-31 * *
    duration: 24h
    timeZone: America/Guayaquil
    applications:
    - '*'
    manualSync: false
