# AppProject de CONTROL: el proyecto de las Applications raíz (app of apps).
#
# Sustituye a `project: default` en los roots. La whitelist es mínima y falla
# CERRADO: los roots solo pueden crear objetos de control de Argo/ACM dentro del
# namespace de Argo. A propósito NO incluye AppProject — la barandilla no debe
# ser instalable por el mismo mecanismo al que limita: los AppProjects los crea
# el bootstrap, nunca una Application.
#
# COPIA PARA LA INSTANCIA DE GOBIERNO. Mismo dominio y mismos destinos que el
# AppProject homonimo de `openshift-gitops`, pero en el namespace de la instancia
# que acuña privilegio. Cuando las Applications de este dominio se migren, la
# copia de la instancia de cargas se retira.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-control
  namespace: gitops-governance
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  description: "Applications ra\xEDz del modelo GitOps (app of apps), acotadas al plano de control."
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-platform-config.git
  destinations:
  # El namespace de ESTA instancia, no el de la de cargas: la app-of-apps de
  # gobierno crea Applications en `gitops-governance`.
  - server: https://kubernetes.default.svc
    namespace: gitops-governance
  # El registro de clusters de la instancia de CARGAS (GitOpsCluster, Placement,
  # ManagedClusterSetBinding en `openshift-gitops`) tambien se declara aqui: son
  # los objetos que deciden con que identidad escribe Argo en cada spoke, y la
  # instancia de cargas no puede escribirlos. Es la direccion segura del
  # acoplamiento -- la privilegiada escribe en la de cargas, nunca al reves.
  #
  # `Application` NO esta en el whitelist para este destino: esta instancia no
  # crea Applications en la de cargas, solo su registro de clusters.
  - server: https://kubernetes.default.svc
    namespace: openshift-gitops
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: Application
  - group: argoproj.io
    kind: ApplicationSet
  - group: apps.open-cluster-management.io
    kind: GitOpsCluster
  - group: cluster.open-cluster-management.io
    kind: Placement
  - group: cluster.open-cluster-management.io
    kind: ManagedClusterSetBinding
  - group: ''
    kind: ConfigMap
