# Gobierno de la flota: cuotas, limites, RBAC por namespace y las Policies de ACM.
#
# Un dominio propio porque decide QUE PUEDE CONSUMIR y QUIEN ENTRA en cada
# namespace -- de los cuatro dominios, el que mas se parece a un control de
# acceso. Separarlo permite exigir revision de seguridad solo aqui, sin frenar un
# cambio de configuracion de un producto.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: governance
  namespace: openshift-gitops
spec:
  description: Dominio governance
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-platform-config.git
  # DESTINOS NOMINALES, NUNCA `server: '*'`. El comodin autoriza cualquier cluster
  # registrado en Argo, incluido el hub bajo el nombre `local-cluster`: una
  # Application con ese destino escribe con el token del addon de ACM (cluster-admin)
  # en vez del RBAC enumerado del controller. Enumerar los clusters por nombre cierra
  # esa via y ademas impide que una app de un ambiente aterrice en otro.
  destinations:
  - name: in-cluster
    namespace: open-cluster-management
  - name: in-cluster
    namespace: open-cluster-management-observability
  - name: cluster-dev
    namespace: kuadrant-system
  - name: cluster-test
    namespace: kuadrant-system
  - name: cluster-prod
    namespace: kuadrant-system
  - name: cluster-contingencia
    namespace: kuadrant-system
  - name: in-cluster
    namespace: platform-gateway
  - name: in-cluster
    namespace: workshop-demo-dev
  - name: in-cluster
    namespace: quay-enterprise
  - name: in-cluster
    namespace: stackrox
  - name: in-cluster
    namespace: developer-hub
  - name: in-cluster
    namespace: openshift-pipelines
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: observability.open-cluster-management.io
    kind: MultiClusterObservability
  # Los grupos de la plataforma y el acceso que dan al cluster. El objeto Group
  # se declara vacio; la pertenencia la escribe el servidor OAuth.
  - group: user.openshift.io
    kind: Group
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  # Politicas de admision: cluster-scoped por naturaleza, y parte del gobierno
  # (deciden con QUE identidad puede correr una carga).
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
  namespaceResourceWhitelist:
  - group: ''
    kind: ResourceQuota
  - group: ''
    kind: LimitRange
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: policy.open-cluster-management.io
    kind: Policy
  - group: policy.open-cluster-management.io
    kind: PlacementBinding
  - group: cluster.open-cluster-management.io
    kind: Placement
  - group: cluster.open-cluster-management.io
    kind: ManagedClusterSetBinding
  - group: operator.open-cluster-management.io
    kind: MultiClusterHub
  - group: external-secrets.io
    kind: ExternalSecret
  - group: ''
    kind: ConfigMap
