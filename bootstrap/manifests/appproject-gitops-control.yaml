# AppProject de CONTROL: el proyecto de las Applications raíz (app of apps).
#
# Sustituye a `project: default` en los roots. La whitelist es mínima y falla
# CERRADO: los roots solo pueden crear objetos de control de Argo/ACM dentro del
# namespace de Argo. A propósito NO incluye AppProject — la barandilla no debe
# ser instalable por el mismo mecanismo al que limita: los AppProjects los crea
# el bootstrap, nunca una Application.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-control
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  description: Applications raíz del modelo GitOps (app of apps), acotadas al plano de control.

  # Deriva visible sin prune: los objetos sin dueño en el namespace de Argo se marcan huérfanos.
  orphanedResources:
    warn: true

  # Solo el repositorio de PLATAFORMA puede ser raíz: el repo de aplicaciones
  # quedó fuera a propósito — quien commitea ahí no puede crear Applications ni
  # ApplicationSets, sus servicios los descubre el ApplicationSet de plataforma.
  sourceRepos:
    - https://github.com/rh-workshop/workshop-demo-platform-config.git

  # Un root solo escribe en el namespace de Argo del hub, nunca en los de carga.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: openshift-gitops
    # El namespace de la instancia de GOBIERNO no es un destino valido aqui. Con
    # `Application` en la whitelist, autorizarlo permitiria que un commit en
    # `gitops/apps/` creara una Application DENTRO de la instancia privilegiada,
    # que la reconciliaria con los permisos de gobierno: exactamente la via que
    # la separacion de instancias cierra. El registro de clusters lo sincroniza
    # la propia instancia de gobierno (gitops/apps-governance/).

  # Ningún recurso de ámbito de cluster: un root no crea namespaces ni RBAC.
  clusterResourceWhitelist: []

  # Inventario REAL de lo que renderizan los dos roots — nada más.
  namespaceResourceWhitelist:
    # Applications hijas del app of apps.
    - group: argoproj.io
      kind: Application
    # ApplicationSets del fan-out multi-cluster (root de plataforma).
    - group: argoproj.io
      kind: ApplicationSet
    # Cadena ACM+Argo que registra los spokes (root de plataforma).
    - group: apps.open-cluster-management.io
      kind: GitOpsCluster
    - group: cluster.open-cluster-management.io
      kind: Placement
    - group: cluster.open-cluster-management.io
      kind: ManagedClusterSetBinding
    # ConfigMap acm-placement que exige el generador clusterDecisionResource.
    # RIESGO ASUMIDO: un AppProject no filtra por nombre, así que un commit al
    # repo de plataforma podría declarar argocd-cm/argocd-rbac-cm y reconfigurar
    # Argo por la puerta de atrás. Se acepta porque el repo es de confianza y el
    # único root que llega aquí es platform-root; ante la duda, vigilar con una
    # Policy de ACM que fije el contenido de argocd-rbac-cm.
    - group: ""
      kind: ConfigMap
