# Aplicaciones de negocio en DESARROLLO y PRUEBAS.
#
# Separado de apps-prod para que el equipo pueda desplegar solo aqui: es la mitad
# de la segregacion de funciones -- quien desarrolla no aprueba su propio paso a
# produccion. La otra mitad la pone el RBAC de la interfaz (roles app-developer y
# release-manager) y CODEOWNERS.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-nonprod
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  description: Aplicaciones de negocio en dev y test
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-app-config.git
  - https://github.com/rh-workshop/workshop-demo-kafka-audit-pipeline-config.git
  # DESTINOS NOMINALES, NUNCA `server: '*'`. El comodin autoriza cualquier cluster
  # registrado en Argo, incluido el hub bajo el nombre `local-cluster`: una
  # Application con ese destino escribe con el token del addon de ACM (cluster-admin)
  # en vez del RBAC enumerado del controller. Enumerar los clusters por nombre cierra
  # esa via y ademas impide que una app de un ambiente aterrice en otro.
  destinations:
  - name: cluster-dev
    namespace: workshop-demo-dev
  - name: cluster-test
    namespace: workshop-demo-dev
  - name: cluster-dev
    namespace: workshop-demo-test
  - name: cluster-test
    namespace: workshop-demo-test
  - name: cluster-dev
    namespace: canary-demo-dev
  - name: cluster-test
    namespace: canary-demo-dev
  - name: cluster-dev
    namespace: circuit-breaker-demo-dev
  - name: cluster-test
    namespace: circuit-breaker-demo-dev
  - name: cluster-dev
    namespace: bluegreen-demo-dev
  - name: cluster-test
    namespace: bluegreen-demo-dev
  - name: cluster-dev
    namespace: api-demo-dev
  - name: cluster-test
    namespace: api-demo-dev
  - name: cluster-dev
    namespace: kafka
  - name: cluster-test
    namespace: kafka
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: kafka.strimzi.io
    kind: KafkaTopic
  - group: kafka.strimzi.io
    kind: KafkaUser
  - group: external-secrets.io
    kind: ExternalSecret
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: apps
    kind: Deployment
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
  - group: kuadrant.io
    kind: AuthPolicy
  - group: kuadrant.io
    kind: RateLimitPolicy
  - group: networking.istio.io
    kind: DestinationRule
