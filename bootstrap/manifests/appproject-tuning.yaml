# Configuracion del propio OpenShift: retencion de metricas, plugins de consola y,
# cuando se anada, el tuning de nodos.
#
# Un dominio propio por el RADIO DE IMPACTO: un error aqui no afecta a una
# aplicacion, afecta al cluster -- y revertir el commit no repara rapido, porque
# la correccion dispara otro rollout. Por eso su Application NO lleva sync
# automatico: se sincroniza en ventana de mantenimiento (ver D.3 del backlog).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tuning
  namespace: openshift-gitops
spec:
  description: Dominio tuning
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-platform-config.git
  # DESTINOS EXPLICITOS, NUNCA `server: '*'`. El hub se identifica por su URL
  # interna y los spokes por nombre: Argo compara el destino de la Application
  # TAL CUAL, sin equiparar `name: in-cluster` con la URL. Las Applications del
  # hub declaran `server: https://kubernetes.default.svc`, asi que el AppProject
  # debe autorizar esa misma forma o quedan InvalidSpecError. El comodin autoriza cualquier cluster
  # registrado en Argo, incluido el hub bajo el nombre `local-cluster`: una
  # Application con ese destino escribe con el token del addon de ACM (cluster-admin)
  # en vez del RBAC enumerado del controller. Enumerar los clusters por nombre cierra
  # esa via y ademas impide que una app de un ambiente aterrice en otro.
  destinations:
  - server: https://kubernetes.default.svc
    namespace: openshift-monitoring
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-dev
    namespace: openshift-monitoring
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-test
    namespace: openshift-monitoring
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: openshift-monitoring
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: openshift-monitoring
  clusterResourceWhitelist:
  - group: operator.openshift.io
    kind: Console
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
