# AppProject de la PLATAFORMA del workshop.
#
# Un AppProject es la frontera de gobierno de Argo CD: acota de qué
# repositorios puede desplegar, a qué destinos y qué tipos de recurso puede
# crear. En una plataforma real habría un proyecto por dominio o por equipo, de
# modo que un equipo no pueda desplegar en el espacio de otro.
#
# Lo crea el BOOTSTRAP, no una Application: la barandilla no se instala por el
# mecanismo al que limita. Así desaparece el huevo-gallina (el proyecto existe
# antes que cualquier Application que lo declare) y ningún root necesita
# `project: default`.
#
# Este proyecto agrupa SOLO los componentes de plataforma (gateway, pipelines,
# políticas, demo-service). Las Applications de los participantes usan un
# proyecto aparte, `workshop`, con sus propias barandillas.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop-platform
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  description: Componentes de plataforma del workshop de OpenShift.

  # Con prune desactivado en las apps, lo creado a mano en estos namespaces no se
  # detecta nunca: marcarlo huérfano hace la deriva VISIBLE en la UI sin borrar nada.
  orphanedResources:
    warn: true

  # Solo se admite el repositorio de configuración del workshop.
  sourceRepos:
    - https://github.com/rh-workshop/workshop-demo-app-config.git
    # Servicios del pipeline de auditoria: viven en su propio repo de configuracion, que
    # descubren los AppSet kafka-services-*. El proyecto falla cerrado, asi que sin esta
    # entrada sus Applications quedan en InvalidSpecError sin desplegar nada.
    - https://github.com/rh-workshop/workshop-demo-kafka-audit-pipeline-config.git

  # Destinos permitidos: SOLO los namespaces de aplicación de este repo.
  # platform-gateway y kuadrant-system se retiraron a propósito: el destination
  # del ApplicationSet solo gobierna recursos SIN metadata.namespace, así que un
  # manifiesto del repo de apps con `namespace: platform-gateway` (un AuthPolicy
  # contra el gateway compartido, un RoleBinding en kuadrant-system) pasaría la
  # validación. Ningún servicio los necesita: el plano del gateway es de plataforma.
  # server '*' porque test/prod/contingencia corren en su PROPIO cluster (los
  # decide el Placement del ambiente); la barandilla real es la allow-list de
  # NAMESPACES + el whitelist de kinds, que siguen fallando cerrado.
  destinations:
    # Servicios del pipeline de auditoria: van al namespace del cluster de Kafka, no a uno
    # propio, porque consumen los Secret que genera el operador (certificado del KafkaUser y
    # CA del cluster), que son locales a ese namespace.
    - server: '*'
      namespace: kafka
    - server: '*'
      namespace: workshop-demo-dev
    - server: '*'
      namespace: workshop-demo-test
    - server: '*'
      namespace: workshop-demo-prod
    - server: '*'
      namespace: workshop-demo-contingencia
    - server: '*'
      namespace: canary-demo-dev
    - server: '*'
      namespace: circuit-breaker-demo-dev
    - server: '*'
      namespace: bluegreen-demo-dev
    - server: '*'
      namespace: api-demo-dev

  # Recursos de ámbito de cluster: SOLO el Namespace que cada servicio declara.
  # ClusterRole/ClusterRoleBinding quedan fuera: los aplica el bootstrap
  # (clusterrole-argocd-gateway-api.yaml), nunca una Application.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    # ClusterRoleBinding NO entra, y no es un detalle: quien puede crear uno puede
    # enlazar cluster-admin a una ServiceAccount que él mismo declare, así que
    # permitirlo convierte cualquier commit del repo de aplicaciones en
    # cluster-admin efectivo. La identidad del análisis del canary (ServiceAccount
    # + ClusterRoleBinding + token) se movió por eso a este repo, en
    # namespace-governance/gitops/base/namespaces/canary-demo-dev/.

  # Allow-list explícita (falla CERRADO): si un commit trae un kind no listado,
  # Argo lo rechaza con "resource ... is not permitted in project" en vez de
  # desplegarlo en silencio. Es el inventario REAL de lo que renderizan los
  # paths de este repo (kubectl kustomize sobre cada Application) — nada más.
  # Quedan FUERA a propósito los recursos de plataforma: Kuadrant, Gateway,
  # Keycloak, QuayRegistry, Subscription de operador, Secret, etc.
  namespaceResourceWhitelist:
    # Topicos e identidades del pipeline de auditoria. El cluster Kafka en si lo gobierna el
    # proyecto de plataforma; aqui solo entran los recursos que declara cada servicio.
    - group: kafka.strimzi.io
      kind: KafkaTopic
    - group: kafka.strimzi.io
      kind: KafkaUser
    # La llave de cifrado llega del almacen corporativo, no se crea a mano en el cluster.
    - group: external-secrets.io
      kind: ExternalSecret
    # Núcleo de un microservicio: workload, servicio y su configuración.
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    # RoleBinding NO se permite: ningun repo de aplicaciones renderiza uno, y con
    # el permiso abierto un commit podria enlazar admin a un grupo en
    # workshop-demo-dev, que es donde viven los secretos del CI. El RBAC por
    # namespace lo declara namespace-governance (plataforma).
    # ServiceAccount y Secret quedan fuera a propósito: un AppProject no filtra por
    # nombre, así que permitir Secret dejaría al repo de aplicaciones sobrescribir
    # (selfHeal incluido) los Secrets del CI de workshop-demo-dev —
    # cosign-signing-key, git-credentials, quay-push-credentials, argocd-env-secret.
    # La identidad del análisis del canary vive en namespace-governance.
    # Exposicion por HTTPRoute (Gateway API). Route no entra: los servicios de
    # negocio se exponen por el gateway compartido, no con rutas propias.
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
    # Políticas de Connectivity Link a nivel de RUTA (responsabilidad del
    # equipo de apps); el CR Kuadrant y el Gateway son de plataforma y NO entran.
    - group: kuadrant.io
      kind: AuthPolicy
    - group: kuadrant.io
      kind: RateLimitPolicy
    # Circuit breaker del servicio (DestinationRule de Istio, ámbito de app).
    - group: networking.istio.io
      kind: DestinationRule
    # El Pipeline de CI y su ServiceAccount no entran: viven en
    # workshop-demo-platform-config (workshop-pipelines/gitops/) porque montan el
    # token de escritura del repo de configuración — gobierno de plataforma.
