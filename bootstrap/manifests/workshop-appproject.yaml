# AppProject de los PARTICIPANTES del workshop (sesión 05 — GitOps).
#
# Antes vivía solo en el cluster (aplicado a mano en la sesión): era drift. Se
# versiona aquí y lo crea el bootstrap, como el resto de AppProjects.
#
# Barandillas: los alumnos solo despliegan desde el git interno del workshop,
# solo a sus namespaces user* y solo recursos namespaced — nada de ámbito de
# cluster. `sourceNamespaces` permite que cada alumno declare su Application en
# su propio namespace (Apps-in-any-namespace).
#
# CHANGE_ME_BASE_DOMAIN = dominio de apps del cluster (*.apps.<cluster>); el
# playbook de bootstrap lo sustituye con la variable `base_domain`.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: workshop-gitops
    workshop.redhat.com/sesion: 05-gitops
spec:
  description: Proyecto compartido por los participantes de este módulo
  # Deriva visible sin prune: lo creado a mano fuera de Git en user* se marca huérfano.
  orphanedResources:
    warn: true
  # Solo el repositorio git interno del workshop.
  sourceRepos:
    - http://git-server-workshop-git.apps.CHANGE_ME_BASE_DOMAIN/workshop.git
  # Solo los namespaces de alumno.
  destinations:
    - namespace: user*
      server: https://kubernetes.default.svc
  # Ningún recurso de ámbito de cluster para los alumnos.
  clusterResourceWhitelist: []
  # Dentro de su namespace pueden crear cualquier recurso namespaced.
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  # Cada alumno declara su Application en su propio namespace user*.
  sourceNamespaces:
    - user*
