# Productos de plataforma en los clusters de desarrollo y pruebas: Keycloak, Connectivity Link,
# cert-manager, Kafka, Service Mesh, el puente de secretos y el agente de ACS.
#
# Partido por criticidad y no solo por dominio: es la unica barandilla que impide
# que un manifiesto pensado para desarrollo aterrice en un namespace de
# produccion. El AppProject no mira de donde viene el cambio, mira a donde va.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-workload-nonprod
  namespace: openshift-gitops
spec:
  description: Dominio platform-workload-nonprod
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-platform-config.git
  # DESTINOS NOMINALES, NUNCA `server: '*'`. El comodin autoriza cualquier cluster
  # registrado en Argo, incluido el hub bajo el nombre `local-cluster`: una
  # Application con ese destino escribe con el token del addon de ACM (cluster-admin)
  # en vez del RBAC enumerado del controller. Enumerar los clusters por nombre cierra
  # esa via y ademas impide que una app de un ambiente aterrice en otro.
  destinations:
  - name: cluster-dev
    namespace: keycloak
  - name: cluster-test
    namespace: keycloak
  - name: cluster-dev
    namespace: kuadrant-system
  - name: cluster-test
    namespace: kuadrant-system
  - name: cluster-dev
    namespace: platform-gateway
  - name: cluster-test
    namespace: platform-gateway
  - name: cluster-dev
    namespace: cert-manager
  - name: cluster-test
    namespace: cert-manager
  - name: cluster-dev
    namespace: kafka
  - name: cluster-test
    namespace: kafka
  - name: cluster-dev
    namespace: istio-system
  - name: cluster-test
    namespace: istio-system
  - name: cluster-dev
    namespace: istio-cni
  - name: cluster-test
    namespace: istio-cni
  - name: cluster-dev
    namespace: external-secrets
  - name: cluster-test
    namespace: external-secrets
  - name: cluster-dev
    namespace: stackrox
  - name: cluster-test
    namespace: stackrox
  - name: cluster-dev
    namespace: metallb-system
  - name: cluster-test
    namespace: metallb-system
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: external-secrets.io
    kind: ClusterSecretStore
  - group: operator.openshift.io
    kind: ExternalSecretsConfig
  - group: cert-manager.io
    kind: ClusterIssuer
  - group: sailoperator.io
    kind: Istio
  - group: sailoperator.io
    kind: IstioCNI
  - group: sailoperator.io
    kind: IstioRevisionTag
  namespaceResourceWhitelist:
  - group: k8s.keycloak.org
    kind: Keycloak
  - group: k8s.keycloak.org
    kind: KeycloakRealmImport
  - group: kuadrant.io
    kind: Kuadrant
  - group: kuadrant.io
    kind: AuthPolicy
  - group: kuadrant.io
    kind: TLSPolicy
  - group: operator.authorino.kuadrant.io
    kind: Authorino
  - group: limitador.kuadrant.io
    kind: Limitador
  - group: gateway.networking.k8s.io
    kind: Gateway
  - group: cert-manager.io
    kind: Certificate
  - group: kafka.strimzi.io
    kind: Kafka
  - group: kafka.strimzi.io
    kind: KafkaNodePool
  - group: kafka.strimzi.io
    kind: KafkaTopic
  - group: kafka.strimzi.io
    kind: KafkaUser
  - group: platform.stackrox.io
    kind: SecuredCluster
  - group: metallb.io
    kind: MetalLB
  - group: metallb.io
    kind: IPAddressPool
  - group: metallb.io
    kind: L2Advertisement
  - group: security.istio.io
    kind: PeerAuthentication
  - group: external-secrets.io
    kind: ExternalSecret
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: ''
    kind: PersistentVolumeClaim
  - group: policy
    kind: PodDisruptionBudget
  - group: route.openshift.io
    kind: Route
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: monitoring.coreos.com
    kind: PodMonitor
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
