# Permisos BASE del controlador de Argo CD sobre recursos estandar de Kubernetes
# y OpenShift.
#
# Sustituye al ClusterRole que el operador de OpenShift GitOps crea por defecto
# (`openshift-gitops-openshift-gitops-argocd-application-controller`), desactivado
# con `defaultClusterScopedRoleDisabled: true` en el CR ArgoCD.
#
# El rol por defecto concede comodines sobre grupos que dan control del cluster
# (`operator.openshift.io`, `config.openshift.io`, `machineconfiguration`,
# `rbac.authorization.k8s.io`). Aqui la ESCRITURA se enumera; la LECTURA sigue
# siendo global porque Argo la necesita para calcular el diff y detectar drift.
#
# Argo no puede crear ClusterRole ni ClusterRoleBinding: los de este repo viven en
# bootstrap/manifests/ y los aplica el playbook, de modo que un componente no
# amplia sus propios permisos desde el repositorio que sincroniza. Role y
# RoleBinding namespaced si, porque el gobierno los reparte por namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-base
  labels:
    app.kubernetes.io/part-of: workshop-gitops
rules:
  # LECTURA global: necesaria para el calculo de diferencias y la deteccion de drift.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, watch]

  # Recursos de cluster que el repo declara de verdad.
  - apiGroups: [""]
    resources:
      - namespaces
      - configmaps
      - persistentvolumeclaims
      - services
      - serviceaccounts
    verbs: [create, update, patch, delete]

  # Cargas de trabajo desplegadas directamente (OpenBao, PostgreSQL de Keycloak).
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [create, update, patch, delete]

  # Kubernetes impide conceder permisos que uno no tiene: para que Argo pueda
  # crear el Role que deja a OpenBao etiquetar sus propios pods
  # (service_registration "kubernetes"), el propio controlador debe poder
  # parchear pods. Solo etiquetas y anotaciones: sin create, delete ni exec.
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, update]

  # Gobierno por namespace: cuotas, limites y aislamiento de red.
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [create, update, patch, delete]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [create, update, patch, delete]

  # RBAC namespaced unicamente (ver cabecera).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: [create, update, patch, delete]
  # Kubernetes exige el verbo `bind` para conceder permisos que uno no tiene: sin
  # el, crear un RoleBinding hacia un ClusterRole ajeno falla con "attempting to
  # grant". Se acota con resourceNames al unico ClusterRole que el repo enlaza --
  # la SCC de Pipelines, que el CI necesita para construir imagenes. Sin
  # resourceNames, `bind` seria una escalada de privilegios en toda regla: Argo
  # podria enlazar cluster-admin a cualquier cuenta.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [clusterroles]
    resourceNames: [pipelines-scc-clusterrole]
    verbs: [bind]

  # OLM no entra: los operadores los instala ACM con OperatorPolicy, y aprobar la
  # instalacion de un operador equivale a ejecutar codigo con permisos de cluster.

  # Rutas de OpenShift (consolas de Keycloak, Quay, OpenBao y el gateway).
  - apiGroups: ["route.openshift.io"]
    resources: [routes, routes/custom-host]
    verbs: [create, update, patch, delete]

  # Monitorizacion de las cargas propias: solo PodMonitor, que es lo unico que los
  # repos declaran.
  - apiGroups: ["monitoring.coreos.com"]
    resources: [podmonitors]
    verbs: [create, update, patch, delete]

  # Argo gestiona sus propios objetos de aplicacion (patron app-of-apps). Los
  # AppProject NO entran: son la barandilla que limita a Argo, y los aplica el
  # playbook -- un componente no reescribe el limite que lo contiene.
  - apiGroups: ["argoproj.io"]
    resources: [applications, applicationsets]
    verbs: [create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-base
  labels:
    app.kubernetes.io/part-of: workshop-gitops
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-base
