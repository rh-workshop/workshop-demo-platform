# Identidad de un cluster WORKLOAD (spoke): solo htpasswd, mismo modelo que el hub.
#
# POR QUE NO KEYCLOAK. Los spokes despliegan Keycloak como PRODUCTO de la
# plataforma (via GitOps, gobernado por Argo) igual que el hub despliega ACM y
# Quay -- no es un IdP corporativo externo e independiente del propio cluster.
# Usarlo para autenticar el cluster que lo aloja y gobierna es el mismo problema
# de huevo y gallina que ya se evito en el hub: si Keycloak cae o su Deployment
# queda mal sincronizado, el servidor OAuth devuelve 500 y nadie entra -- tampoco
# quien iba a repararlo. Ver oauth-hub.reference.yaml, mismo razonamiento.
#
# CONSECUENCIA: la pertenencia a grupos NO llega por claim OIDC en NINGUN
# cluster, hub o spoke. Los objetos Group los declara Git
# (namespace-governance/.../identity/) y los usuarios se asignan con
# `oc adm groups add-users`. Los ClusterPermission de gitops/clusters/
# human-access/ referencian esos mismos Group por nombre y no dependen de cómo
# se pobló `users` -- funcionan igual con claim o con alta manual.
#
# ESTE FICHERO ES UNA REFERENCIA, NO SE APLICA POR GITOPS. El Secret con el hash
# de la contrasena no puede vivir en Git, y el OAuth del cluster es plano de
# control: lo aplica el playbook de bootstrap tras crear el Secret a mano.
#
# PROCEDIMIENTO
#
#   1. Generar el fichero htpasswd (cuentas nominales del equipo, no compartidas;
#      dos cuentas de break-glass como minimo, ver mas abajo):
#        htpasswd -c -B -b spoke.htpasswd <persona1> '<contrasena-larga>'
#        htpasswd    -B -b spoke.htpasswd <persona2> '<otra-contrasena>'
#        htpasswd    -B -b spoke.htpasswd breakglass1 '<otra-contrasena>'
#        htpasswd    -B -b spoke.htpasswd breakglass2 '<otra-contrasena>'
#
#   2. Crear el Secret:
#        oc create secret generic htpasswd-secret \
#          --from-file=htpasswd=spoke.htpasswd -n openshift-config
#
#   3. Aplicar este OAuth.
#
#   4. Dar de alta a cada persona en su grupo (los objetos Group ya existen,
#      declarados en namespace-governance/.../identity/):
#        oc adm groups add-users platform-operators <persona1>
#
#      Y cluster-admin a las cuentas de break-glass:
#        oc adm policy add-cluster-role-to-user cluster-admin breakglass1
#        oc adm policy add-cluster-role-to-user cluster-admin breakglass2
#
#   5. Custodiar las contrasenas fuera del cluster (sobre sellado o gestor de
#      secretos corporativo) y borrar el fichero htpasswd local.
#
# NINGUNA CUENTA SE LLAMA `admin`. Es el nombre que usa `kubeadmin`/consola por
# convencion y no aporta nada distinguirla en el audit log; usar nombres
# nominales o `breakglass1`/`breakglass2` para las de emergencia.
#
# GOBIERNO: rotar las contrasenas de break-glass tras cada uso y revisarlas
# periodicamente. El audit log registra el usuario real en cada acceso, asi que
# una regla sobre los nombres de break-glass en el SIEM (ver G.1 del backlog de
# gobierno) avisa de cada uso de emergencia.
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
    - name: htpasswd
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: htpasswd-secret
