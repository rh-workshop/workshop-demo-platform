# Productos de plataforma en los clusters de produccion y contingencia: Keycloak, Connectivity Link,
# cert-manager, Kafka, Service Mesh, el puente de secretos y el agente de ACS.
#
# Partido por criticidad y no solo por dominio: es la unica barandilla que impide
# que un manifiesto pensado para desarrollo aterrice en un namespace de
# produccion. El AppProject no mira de donde viene el cambio, mira a donde va.
#
# VENTANAS DE MANTENIMIENTO. Dos bloqueos: el proceso nocturno (22:00-06:00) y el
# cierre de mes (del 28 al 31). Durante ellos no entra ningun cambio, tenga o no
# aprobacion -- `manualSync: false` impide saltarselos desde la interfaz, que es
# lo que los convierte en un control y no en una recomendacion.
#
# Horario de America/Guayaquil, no UTC: una ventana en la zona equivocada bloquea
# a media tarde y deja abierta la madrugada.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-workload-prod
  namespace: openshift-gitops
spec:
  description: Dominio platform-workload-prod
  orphanedResources:
    warn: true
  sourceRepos:
  - https://github.com/rh-workshop/workshop-demo-platform-config.git
  # DESTINOS NOMINALES, NUNCA `server: '*'`. El comodin autoriza cualquier cluster
  # registrado en Argo, incluido el hub bajo el nombre `local-cluster`: una
  # Application con ese destino escribe con el token del addon de ACM (cluster-admin)
  # en vez del RBAC enumerado del controller. Enumerar los clusters por nombre cierra
  # esa via y ademas impide que una app de un ambiente aterrice en otro.
  destinations:
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: keycloak
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: keycloak
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: kuadrant-system
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: kuadrant-system
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: platform-gateway
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: platform-gateway
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: cert-manager
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: cert-manager
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: kafka
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: kafka
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: istio-system
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: istio-system
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: istio-cni
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: istio-cni
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: external-secrets
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: external-secrets
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: stackrox
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: stackrox
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-prod
    namespace: metallb-system
  - server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/cluster-contingencia
    namespace: metallb-system
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: external-secrets.io
    kind: ClusterSecretStore
  - group: operator.openshift.io
    kind: ExternalSecretsConfig
  - group: cert-manager.io
    kind: ClusterIssuer
  - group: sailoperator.io
    kind: Istio
  - group: sailoperator.io
    kind: IstioCNI
  - group: sailoperator.io
    kind: IstioRevisionTag
  namespaceResourceWhitelist:
  - group: k8s.keycloak.org
    kind: Keycloak
  - group: k8s.keycloak.org
    kind: KeycloakRealmImport
  - group: kuadrant.io
    kind: Kuadrant
  - group: kuadrant.io
    kind: AuthPolicy
  - group: kuadrant.io
    kind: TLSPolicy
  - group: operator.authorino.kuadrant.io
    kind: Authorino
  - group: limitador.kuadrant.io
    kind: Limitador
  - group: gateway.networking.k8s.io
    kind: Gateway
  - group: cert-manager.io
    kind: Certificate
  - group: kafka.strimzi.io
    kind: Kafka
  - group: kafka.strimzi.io
    kind: KafkaNodePool
  - group: kafka.strimzi.io
    kind: KafkaTopic
  - group: kafka.strimzi.io
    kind: KafkaUser
  - group: platform.stackrox.io
    kind: SecuredCluster
  - group: metallb.io
    kind: MetalLB
  - group: metallb.io
    kind: IPAddressPool
  - group: metallb.io
    kind: L2Advertisement
  - group: security.istio.io
    kind: PeerAuthentication
  - group: external-secrets.io
    kind: ExternalSecret
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: ''
    kind: PersistentVolumeClaim
  - group: policy
    kind: PodDisruptionBudget
  - group: route.openshift.io
    kind: Route
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: monitoring.coreos.com
    kind: PodMonitor
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  syncWindows:
  - kind: deny
    schedule: 0 22 * * *
    duration: 8h
    timeZone: America/Guayaquil
    applications:
    - '*'
    manualSync: false
  - kind: deny
    schedule: 0 0 28-31 * *
    duration: 24h
    timeZone: America/Guayaquil
    applications:
    - '*'
    manualSync: false
