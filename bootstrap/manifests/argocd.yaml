# CR ArgoCD de la instancia openshift-gitops: fija SOLO los campos ajustados; el resto lo completa el operador.
#
# Este CR es plano de control: lo aplica el playbook de bootstrap con server-side
# apply, NO una Application de Argo — Argo no gestiona el componente que puede
# romperlo. Día 2 = editar este YAML en Git y reejecutar el playbook: sigue
# versionado, pero quien lo aplica no es quien lo sufre.
#
# Fuentes: docs.redhat.com GitOps "Managing resource use" y argo-cd.readthedocs.io "High Availability".
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  # Exigido por el Policy Generator de ACM: sin el flag, Kustomize ignora el bloque
  # `generators:` y la app sincroniza de menos SIN error.
  kustomizeBuildOptions: --enable-alpha-plugins
  # Desactiva el ClusterRole comodin que el operador crea por defecto (da acceso a
  # operator.openshift.io, config.openshift.io, machineconfiguration y rbac). Los
  # permisos se declaran enumerados en bootstrap/manifests/argocd-*-clusterrole.yaml.
  # Con false, el operador recrea ese rol.
  defaultClusterScopedRoleDisabled: true
  # Servidor API/UI: 512Mi de límite (el default de 256Mi queda justo frente a los ~180Mi de uso real).
  server:
    resources:
      limits:
        # CPU sobrada con el default (uso medido ~7m); se conserva el valor documentado.
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 125m
        # La request de memoria sube al uso real medido (~180Mi) para proteger el scheduling.
        memory: 256Mi
    route:
      enabled: true
  # Controller: con ~27 Applications y 3 clusters gestionados el pico de caché superó los 4Gi y el pod
  # entró en OOMKilled (CrashLoopBackOff), dejando los syncs colgados en Running. El límite sube a 8Gi
  # (medido en vivo: el arranque estabiliza ~5Gi) y la request a 3Gi para proteger el scheduling.
  # Los processors se dejan en el default (status 20 / operation 10): upstream solo recomienda subirlos con miles de apps.
  controller:
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: 250m
        memory: 3Gi
  # El binario del Policy Generator no viene en la imagen de OpenShift GitOps: se
  # copia desde la de ACM. El tag debe seguir a la versión de ACM del hub.
  repo:
    env:
      - name: KUSTOMIZE_PLUGIN_HOME
        value: /etc/kustomize/plugin
    initContainers:
      - name: policy-generator-install
        image: registry.redhat.io/rhacm2/multicluster-operators-subscription-rhel9:v2.17
        command: [/bin/bash, -c]
        # Debe copiarse como 'PolicyGenerator': Kustomize localiza el plugin por el nombre del kind.
        args: [cp /policy-generator/PolicyGenerator-not-fips-compliant /policy-generator-tmp/PolicyGenerator]
        volumeMounts:
          - name: policy-generator
            mountPath: /policy-generator-tmp
    volumeMounts:
      # Ruta impuesta por Kustomize: <plugin-home>/<apiVersion>/<kind en minúscula>.
      - name: policy-generator
        mountPath: /etc/kustomize/plugin/policy.open-cluster-management.io/v1/policygenerator
    volumes:
      - name: policy-generator
        emptyDir: {}
  # Namespaces de usuario del workshop autorizados a declarar sus propias Applications.
  sourceNamespaces:
    - user*
  # Cuenta LOCAL para el CD del pipeline: el paso argocd-task-sync-and-wait deja
  # de usar `admin` (cuya password vive en argocd-env-secret, en el namespace del
  # CI). Aunque alguien leyera ese Secret, esta cuenta solo puede get/sync en el
  # proyecto workshop-platform — no controla los 3 clusters.
  extraConfig:
    # Sin `login`: es una cuenta de automatizacion, no entra por la UI.
    accounts.pipeline: apiKey
  # RBAC de Argo: conserva las dos líneas que ponía el operador (admin para los
  # cluster-admins) y añade el rol mínimo de la cuenta pipeline.
  rbac:
    defaultPolicy: ""
    scopes: "[groups]"
    policy: |
      # ─────────────────────── ADMINISTRACION ───────────────────────
      # Via de rescate: la pone el operador y se conserva.
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      # Grupo nominal de administradores de Argo: pocas personas, revisado.
      g, platform-admins, role:admin

      # ──────────────── OPERADOR DE PLATAFORMA ────────────────
      # Ve y sincroniza plataforma en los 5 clusters. Git es la fuente: no crea
      # ni edita Applications desde la interfaz.
      p, role:platform-operator, applications, get,      platform-hub/*,               allow
      p, role:platform-operator, applications, sync,     platform-hub/*,               allow
      p, role:platform-operator, applications, action/*, platform-hub/*,               allow
      p, role:platform-operator, logs,         get,      platform-hub/*,               allow
      p, role:platform-operator, applications, get,      platform-workload-nonprod/*,  allow
      p, role:platform-operator, applications, sync,     platform-workload-nonprod/*,  allow
      p, role:platform-operator, applications, action/*, platform-workload-nonprod/*,  allow
      p, role:platform-operator, logs,         get,      platform-workload-nonprod/*,  allow
      p, role:platform-operator, applications, get,      platform-workload-prod/*,     allow
      p, role:platform-operator, applications, sync,     platform-workload-prod/*,     allow
      p, role:platform-operator, applications, action/*, platform-workload-prod/*,     allow
      p, role:platform-operator, logs,         get,      platform-workload-prod/*,     allow
      p, role:platform-operator, applications, get,      governance/*,                 allow
      p, role:platform-operator, applications, sync,     governance/*,                 allow
      p, role:platform-operator, applications, get,      tuning/*,                     allow
      p, role:platform-operator, applications, get,      gitops-control/*,             allow
      p, role:platform-operator, applicationsets, get,   */*,                          allow
      p, role:platform-operator, projects,     get,      *,                            allow
      p, role:platform-operator, clusters,     get,      *,                            allow
      p, role:platform-operator, repositories, get,      *,                            allow
      # tuning reinicia nodos: se sincroniza en ventana y solo por un admin.
      p, role:platform-operator, applications, sync,     tuning/*,                     deny

      # ──────────────── DESARROLLO DE APLICACIONES ────────────────
      # Lectura en los cuatro ambientes para diagnosticar; accion solo donde no
      # hay clientes. El deny es explicito para que ampliar un allow por error
      # mas adelante no abra produccion.
      p, role:app-developer, applications, get,      apps-nonprod/*,  allow
      p, role:app-developer, applications, sync,     apps-nonprod/*,  allow
      p, role:app-developer, applications, action/*, apps-nonprod/*,  allow
      p, role:app-developer, logs,         get,      apps-nonprod/*,  allow
      p, role:app-developer, applications, get,      apps-prod/*,     allow
      p, role:app-developer, applications, sync,     apps-prod/*,     deny
      p, role:app-developer, applications, action/*, apps-prod/*,     deny
      p, role:app-developer, logs,         get,      apps-prod/*,     deny

      # ──────────────── GESTION DE RELEASE ────────────────
      # Despliega a produccion, no desarrolla: la otra mitad de la segregacion.
      p, role:release-manager, applications, get,      apps-nonprod/*, allow
      p, role:release-manager, applications, get,      apps-prod/*,    allow
      p, role:release-manager, applications, sync,     apps-prod/*,    allow
      p, role:release-manager, applications, action/*, apps-prod/*,    allow
      p, role:release-manager, logs,         get,      apps-prod/*,    allow
      p, role:release-manager, applications, sync,     apps-nonprod/*, deny

      # ──────────────── AUDITORIA ────────────────
      # Lo ve todo y no toca nada. Sin logs: en produccion pueden llevar datos
      # de clientes, y auditar no requiere leerlos.
      p, role:auditor, applications,    get, */*, allow
      p, role:auditor, applicationsets, get, */*, allow
      p, role:auditor, projects,        get, *,   allow
      p, role:auditor, clusters,        get, *,   allow
      p, role:auditor, repositories,    get, *,   allow
      p, role:auditor, logs,            get, */*, deny

      # ──────────────── DENEGACIONES TRANSVERSALES ────────────────
      # exec da los privilegios de la cuenta del pod y el audit log registra a
      # Argo, no a la persona: para eso esta `oc rsh`. override rompe GitOps,
      # porque sincroniza algo distinto de lo que dice Git.
      p, role:platform-operator, exec,         create,   */*, deny
      p, role:app-developer,     exec,         create,   */*, deny
      p, role:release-manager,   exec,         create,   */*, deny
      p, role:auditor,           exec,         create,   */*, deny
      p, role:platform-operator, applications, override, */*, deny
      p, role:app-developer,     applications, override, */*, deny
      p, role:release-manager,   applications, override, */*, deny

      # ──────────────── CUENTA LOCAL DEL CI ────────────────
      # Politica directa, no via rol: con SSO activo un grupo que se llamara
      # igual que el rol heredaria sus permisos.
      p, pipeline, applications, get,  apps-nonprod/*,      allow
      p, pipeline, applications, sync, apps-nonprod/*-dev,  allow

      # ──────────────── GRUPOS ────────────────
      g, platform-operators, role:platform-operator
      g, app-developers,     role:app-developer
      g, release-managers,   role:release-manager
      g, platform-viewers,   role:auditor
  # Health checks personalizados: sin ellos Argo marca Healthy recursos que aún no están operativos.
  resourceHealthChecks:
    # Application anidada (patrón app-of-apps): propaga el estado real de salud de la app hija.
    - group: argoproj.io
      kind: Application
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            if obj.status.health.status ~= nil then
              hs.status = obj.status.health.status
            end
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
    # Políticas de Kuadrant: Healthy solo cuando la condición Enforced es True; Degraded si Accepted/Enforced es False.
    - group: kuadrant.io
      kind: AuthPolicy
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Esperando condiciones de estado"
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "Enforced" and c.status == "True" then
              hs.status = "Healthy"
              hs.message = c.message
              return hs
            end
            if (c.type == "Accepted" or c.type == "Enforced") and c.status == "False" then
              hs.status = "Degraded"
              hs.message = c.reason .. ": " .. c.message
              return hs
            end
          end
        end
        return hs
    - group: kuadrant.io
      kind: RateLimitPolicy
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Esperando condiciones de estado"
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "Enforced" and c.status == "True" then
              hs.status = "Healthy"
              hs.message = c.message
              return hs
            end
            if (c.type == "Accepted" or c.type == "Enforced") and c.status == "False" then
              hs.status = "Degraded"
              hs.message = c.reason .. ": " .. c.message
              return hs
            end
          end
        end
        return hs
    - group: kuadrant.io
      kind: TLSPolicy
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Esperando condiciones de estado"
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "Enforced" and c.status == "True" then
              hs.status = "Healthy"
              hs.message = c.message
              return hs
            end
            if (c.type == "Accepted" or c.type == "Enforced") and c.status == "False" then
              hs.status = "Degraded"
              hs.message = c.reason .. ": " .. c.message
              return hs
            end
          end
        end
        return hs
  # Se conserva por compatibilidad: inocuo hoy (ninguna Application observa ya este CR) y evita
  # diffs si en el futuro alguna app volviera a apuntar a un CR completado por el operador.
  resourceIgnoreDifferences:
    resourceIdentifiers:
      - group: argoproj.io
        kind: ArgoCD
        customization:
          managedFieldsManagers:
            - manager
