---
# Bootstrap del hub (día 0): lo IMPERATIVO que Argo CD necesita para existir y
# que por eso Argo no debe gestionar. Es idempotente: reejecutarlo es la vía de
# día 2 para el propio plano de control (p. ej. cambiar el tuning del CR ArgoCD).
#
# Qué hace, en orden:
#   1. Instala los operadores del hub (GitOps y ACM) y espera a que estén sanos.
#   2. Aplica el CR ArgoCD (tuning de la instancia) con server-side apply.
#   3. Aplica el RBAC extra del controller (ClusterRole argocd-gateway-api).
#   4. Crea TODOS los AppProjects (gitops-control, workshop-platform,
#      workshop-multicluster, workshop) — nadie usa project: default.
#   5. Siembra credenciales (repo-creds de Argo) desde el entorno, nunca de Git.
#   6. Aplica las root Applications: el único punto de entrega a Argo CD.
#   7. Espera a que Argo levante el MultiClusterHub y ACM quede Running.
#   8. IMPORTA los spokes en ACM (ManagedCluster + KlusterletAddonConfig +
#      auto-import-secret) y espera a que cada uno quede Available.
#   9. Homologa las etiquetas environment/role de TODOS los ManagedCluster.
#  10. Genera los secretos de día-0 que falten (quay-config-bundle,
#      rhdh-backend-secret): su contenido nunca se versiona, y sin ellos el
#      operador se queda bloqueado sin que Argo pueda desatascarlo. Va al final
#      porque sus namespaces los crea Argo. Si ya existen, NO se tocan.
#
# Uso:
#   1. Copiar clusters.example.yml a clusters.yml (queda fuera de Git) y poner
#      ahí el inventario de clusters del entorno propio.
#   2. Exportar las credenciales de los spokes en el entorno (ver clusters.yml).
#   3. Ejecutar:
#        ansible-playbook bootstrap/ansible/bootstrap.yml
#      (cualquier variable admite -e, p. ej. -e base_domain=apps.cluster-X.example.com)
#
# Variables (defaults abajo; los valores reales van en clusters.yml, nunca aquí):
#   base_domain       — dominio de apps del cluster HUB (lo que sigue a "*.").
#   quay_host         — hostname del registro Quay; por defecto se deriva del base_domain.
#   keycloak_host     — hostname del SSO; por defecto se deriva del base_domain.
#   storage_class     — StorageClass para volúmenes persistentes (monitorización de prod).
#   managed_clusters  — inventario de clusters: nombre, etiquetas y acceso de import.
#   root_applications — lista de YAML de Applications raíz a aplicar.
#
# Credenciales: SIEMPRE por variables de entorno (lookup('env', ...)) o vault.
# Ningún token ni kubeconfig se escribe en Git ni en el inventario.
#
# Requiere: la colección kubernetes.core y un KUBECONFIG con cluster-admin del HUB.

- name: Bootstrap del hub — plano de control de GitOps y ACM
  hosts: localhost
  connection: local
  gather_facts: false

  # El inventario real (clusters.yml) pisa estos defaults; -e pisa a ambos.
  vars_files:
    - "{{ lookup('first_found', ['clusters.yml', 'clusters.example.yml'], errors='ignore') }}"

  vars:
    # Raíz del repo, para referenciar los manifiestos versionados junto al playbook.
    repo_root: "{{ playbook_dir }}/../.."
    # Dominio de apps del cluster hub: se fija en clusters.yml o con -e.
    base_domain: CHANGE_ME_BASE_DOMAIN
    # Hostname del registro Quay: el operador publica la ruta <registro>-quay-<namespace>, y con el QuayRegistry company-quay en quay-enterprise queda company-quay-quay-quay-enterprise.
    quay_host: "company-quay-quay-quay-enterprise.{{ base_domain }}"
    # Hostname del SSO (overlay de Keycloak del ambiente).
    keycloak_host: "sso.{{ base_domain }}"
    # StorageClass para los volúmenes persistentes; vacío = la default del cluster.
    storage_class: ""
    # Manifiestos del plano de control: los aplica este playbook, no Argo.
    manifiestos_bootstrap:
      - "{{ repo_root }}/bootstrap/manifests/argocd.yaml"
      - "{{ repo_root }}/bootstrap/manifests/argocd-gateway-api-clusterrole.yaml"
      - "{{ repo_root }}/bootstrap/manifests/argocd-operators-clusterrole.yaml"
      - "{{ repo_root }}/bootstrap/manifests/argocd-namespace-governance-clusterrole.yaml"
      - "{{ repo_root }}/bootstrap/manifests/gitops-control-appproject.yaml"
      - "{{ repo_root }}/bootstrap/manifests/workshop-platform-appproject.yaml"
      - "{{ repo_root }}/bootstrap/manifests/workshop-preview-appproject.yaml"
      - "{{ repo_root }}/bootstrap/manifests/workshop-multicluster-appproject.yaml"
      - "{{ repo_root }}/bootstrap/manifests/workshop-appproject.yaml"
      - "{{ repo_root }}/bootstrap/manifests/default-appproject.yaml"
    # Inventario de clusters por defecto: SOLO el hub. El inventario real, con
    # los spokes y su acceso, vive en clusters.yml (copiar de clusters.example.yml).
    managed_clusters:
      - name: local-cluster
        environment: hub
        role: hub
    # Secretos que el bootstrap genera cuando faltan. El contenido nunca se
    # versiona: las claves salen de un aleatorio distinto en cada instalación.
    # La config de Quay es la del día-0 documentada en docs/bootstrap-and-gitops.md.
    secretos_generados:
      - name: quay-config-bundle
        namespace: quay-enterprise
        data:
          config.yaml: |
            SECRET_KEY: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') | lower }}"
            DATABASE_SECRET_KEY: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') | lower }}"
            AUTHENTICATION_TYPE: Database
            FEATURE_USER_INITIALIZE: true
            FEATURE_USER_CREATION: false
            FEATURE_ANONYMOUS_ACCESS: false
            FEATURE_GARBAGE_COLLECTION: true
            FEATURE_AUTO_PRUNE: true
            FEATURE_CHANGE_TAG_EXPIRATION: true
            DEFAULT_TAG_EXPIRATION: 2w
            TAG_EXPIRATION_OPTIONS: [2w, 4w, 8w]
            FEATURE_GENERAL_OCI_SUPPORT: true
            FEATURE_REFERRERS_API: true
            FEATURE_QUOTA_MANAGEMENT: true
            FEATURE_USER_LOG_ACCESS: true
      - name: rhdh-backend-secret
        namespace: developer-hub
        data:
          BACKEND_SECRET: "{{ lookup('password', '/dev/null length=32') }}"
    # Root Applications: la entrega a Argo; a partir de aquí gobierna GitOps.
    root_applications:
      - "{{ repo_root }}/gitops/apps/root-application.yaml"
    # Spokes a importar: todo cluster del inventario que declare api_url.
    spokes: "{{ managed_clusters | selectattr('api_url', 'defined') | list }}"

  tasks:
    # --- 1. Operadores del hub (huevo-gallina: ACM aún no existe para instalarlos) ---
    - name: Instalar Subscription/OperatorGroup de GitOps y ACM
      kubernetes.core.k8s:
        state: present
        # El lookup permite archivos multi-documento (Namespace + OperatorGroup + Subscription).
        definition: "{{ lookup('file', item) }}"
      loop:
        - "{{ repo_root }}/bootstrap/manifests/openshift-gitops-subscription.yaml"
        - "{{ repo_root }}/bootstrap/manifests/acm-subscription.yaml"

    - name: Esperar a que el CSV de cada operador llegue a Succeeded
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: "{{ item.ns }}"
      register: csv_info
      # Reintenta hasta que el CSV del paquete esté en fase Succeeded.
      until: csv_info.resources | selectattr('metadata.name', 'search', item.paquete) | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
      retries: 60
      delay: 10
      loop:
        - { ns: openshift-operators, paquete: openshift-gitops-operator }
        - { ns: open-cluster-management, paquete: advanced-cluster-management }

    # --- 2..4. Plano de control de Argo: CR, RBAC y AppProjects ---
    - name: Aplicar CR ArgoCD, RBAC del controller y AppProjects (server-side apply)
      kubernetes.core.k8s:
        state: present
        # Los replace inyectan los valores del entorno sin hardcodearlos en Git.
        definition: "{{ lookup('file', item) | replace('CHANGE_ME_BASE_DOMAIN', base_domain) | replace('CHANGE_ME_QUAY_HOST', quay_host) | replace('CHANGE_ME_KEYCLOAK_HOST', keycloak_host) | replace('CHANGE_ME_STORAGECLASS', storage_class) }}"
        # Server-side apply: requisito para ADOPTAR recursos existentes sin recrearlos
        # y para un CR que el operador completa con defaults.
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
      loop: "{{ manifiestos_bootstrap }}"

    # --- 5. Credenciales: del entorno o de un vault, nunca de Git ---
    - name: Sembrar repo-creds de Argo si el repositorio es privado
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: workshop-repo-creds
            namespace: openshift-gitops
            labels:
              argocd.argoproj.io/secret-type: repo-creds
          stringData:
            url: "{{ lookup('env', 'GIT_REPO_URL') }}"
            username: "{{ lookup('env', 'GIT_USERNAME') }}"
            password: "{{ lookup('env', 'GIT_TOKEN') }}"
      # Solo si hay credenciales en el entorno; los repos públicos no las necesitan.
      when: lookup('env', 'GIT_TOKEN') | length > 0
      no_log: true

    # --- 6. Entrega a Argo CD: el único "oc apply" conceptual del modelo ---
    - name: Aplicar las root Applications (a partir de aquí gobierna Argo)
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', item) }}"
        # También con SSA: adopta un root ya existente sin recrearlo.
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
      loop: "{{ root_applications }}"

    # --- 7. Esperar el hub de ACM ---
    # El MultiClusterHub lo crea Argo (Application acm) al sincronizar la root:
    # hasta que ACM no está Running no existen ni el CRD ManagedCluster ni el
    # import de clusters. Por eso este wait va DESPUÉS de la entrega a Argo.
    - name: Esperar a que el MultiClusterHub llegue a Running (lo crea Argo; tarda varios minutos)
      kubernetes.core.k8s_info:
        api_version: operator.open-cluster-management.io/v1
        kind: MultiClusterHub
        namespace: open-cluster-management
        name: multiclusterhub
      register: mch_info
      until: >-
        mch_info.resources is defined and
        mch_info.resources | length > 0 and
        (mch_info.resources[0].status.phase | default('')) == 'Running'
      retries: 90
      delay: 20

    # --- 8. Importar los spokes en ACM ---
    # Idempotente: si el cluster ya está importado, los apply no cambian nada y
    # el auto-import-secret ni se crea (solo hace falta para el primer join).
    - name: Crear el namespace de cada spoke en el hub
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item.name }}"
      loop: "{{ spokes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Declarar el ManagedCluster de cada spoke (hubAcceptsClient)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cluster.open-cluster-management.io/v1
          kind: ManagedCluster
          metadata:
            name: "{{ item.name }}"
            labels:
              cluster.open-cluster-management.io/clusterset: default
              environment: "{{ item.environment }}"
              role: "{{ item.role }}"
          spec:
            hubAcceptsClient: true
      loop: "{{ spokes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Habilitar los addons de ACM en cada spoke (KlusterletAddonConfig)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: agent.open-cluster-management.io/v1
          kind: KlusterletAddonConfig
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ item.name }}"
          spec:
            clusterName: "{{ item.name }}"
            clusterNamespace: "{{ item.name }}"
            clusterLabels:
              cloud: auto-detect
              vendor: auto-detect
            # policyController es imprescindible: sin él las OperatorPolicy no llegan al spoke.
            applicationManager:
              enabled: true
            policyController:
              enabled: true
            certPolicyController:
              enabled: true
            searchCollector:
              enabled: true
      loop: "{{ spokes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Consultar si cada spoke ya hizo join (para no re-importarlo)
      kubernetes.core.k8s_info:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ item.name }}"
      register: mc_estado
      loop: "{{ spokes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Crear el auto-import-secret de los spokes pendientes de join
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: auto-import-secret
            namespace: "{{ item.item.name }}"
          # El acceso sale del ENTORNO: token (token_env + api_url) o kubeconfig (kubeconfig_env = ruta).
          stringData: "{{ {'autoImportRetry': '10'} | combine({'token': lookup('env', item.item.token_env), 'server': item.item.api_url} if item.item.token_env is defined else {'kubeconfig': lookup('file', lookup('env', item.item.kubeconfig_env))}) }}"
      # Solo si el spoke aún no está unido: el secret es de un solo uso (ACM lo consume).
      when: >-
        item.resources | default([]) | map(attribute='status.conditions', default=[]) | flatten
        | selectattr('type', 'equalto', 'ManagedClusterJoined')
        | selectattr('status', 'equalto', 'True') | list | length == 0
      loop: "{{ mc_estado.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    - name: Esperar a que cada spoke quede Available en ACM
      kubernetes.core.k8s_info:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ item.name }}"
      register: mc_disponible
      until: >-
        mc_disponible.resources | default([]) | map(attribute='status.conditions', default=[]) | flatten
        | selectattr('type', 'equalto', 'ManagedClusterConditionAvailable')
        | selectattr('status', 'equalto', 'True') | list | length > 0
      retries: 60
      delay: 10
      loop: "{{ spokes }}"
      loop_control:
        label: "{{ item.name }}"

    # --- 9. Homologar las etiquetas de los ManagedCluster ---
    # Los Placement seleccionan por etiqueta, así que TODOS los clusters deben
    # llevar el mismo juego. Cubre también el local-cluster (que no pasa por el
    # import) y re-homologa spokes importados a mano por fuera de este playbook.
    #
    #   environment: dev|prod|hub  → QUÉ ambiente sirve (elige el overlay)
    #   role:        hub|workload  → SI aloja el plano de control de GitOps/ACM
    - name: Homologar etiquetas de ambiente y rol en los ManagedCluster
      kubernetes.core.k8s:
        state: patched
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ item.name }}"
        definition:
          metadata:
            labels:
              environment: "{{ item.environment }}"
              role: "{{ item.role }}"
      loop: "{{ managed_clusters }}"
      loop_control:
        label: "{{ item.name }} → environment={{ item.environment }} role={{ item.role }}"

    # --- 10. Secretos de día-0 (al final: sus namespaces los crea Argo) ---
    # Secretos de día-0 que ningún manifiesto puede traer: su contenido NUNCA se
    # versiona. Se generan aquí, en el arranque en frío, porque sin ellos el
    # operador se queda bloqueado y Argo no tiene forma de desatascarlo:
    #   quay-config-bundle  -> sin él el operador no reconcilia el QuayRegistry
    #   rhdh-backend-secret -> sin él el pod de Developer Hub entra en CrashLoop
    #
    # Las claves se generan aleatorias y ÚNICAS por instalación. La comprobación
    # previa es lo que hace esto idempotente: si el Secret ya existe NO se toca,
    # porque rotar SECRET_KEY/DATABASE_SECRET_KEY sobre una instancia con datos
    # la deja inservible (no podría descifrar lo que ya guardó).
    - name: Comprobar si los secretos de día-0 ya existen
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item.name }}"
        namespace: "{{ item.namespace }}"
      register: secretos_dia0
      loop: "{{ secretos_generados }}"
      loop_control:
        label: "{{ item.namespace }}/{{ item.name }}"

    - name: Crear los secretos de día-0 que falten (claves aleatorias por instalación)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.item.name }}"
            namespace: "{{ item.item.namespace }}"
          stringData: "{{ item.item.data }}"
      # Solo los que la consulta anterior no encontró: no se re-generan claves.
      when: item.resources | length == 0
      loop: "{{ secretos_dia0.results }}"
      loop_control:
        label: "{{ item.item.namespace }}/{{ item.item.name }}"
      no_log: true
