# ClusterIssuer contra una CA real (ACME/Let's Encrypt). El selfsigned solo no
# vale para prod: nadie confia en esos certs sin distribuir la CA. Este emite
# certificados que los clientes validan.
#
# NO-PRODUCCION: el email y el solver dependen del entorno del cliente; en prod la
# cuenta ACME va por ESO. En banca suele ser la CA corporativa (issuer tipo `ca`)
# en vez de Let's Encrypt. Ver docs/production-outside-the-lab.md.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: acme-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # El correo de contacto es opcional en ACME; un placeholder literal rompe el registro de la cuenta.
    # El correo real del cliente se inyecta fuera de Git (parche del overlay o ESO), nunca aquí.
    privateKeySecretRef:
      name: acme-production-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: openshift-default
