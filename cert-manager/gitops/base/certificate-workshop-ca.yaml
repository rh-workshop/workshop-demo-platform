# Patron bootstrap-CA: en vez de usar el selfsigned "a pelo" (cada cert es una
# isla), se construye una CA propia distribuible.
#   1. El selfsigned firma un Certificate que ES una CA (isCA: true).
#   2. Ese cert se convierte en un ClusterIssuer tipo `ca`.
# Asi todo el trafico interno comparte una raiz que se puede distribuir a los
# clientes una sola vez.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: workshop-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: workshop-ca
  secretName: workshop-ca-tls
  # Sin duration, cert-manager emite a 90 dias y renueva a los 60: cada rotacion
  # invalida la CA ya distribuida a los clientes. Una raiz se emite a largo plazo.
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 384
    # La clave de la raiz no rota con el certificado: rotarla invalidaria todo lo
    # que firmo.
    rotationPolicy: Never
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
    group: cert-manager.io
---
# ClusterIssuer de la CA propia: emite certs firmados por workshop-ca. Es el que
# usan los servicios internos (en vez del selfsigned directo).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: workshop-ca
spec:
  ca:
    secretName: workshop-ca-tls
