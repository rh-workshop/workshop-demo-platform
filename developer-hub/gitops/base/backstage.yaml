# La instancia de Red Hat Developer Hub (el Backstage de Red Hat).
#
# El operador la reconcilia: crea el Deployment, el Service, la Route y una base
# de datos PostgreSQL por defecto. Toda la configuracion se inyecta por
# referencia a ConfigMaps, para que sea declarativa y la gobierne Argo CD:
#   - appConfig: el app-config.yaml (catalogo, integraciones, auth)
#   - dynamicPluginsConfigMapName: que plugins se cargan (Argo CD, Tekton...)
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: developer-hub
  namespace: developer-hub
spec:
  # NO-PRODUCCION: enableLocalDb usa la DB embebida del operador (1Gi, sin backup
  # ni HA). En prod = PostgreSQL externo (enableLocalDb: false + POSTGRES_* por
  # Secret via ESO). Ver docs/produccion-fuera-del-lab.md.
  database:
    enableLocalDb: true
  application:
    appConfig:
      configMaps:
        - name: app-config-rhdh
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    route:
      enabled: true
  # NO-PRODUCCION: replicas 2 y resources ajustados requieren DB externa (con la
  # DB embebida no se debe escalar). Se declara para prod; en el lab con DB
  # embebida el operador mantiene 1 replica.
  deployment:
    patch:
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: backstage-backend
                resources:
                  requests:
                    cpu: 500m
                    memory: 1Gi
                  limits:
                    cpu: "2"
                    memory: 3Gi
    # Secretos inyectados como env: el backend service-to-service secret y (en
    # prod) las credenciales OIDC de Keycloak. Se crean por ESO, nunca en Git.
    extraEnvs:
      secrets:
        - name: rhdh-backend-secret
    # El rbac-policy.csv se monta como fichero para que el plugin RBAC lo lea.
    extraFiles:
      mountPath: /opt/app-root/src/rbac
      configMaps:
        - name: rbac-policy-rhdh
          key: rbac-policy.csv
