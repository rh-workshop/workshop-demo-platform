# Role de desarrollador ACOTADO para workshop-demo-dev: sin secrets Y sin los
# recursos que argocd-push no posee.
#
# DOS restricciones distintas, no una:
#
# 1. SIN SECRETS. Aquí viven los Secrets del CI (argocd-env-secret,
#    git-credentials, cosign-signing-key, quay-push-credentials,
#    acs-pipeline-credentials) y con ClusterRole `edit` cualquier miembro de
#    app-developers los leía — escalada directa al GitOps de los 3 clusters.
#    Los demás namespaces de aplicación conservan el Role genérico
#    (../../profiles/app-namespace/role-app-developers.yaml): no albergan
#    secretos de CI.
#
# 2. SOLO RECURSOS QUE argocd-push YA POSEE. Verificado en vivo (2026-09-04):
#    la version anterior de este Role pedia `pods/exec`, `buildconfigs`,
#    `imagestreams` y Tekton — ninguno declarado en
#    gitops/clusters/argocd-push/clusterpermission-argocd-push-{nonprod,prod}.yaml.
#    argocd-push no puede otorgar lo que no tiene ("attempting to grant RBAC
#    permissions not currently held"), así que ese Role habría fallado al
#    sincronizar igual que el RoleBinding a ClusterRole/edit. Se recorta al
#    mismo subconjunto verificado del perfil genérico.
#
# Los verbos van enumerados y no como `*`: un comodín concede también los verbos
# que el grupo de API gane en versiones futuras, sin que nadie los revise.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-developer-no-secrets
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes", "routes/custom-host"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kuadrant.io"]
    resources: ["authpolicies", "ratelimitpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["destinationrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
