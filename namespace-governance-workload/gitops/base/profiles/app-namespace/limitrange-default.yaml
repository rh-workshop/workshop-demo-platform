# Defaults por contenedor: sin esto, platform-quota rechaza cualquier pod que
# no declare `resources`.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
