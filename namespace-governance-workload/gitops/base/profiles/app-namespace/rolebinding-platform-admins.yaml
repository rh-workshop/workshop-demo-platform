# Referencia al Role ACOTADO (role-platform-admins.yaml), no al ClusterRole
# 'admin'. Ver el comentario de ese fichero.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: platform-admins
