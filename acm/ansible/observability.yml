---
# Conexion al object storage de la observabilidad multi-cluster.
#
# POR QUE ES UN PLAYBOOK Y NO UN MANIFIESTO DE ARGO. El Secret lleva las llaves
# de acceso al bucket, asi que no puede versionarse en Git. Argo despliega el
# MultiClusterObservability, que lo referencia POR NOMBRE; quien rellena su
# contenido es este playbook. Es el mismo reparto que en quay/ansible/storage.yml.
#
# QUE HACE:
#   1. Crea el bucket de metricas si falta (idempotente).
#   2. Compone el thanos.yaml con la conexion y lo deja como Secret en el
#      namespace de la observabilidad.
#
# BACKEND. Reutiliza `quay_storage_backend` de vars/platform-vars.yml, que es la
# decision de plataforma sobre donde vive el object storage:
#   s3     -> bucket nativo de la nube (durabilidad y escalado del proveedor).
#   noobaa -> MCG sobre un PVC, para clusters sin object storage de nube. En ese
#             caso el endpoint es el servicio de NooBaa y las llaves salen del
#             Secret que genera su ObjectBucketClaim.
#
# El bucket de metricas es DISTINTO del de imagenes a proposito: son datos con
# ciclos de vida y retenciones que no tienen por que coincidir, y separarlos
# permite aplicar politicas de retencion distintas sin afectar al registro.
- name: Configurar el object storage de la observabilidad
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [acm, observability]

  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    # El namespace NO es elegible: el operador solo reconcilia el CR aqui.
    observability_namespace: open-cluster-management-observability
    # Nombre del Secret que referencia el MultiClusterObservability en
    # storageConfig. NO lo crea este playbook: lo materializa el ExternalSecret.
    thanos_secret: thanos-object-storage
    # Almacen de secretos: donde se deposita la conexion y de donde la lee ESO.
    vault_namespace: openbao
    # Ruta dentro del almacen. Debe coincidir con el `remoteRef.key` del
    # ExternalSecret, o este no encuentra nada que entregar.
    vault_path: platform/observability

  tasks:
    - name: Exigir el token de operación
      ansible.builtin.fail:
        msg: >-
          Falta el token de operación. Exportalo antes de ejecutar:
            export BAO_OPERATOR_TOKEN='<token raiz o de un operador con permisos>'
          Los tokens eso-read-* son de solo lectura y no sirven para escribir
          en el almacén.
      when: lookup('env', 'BAO_OPERATOR_TOKEN') | length == 0

    # El nombre del bucket es global en S3: derivarlo del identificador de
    # infraestructura evita colisionar con otra instalacion del mismo material.
    - name: Resolver el nombre de infraestructura del cluster
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
      register: infra

    - name: Fijar los datos del bucket de metricas
      ansible.builtin.set_fact:
        obs_bucket: "{{ observability_s3_bucket if observability_s3_bucket | length > 0 else 'acm-observability-' ~ infra.resources[0].status.infrastructureName }}"
        obs_region: "{{ infra.resources[0].status.platformStatus.aws.region | default('us-east-1') }}"

    # Se reutilizan las credenciales que ya resuelve el flujo de Quay: son del
    # mismo proveedor y el mismo cluster. Si el CCO acuño una identidad propia,
    # se prefiere esa; si no, las del entorno.
    - name: Buscar credenciales de S3
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: quay-enterprise
        name: quay-s3-credentials
      register: s3_secret

    - name: Resolver las credenciales de S3
      ansible.builtin.set_fact:
        s3_access_key: >-
          {{ (s3_secret.resources[0].data.aws_access_key_id | b64decode)
             if s3_secret.resources | length > 0 and s3_secret.resources[0].data.aws_access_key_id is defined
             else lookup('env', 'AWS_ACCESS_KEY_ID') }}
        s3_secret_key: >-
          {{ (s3_secret.resources[0].data.aws_secret_access_key | b64decode)
             if s3_secret.resources | length > 0 and s3_secret.resources[0].data.aws_secret_access_key is defined
             else lookup('env', 'AWS_SECRET_ACCESS_KEY') }}
      no_log: true

    - name: Comprobar que hay credenciales de object storage
      ansible.builtin.assert:
        that:
          - s3_access_key | trim | length > 0
          - s3_secret_key | trim | length > 0
        fail_msg: >-
          No hay credenciales para el bucket de metricas. Crea el secreto
          quay-enterprise/quay-s3-credentials o exporta AWS_ACCESS_KEY_ID y
          AWS_SECRET_ACCESS_KEY.

    # Idempotente: create-bucket sobre un bucket propio ya existente devuelve
    # BucketAlreadyOwnedByYou, que no es un error que deba parar el bootstrap.
    - name: Crear el bucket de metricas si falta
      ansible.builtin.command:
        argv:
          - aws
          - s3api
          - create-bucket
          - --bucket
          - "{{ obs_bucket }}"
          - --region
          - "{{ obs_region }}"
          - --create-bucket-configuration
          - "LocationConstraint={{ obs_region }}"
      environment:
        AWS_ACCESS_KEY_ID: "{{ s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ s3_secret_key }}"
      register: bucket_create
      changed_when: bucket_create.rc == 0
      failed_when:
        - bucket_create.rc != 0
        - "'BucketAlreadyOwnedByYou' not in bucket_create.stderr"
        - "'BucketAlreadyExists' not in bucket_create.stderr"
      when: quay_storage_backend == 's3'

    # El namespace lo crea Argo con la Application de acm: se espera en vez de
    # crearlo aqui para no disputarle la propiedad del objeto.
    # El almacen lo despliega Argo (openbao/gitops): se espera a que este listo
    # en vez de crearlo aqui, para no disputarle la propiedad del objeto.
    - name: Esperar a que el almacen de secretos responda
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ vault_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=openbao
        field_selectors:
          - status.phase=Running
      register: bao_pod
      until: >-
        bao_pod.resources | length > 0 and
        (bao_pod.resources[0].status.containerStatuses | default([{}]))[0].ready | default(false)
      retries: 30
      delay: 10

    # SE DEPOSITA EN EL ALMACEN, NO EN EL CLUSTER. Antes esta tarea escribia el
    # Secret directamente; ahora quien lo materializa es el ExternalSecret que
    # gobierna Argo (acm/gitops/base/observability/externalsecret-thanos.yaml).
    # Escribir aqui ademas dejaria DOS duenos sobre el mismo objeto, peleandose
    # en cada reconciliacion.
    #
    # Formato que espera Thanos: un YAML con el tipo de backend y su config.
    - name: Depositar la conexion al object storage en el almacen
      kubernetes.core.k8s_exec:
        namespace: "{{ vault_namespace }}"
        pod: "{{ bao_pod.resources[0].metadata.name }}"
        command: >-
          env BAO_TOKEN={{ lookup('env', 'BAO_OPERATOR_TOKEN') }}
          BAO_ADDR=https://127.0.0.1:8200
          BAO_CACERT=/openbao/tls/ca.crt
          bao kv put -mount=secret {{ vault_path }}
          thanos.yaml={{ conexion_thanos | quote }}
      vars:
        conexion_thanos: |
          type: s3
          config:
            bucket: {{ obs_bucket }}
            endpoint: s3.{{ obs_region }}.amazonaws.com
            access_key: {{ s3_access_key }}
            secret_key: {{ s3_secret_key }}
      no_log: true

    - name: Informar del backend configurado
      ansible.builtin.debug:
        msg: >-
          Observabilidad apuntando a s3://{{ obs_bucket }} ({{ obs_region }}).
          La conexion queda en el almacen bajo {{ vault_path }}; el ExternalSecret
          que gobierna Argo la materializa como Secret `{{ thanos_secret }}`, que
          es el que referencia el MultiClusterObservability.
