# Namespaces destino de los operadores EN EL HUB. Un OperatorPolicy enforce no
# garantiza el Namespace donde instala; sin él, el primer despliegue limpio
# quedaría NonCompliant. Se crean aquí, antes que las OperatorPolicy.
#
# Ojo: esta aplicación de Argo corre solo en el hub. Los namespaces de los
# clusters workload los distribuye la ConfigurationPolicy de
# install-operators-workload-policy.yaml, que sí llega a los spokes.
#
# quay-enterprise y kuadrant-system NO se declaran aquí: ya los declara la
# Application de su producto (quay y connectivity-link-hub); duplicarlos deja
# a esta app OutOfSync perpetua por el tracking-id ajeno del otro dueño.
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
---
apiVersion: v1
kind: Namespace
metadata:
  name: rhdh-operator
---
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-operator
