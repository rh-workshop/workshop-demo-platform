# Extiende require-resourcequota a los clusters workload: sin este binding los
# spokes quedaban sin gobierno de cuota. Es seguro porque la Policy usa
# object-templates-raw: en un spoke sin namespaces de negocio evalua vacio y
# queda Compliant, sin ruido.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: require-resourcequota-workload-binding
  namespace: open-cluster-management
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: clusters-workload
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: require-resourcequota
