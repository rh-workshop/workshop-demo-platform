# Une la Policy con el Placement: "aplica require-resourcequota a los clusters que
# selecciona clusters-prod". Sin este binding la Policy no evalua nada.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: require-resourcequota-binding
  namespace: open-cluster-management
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: clusters-prod
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: require-resourcequota
