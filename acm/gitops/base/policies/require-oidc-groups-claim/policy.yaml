# Policy de gobierno: el proveedor OIDC de cada spoke debe pedir el claim
# `groups`, y ACM lo corrige si falta.
#
# QUE PROBLEMA RESUELVE. La autenticacion en OpenShift es por cluster: cada uno
# resuelve la pertenencia contra sus propios objetos Group, que crea su servidor
# OAuth al iniciar sesion a partir de este claim. Sin el, un usuario entra en el
# spoke sin ningun grupo, y los ClusterRoleBinding que reparte ACM
# (gitops/clusters/human-access/) no encuentran a nadie a quien aplicar: el
# acceso queda concedido sobre el papel y vacio en la practica.
#
# POR QUE `lookup` Y NO UN OBJETO FIJO. El proveedor `rhbk` lleva un `issuer` y
# un `clientSecret` DISTINTOS en cada cluster. Una plantilla con valores fijos
# los reescribiria con los de otro cluster y lo dejaria sin acceso por Keycloak
# -- incluido el de quien fuera a arreglarlo. Aqui se leen del propio cluster con
# `lookup` y se reinyectan tal cual: lo unico que esta politica aporta es el
# claim `groups`.
#
# EL HUB NO ENTRA AQUI. El hub despliega Keycloak, asi que autentica solo por
# htpasswd para no depender de si mismo (ver oauth-hub.reference.yaml). Por eso
# el PlacementBinding es unicamente para `clusters-workload`.
#
# Requiere ademas que el cliente de Keycloak emita el claim: un mapper de tipo
# "Group Membership" con full.path=false, o los nombres llegan como /grupo y no
# coinciden con los Group ni con la politica de Argo.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-2 Account Management
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: require-oidc-groups-claim
  namespace: open-cluster-management
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: require-oidc-groups-claim
        spec:
          remediationAction: enforce
          severity: high
          # El OAuth de un cluster sin proveedor OIDC no se toca: la plantilla
          # se salta el cluster en vez de escribir un proveedor a medias.
          object-templates-raw: |
            {{- $oauth := (lookup "config.openshift.io/v1" "OAuth" "" "cluster") }}
            {{- range $idp := $oauth.spec.identityProviders }}
            {{- if eq $idp.type "OpenID" }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders:
                    - name: {{ $idp.name }}
                      type: OpenID
                      mappingMethod: {{ $idp.mappingMethod }}
                      openID:
                        # Leidos del propio cluster: cada uno tiene los suyos.
                        clientID: {{ $idp.openID.clientID }}
                        clientSecret:
                          name: {{ $idp.openID.clientSecret.name }}
                        issuer: {{ $idp.openID.issuer }}
                        claims:
                          preferredUsername: {{ $idp.openID.claims.preferredUsername | toRawJson }}
                          name: {{ $idp.openID.claims.name | toRawJson }}
                          email: {{ $idp.openID.claims.email | toRawJson }}
                          # Lo unico que aporta esta politica.
                          groups: [groups]
            {{- end }}
            {{- end }}
