# Policy de gobierno: exige que exista una ResourceQuota en el namespace.
#
# Una Policy de ACM es una regla que el hub evalua sobre los clusters que le
# indique el Placement. Esta comprueba (musthave) que el namespace tenga una
# ResourceQuota con topes de CPU y memoria: sin ella, una carga defectuosa podria
# consumir todo el cluster.
#
# remediationAction: inform -> solo REPORTA si se cumple o no; no crea nada. Es
# lo prudente para empezar: primero se ve el mapa de cumplimiento y luego, si se
# decide, se cambia a enforce para que ACM cree la cuota donde falte.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: exigir-resourcequota
  namespace: open-cluster-management
spec:
  disabled: false
  remediationAction: inform
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: exigir-resourcequota-config
      spec:
        remediationAction: inform
        severity: low
        # namespaceSelector: gobierna los namespaces de NEGOCIO (bian-*, user*),
        # no 'default' (que no protege ninguna app real). Excluye los de sistema.
        namespaceSelector:
          include:
            - "bian-*"
            - "user*"
          exclude:
            - "openshift-*"
            - "kube-*"
            - default
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: platform-quota
            spec:
              hard:
                requests.cpu: '4'
                requests.memory: 8Gi
                # limits ademas de requests: sin techo de limits, un pod puede
                # pedir poco y consumir mucho en picos.
                limits.cpu: '8'
                limits.memory: 16Gi
