# Policy de gobierno: exige que exista un LimitRange en el namespace.
#
# Es la PAREJA INSEPARABLE de require-resourcequota y por eso viaja como Policy
# con ella: una cuota sin defaults rechaza todo pod que no declare resources
# (los de pipeline y los sidecars, tipicamente). Si la cuota la impone ACM y el
# LimitRange lo pusiera Argo, entre que se crea una y llega el otro habria una
# ventana en la que los despliegues fallan.
#
# El default de 2Gi da margen a los pasos de build (buildah) de workshop-demo-dev.
#
# remediationAction: enforce -> ACM lo crea donde falte. Es seguro: un
# LimitRange solo RELLENA lo que el pod no declara, nunca recorta lo declarado.
#
# object-templates-raw en vez de namespaceSelector: mismo motivo que en
# require-resourcequota — cero namespaces coincidentes debe ser Compliant para
# poder extender la Policy a los spokes sin ruido.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: require-limitrange
  namespace: open-cluster-management
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: require-limitrange-config
      spec:
        remediationAction: enforce
        severity: low
        object-templates-raw: |
          {{- /* Mismo conjunto de namespaces de negocio que require-resourcequota. */ -}}
          {{- range (lookup "v1" "Namespace" "" "").items }}
          {{- $ns := .metadata.name }}
          {{- if and (or (hasSuffix "-demo-dev" $ns) (hasSuffix "-demo-test" $ns) (hasSuffix "-demo-prod" $ns) (hasSuffix "-demo-contingencia" $ns)) (not (hasPrefix "openshift-" $ns)) (not (hasPrefix "kube-" $ns)) (ne $ns "default") }}
          - complianceType: musthave
            objectDefinition:
              apiVersion: v1
              kind: LimitRange
              metadata:
                name: default-limits
                namespace: {{ $ns }}
              spec:
                limits:
                  - type: Container
                    defaultRequest:
                      cpu: 25m
                      memory: 64Mi
                    default:
                      cpu: "1"
                      memory: 2Gi
          {{- end }}
          {{- end }}
