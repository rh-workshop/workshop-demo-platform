# Policy de gobierno: cada cluster workload debe tener una via de acceso que no
# dependa de Keycloak.
#
# QUE PROBLEMA RESUELVE. Con un unico proveedor OIDC, si Keycloak no responde el
# servidor OAuth devuelve 500 y NADIE entra en ese cluster -- tampoco quien iba a
# arreglar Keycloak. Y `kubeadmin` ya se retiro. Un proveedor htpasswd lo valida
# el propio API server contra un Secret local, sin salir del cluster.
#
# EL SECRET NO VIAJA POR AQUI. El hash de la contrasena es un secreto y no puede
# vivir en Git: lo entrega un ManifestWork por cluster durante el bootstrap. Esta
# Policy solo declara el PROVEEDOR, que no contiene material sensible -- unicamente
# el nombre del Secret. Si el Secret no existe, el proveedor no autentica a nadie
# y el resto del OAuth sigue funcionando.
#
# musthave SOBRE UNA LISTA: ACM comprueba que el elemento figure entre los
# identityProviders y lo anade si falta, sin tocar los que ya estan. Por eso no
# hace falta leer `rhbk` con lookup como en require-oidc-groups-claim: alli habia
# que REESCRIBIR un proveedor existente (y preservar su clientSecret), aqui solo
# se anade uno nuevo.
#
# GOBIERNO: estas cuentas no son para el dia a dia. El audit log registra el
# usuario, asi que una regla sobre ese nombre en el SIEM (G.1 del backlog) avisa
# de cada acceso. Rotar la contrasena tras cada uso.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-2 Account Management
    policy.open-cluster-management.io/standards: NIST SP 800-53
  name: require-break-glass-idp
  namespace: open-cluster-management
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: require-break-glass-idp
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: OAuth
                metadata:
                  name: cluster
                spec:
                  identityProviders:
                    - name: break-glass
                      mappingMethod: claim
                      type: HTPasswd
                      htpasswd:
                        fileData:
                          name: break-glass-htpasswd
