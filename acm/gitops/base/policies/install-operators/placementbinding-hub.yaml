# Une la Policy de operadores del hub con su Placement.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: install-operators-hub-binding
  namespace: open-cluster-management
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: clusters-hub
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: install-operators-hub
