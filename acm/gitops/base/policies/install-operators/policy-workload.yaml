# Instalacion de los operadores WORKLOAD, por ACM.
#
# Estos van a los clusters de carga (dev y prod), no al hub. Mismo patron:
# ACM instala el operador (OperatorPolicy), Argo configura el operando.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: install-operators-workload
  namespace: open-cluster-management
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    # Los Namespaces destino van PRIMERO y por Policy, no por Argo: la aplicación
    # de Argo que los crea corre solo en el hub, y en los spokes nadie los crearía.
    # Sin el Namespace, la OperatorPolicy queda NonCompliant para siempre.
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: operator-namespaces
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: keycloak
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: cert-manager-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: kuadrant-system
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: kafka
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: rhacs-operator
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: stackrox
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhbk-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - rhbk-operator.v26.4.15-opr.1   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: rhbk-operator
            namespace: keycloak
            channel: stable-v26.4
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: cert-manager-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - cert-manager-operator.v1.20.0   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
            channel: stable-v1
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhcl-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - rhcl-operator.v1.4.2   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: rhcl-operator
            namespace: kuadrant-system
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: openshift-external-secrets-operator
        spec:
          # Tambien en los clusters de carga: el ExternalSecret se materializa EN
          # EL CLUSTER donde hace falta el secreto, asi que cada uno necesita su
          # operador. El ALMACEN, en cambio, es unico y vive en el hub — los
          # spokes lo leen por red, igual que leerian un Key Vault corporativo.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - openshift-external-secrets-operator.v1.2.0   # pin: misma version que el hub
          subscription:
            name: openshift-external-secrets-operator
            namespace: openshift-operators
            channel: stable-v1
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: servicemesh-operator
        spec:
          # Service Mesh (Istio) es dependencia de Connectivity Link: su gateway
          # usa el gatewayClass 'istio' que provee este operador. Va en workload
          # porque Istio corre donde estan las apps.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - servicemeshoperator3.v3.4.1   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: servicemeshoperator3
            namespace: openshift-operators
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: amq-streams-operator
        spec:
          # Streams for Apache Kafka: el operador reconcilia los CR Kafka, KafkaTopic y KafkaUser.
          # Va en workload porque el cluster de mensajeria vive junto a las apps que lo usan.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - amqstreams.v3.2.1-10   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: amq-streams
            namespace: kafka
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhacs-operator
        spec:
          # El mismo operador que el hub, pero aqui solo reconcilia el SecuredCluster:
          # el Central vive una unica vez y es el hub quien lo aloja. El agente
          # (sensor, admission controller y collector) es lo que necesita cada cluster
          # vigilado, y sin operador local no hay quien lo despliegue.
          #
          # La CSV se fija a la MISMA version que el hub a proposito: el sensor y
          # Central negocian una version comun, y dejar que un spoke adelante al hub
          # es el escenario que ACS no soporta.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - rhacs-operator.v4.11.3   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: rhacs-operator
            namespace: rhacs-operator
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
