# Instalacion de los operadores del HUB, por ACM.
#
# POR QUE ACM Y NO ARGO: instalar operadores por Argo CD es fragil — OLM resuelve
# dependencias a su ritmo y Argo pelea con eso (Subscriptions que quedan
# OutOfSync, hooks imperativos). El patron de referencia de Red Hat separa:
#   - ACM instala los operadores (esta Policy)
#   - Argo CD configura los operandos (los CR en <producto>/gitops/)
#
# Cada operador va en un OperatorPolicy: se le dice el paquete y el canal, y ACM
# resuelve la Subscription y VERIFICA que el operador quedo sano (no solo que el
# objeto existe, como haria una Policy de Subscription a secas).
#
# remediationAction: enforce -> ACM instala el operador donde no este.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: install-operators-hub
  namespace: open-cluster-management
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: quay-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - quay-operator.v3.17.4   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: quay-operator
            namespace: quay-enterprise
            channel: stable-3.17
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhacs-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - rhacs-operator.v4.11.3   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: rhacs-operator
            namespace: rhacs-operator
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: openshift-external-secrets-operator
        spec:
          # External Secrets: entrega secretos desde un almacen externo SIN que
          # su contenido pase por Git. El manifiesto que se versiona es el
          # ExternalSecret, que solo dice DE DONDE leer, nunca el valor.
          #
          # Es lo que permite que Argo gobierne tambien los secretos: hasta ahora
          # habia que sembrarlos con Ansible porque no podian versionarse.
          #
          # En el modelo del cliente el almacen es corporativo (Azure Key Vault
          # segun su lineamiento); aqui se usa OpenBao para validar el patron.
          # Cambiar de proveedor es cambiar el ClusterSecretStore, nada mas.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - openshift-external-secrets-operator.v1.2.0   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: openshift-external-secrets-operator
            namespace: openshift-operators
            channel: stable-v1
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhdh-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - rhdh-operator.v1.10.3   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: rhdh
            namespace: rhdh-operator
            channel: fast-1.10
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: openshift-pipelines-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - openshift-pipelines-operator-rh.v1.23.2   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: openshift-pipelines-operator-rh
            namespace: openshift-operators
            channel: latest
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: cert-manager-operator
        spec:
          # El TLSPolicy del gateway del hub emite su certificado con cert-manager:
          # el hub lo necesita igual que los spokes workload.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - cert-manager-operator.v1.20.0   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
            channel: stable-v1
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: mcg-operator
        spec:
          # Multicloud Object Gateway (NooBaa standalone): provee el API
          # ObjectBucketClaim que exige el objectstorage 'managed' del QuayRegistry.
          # NO-PRODUCCION: en este entorno AWS no hay ODF; en produccion el storage
          # de Quay es S3/Azure Blob unmanaged (ver docs/production-outside-the-lab.md).
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - mcg-operator.v4.22.2-rhodf   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: mcg-operator
            namespace: openshift-storage
            channel: stable-4.22
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhcl-operator
        spec:
          # El hub TAMBIEN expone APIs (config-connectivity-link-hub despliega el
          # Gateway compartido y el CR Kuadrant para los servicios del workshop y
          # los previews por PR): sin este operador esa Application nunca sincroniza.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - rhcl-operator.v1.4.2   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: rhcl-operator
            namespace: kuadrant-system
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: servicemesh-operator
        spec:
          # Dependencia de Connectivity Link en el hub: el Gateway compartido usa el
          # gatewayClass 'istio' (Sail/OSSM 3), igual que en los spokes workload.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: Automatic
          versions:
            - servicemeshoperator3.v3.4.1   # pin: solo esta CSV; el upgrade se decide por PR en Git
          subscription:
            name: servicemeshoperator3
            namespace: openshift-operators
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
