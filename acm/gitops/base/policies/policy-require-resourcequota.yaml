# Policy de gobierno: exige que exista una ResourceQuota en el namespace.
#
# Una Policy de ACM es una regla que el hub evalua sobre los clusters que le
# indique el Placement. Esta comprueba (musthave) que el namespace tenga una
# ResourceQuota con topes de CPU y memoria: sin ella, una carga defectuosa podria
# consumir todo el cluster.
#
# remediationAction: enforce -> ACM crea la cuota donde falte. Es seguro aqui:
# los user* ya tienen una cuota MAS restrictiva (workshop-quota) y un LimitRange
# con defaults, asi que anadir platform-quota (mas laxa) no cambia el tope
# efectivo (siempre gana la cuota mas restrictiva) ni rechaza pods sin requests.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: require-resourcequota
  namespace: open-cluster-management
spec:
  disabled: false
  remediationAction: enforce
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: require-resourcequota-config
      spec:
        remediationAction: enforce
        severity: low
        # namespaceSelector: gobierna los namespaces de NEGOCIO (user*), no
        # 'default' (que no protege ninguna app real). Excluye los de sistema.
        # Los *-demo-dev quedan FUERA a proposito: ejecutan builds y generadores
        # de carga sin requests y no tienen LimitRange con defaults; imponerles
        # una cuota de computo rechazaria esos pods al recrearse.
        namespaceSelector:
          include:
            - "user*"
          exclude:
            - "openshift-*"
            - "kube-*"
            - default
        object-templates:
        - complianceType: musthave
          objectDefinition:
            apiVersion: v1
            kind: ResourceQuota
            metadata:
              name: platform-quota
            spec:
              hard:
                requests.cpu: '4'
                requests.memory: 8Gi
                # limits ademas de requests: sin techo de limits, un pod puede
                # pedir poco y consumir mucho en picos.
                limits.cpu: '8'
                limits.memory: 16Gi
