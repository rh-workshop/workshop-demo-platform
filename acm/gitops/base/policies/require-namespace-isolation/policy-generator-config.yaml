# Guardrail de flota: un Kustomize solo alcanza los namespaces que alguien
# enumeró; la Policy alcanza también los que se creen después.
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: require-namespace-isolation
placementBindingDefaults:
  name: require-namespace-isolation-binding
policyDefaults:
  # Namespace del HUB donde vive la Policy, no el destino de los manifiestos.
  namespace: open-cluster-management
  # enforce: si alguien borra una NetworkPolicy en un spoke, ACM la repone.
  remediationAction: enforce
  severity: high
  policyAnnotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  namespaceSelector:
    include:
      - "*-demo-dev"
      - "*-demo-test"
      - "*-demo-prod"
      - "*-demo-contingencia"
      # Previews de PR (efimeros, en el hub): tambien deben nacer aislados.
      - "demo-service-pr-*"
    exclude:
      # Un default-deny sobre los namespaces de sistema deja el cluster sin plano de control.
      - "openshift-*"
      - "kube-*"
      - "default"
      - "open-cluster-management*"
  # Referencia el Placement de los 4 ambientes por nombre: con placementPath el
  # generador lo reemitiria y colisionaria con el que ya declara `resources`.
  # El hub va en placementbinding-hub.yaml (el generador solo emite un binding).
  placement:
    placementName: clusters-workload
policies:
  # Aislamiento de red: alcanza TODOS los namespaces de negocio, sin excepción.
  # Sigue en enforce: los `*-demo-dev/test/prod/contingencia` FIJOS ya los
  # gobierna namespace-governance-workload/ (Argo, wave -1, antes del
  # despliegue), pero esta Policy tambien cubre `demo-service-pr-*` -- namespaces
  # de preview efimeros que nacen y mueren con cada PR y NUNCA se pueden
  # enumerar en un Kustomize. Retirarla dejaria esos previews sin aislamiento.
  - name: require-namespace-isolation
    manifests:
      - path: policies/require-namespace-isolation/manifests/networkpolicy-allow-same-namespace.yaml
      - path: policies/require-namespace-isolation/manifests/networkpolicy-allow-from-platform-gateway.yaml
      - path: policies/require-namespace-isolation/manifests/networkpolicy-allow-from-monitoring.yaml
      - path: policies/require-namespace-isolation/manifests/networkpolicy-allow-from-openshift-ingress.yaml
  # require-namespace-rbac RETIRADA (2026-09-04): namespace-governance-workload/
  # ya gobierna el RBAC de los namespaces de negocio FIJOS por Argo, con Roles
  # propios acotados a lo que argocd-push puede otorgar (nunca ClusterRole/edit
  # completo -- ver namespace-governance-workload/gitops/base/profiles/
  # app-namespace/role-app-developers.yaml). Dejar esta Policy en enforce
  # competia con Argo: reponia `app-developers-edit` -> ClusterRole/edit junto
  # al RoleBinding acotado nuevo, dejando a app-developers con `edit` completo
  # en la práctica pese al Role recortado. Verificado en vivo: NonCompliant en
  # los 4 spokes tras el cambio, y el RoleBinding viejo seguía presente.
  #
  # Los previews de PR (`demo-service-pr-*`) NO entran aquí -- namespace-
  # governance-workload solo cubre namespaces fijos enumerables. Si algún día
  # necesitan RBAC además de aislamiento de red, es una Policy nueva y acotada
  # a ese patrón, no revivir esta.
