# Aislamiento del namespace (primera NetworkPolicy): en cuanto existe una
# policy que selecciona los pods, todo lo no permitido queda denegado. Esta
# permite el tráfico DENTRO del namespace (fortio -> servicios, sidecars,
# pods de pipeline).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
