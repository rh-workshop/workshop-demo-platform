# Extiende al hub el aislamiento de red, por los previews de PR y canary-demo-dev.
# Va suelto porque el generador emite un unico binding (el de clusters-workload).
#
# La policy de RBAC NO se enlaza aqui: el unico namespace de negocio permanente
# del hub es workshop-demo-dev, que esta excluido de ella a proposito, asi que
# quedaria siempre NonCompliant por no encontrar ningun namespace destino.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: require-namespace-isolation-hub-binding
  namespace: open-cluster-management
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: clusters-hub
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: require-namespace-isolation
