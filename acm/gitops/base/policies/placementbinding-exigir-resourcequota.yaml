# Une la Policy con el Placement: "aplica exigir-resourcequota a los clusters que
# selecciona clusters-produccion". Sin este binding la Policy no evalua nada.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: exigir-resourcequota-binding
  namespace: open-cluster-management
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: clusters-produccion
subjects:
- apiGroup: policy.open-cluster-management.io
  kind: Policy
  name: exigir-resourcequota
