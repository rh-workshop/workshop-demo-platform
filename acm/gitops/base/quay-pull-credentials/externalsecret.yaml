# Credenciales de descarga del registro, una por ambiente.
#
# La Policy require-registry-pull-secret las lee del hub por nombre
# (`quay-pull-credentials-<environment>`, del label del ManagedCluster) y las
# replica a los namespaces de negocio: si faltan, queda NonCompliant y ningun pod
# del spoke descarga imagenes.
#
# Una por ambiente porque cada uno tiene su propia organizacion en el registro con
# su robot `puller`; repartir una sola dejaba a test/prod/contingencia con el robot
# de dev y sus pods en "unauthorized". El hub usa `company-tooling`.
#
# Ningun valor vive aqui: solo la ruta en el almacen.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: quay-pull-credentials-dev
  namespace: open-cluster-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: quay-pull-credentials-dev
    creationPolicy: Owner
    # El tipo importa: la Policy lo copia como dockerconfigjson y el kubelet solo
    # acepta ese tipo en `imagePullSecrets`.
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/quay/pull-dev
        property: .dockerconfigjson
---
