# Credenciales de descarga del registro, UNA POR AMBIENTE.
#
# QUIEN CONSUME ESTO. La Policy `require-registry-pull-secret` las lee desde el
# hub con `fromSecret` y las replica a los namespaces de negocio de cada cluster.
# La plantilla resuelve el nombre como `quay-pull-credentials-<environment>`
# tomando el label `environment` del ManagedCluster, asi que estos cinco Secret
# TIENEN que existir en `open-cluster-management` y llamarse exactamente asi, o
# la Policy queda NonCompliant con "secrets ... not found" y ningun pod del
# spoke logra descargar imagenes.
#
# POR QUE UNA POR AMBIENTE Y NO UNA SOLA. Cada ambiente tiene su PROPIA
# organizacion en el registro (`company-dev`, `company-test`, ...) con su robot
# `puller`. Repartir una unica credencial dejaba a test/prod/contingencia
# autenticandose con el robot de dev y sus pods en "unauthorized".
#
# EL HUB USA `company-tooling`. Su label `environment` es `hub`, y ahi corren las
# cargas transversales, no las de un ambiente de negocio.
#
# NINGUN VALOR VIVE AQUI: solo la RUTA en el almacen. El token del robot se
# deposita en OpenBao (`platform/quay/pull-<ambiente>`) y es Argo, via ESO, quien
# gobierna la entrega. Si alguien borra el Secret, ESO lo repone; si se rota el
# robot en el registro, basta actualizar el almacen y se propaga solo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: quay-pull-credentials-dev
  namespace: open-cluster-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: quay-pull-credentials-dev
    creationPolicy: Owner
    # El tipo importa: la Policy lo copia como dockerconfigjson y el kubelet solo
    # acepta ese tipo en `imagePullSecrets`.
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: platform/quay/pull-dev
        property: .dockerconfigjson
---
