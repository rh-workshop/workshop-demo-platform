# Selecciona los clusters de carga (cualquier environment de workload), no el hub.
# OJO: los predicados de un Placement se combinan con O (union), no con Y.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  annotations:
    # El CRD lo trae el propio MCH de este sync: sin esto, el dry-run del arranque en frio invalida el sync entero de la app acm.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: clusters-workload
  namespace: open-cluster-management
spec:
  # El clusterSet debe estar vinculado a este namespace por un ManagedClusterSetBinding
  # (ver ../managedclustersetbinding.yaml) o el Placement no selecciona nada.
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: environment
              operator: In
              values: [dev, test, prod, contingencia]
