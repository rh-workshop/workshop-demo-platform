# A que clusters se aplica la Policy.
#
# El Placement selecciona los clusters gestionados que tengan la etiqueta
# environment=prod. OJO: los predicados de un Placement se combinan con O (union),
# no con Y; con un solo predicado no hay ambiguedad, pero es la trampa clasica al
# anadir mas.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: clusters-prod
  namespace: open-cluster-management
spec:
  # El clusterSet debe estar vinculado a este namespace por un ManagedClusterSetBinding
  # (ver operators/managedclustersetbinding.yaml). Los 3 clusters estan en 'default';
  # con 'global' sin binding en este namespace, el Placement seleccionaria 0 clusters.
  clusterSets:
  - default
  predicates:
  # En este entorno los namespaces de negocio (user*) viven en el HUB, no en el
  # cluster con environment=prod: evaluar la Policy alli dejaba un template-error
  # perpetuo ("no namespace specified") porque el selector no casaba ninguno.
  # En un despliegue real, con las cargas en el cluster de produccion, el
  # predicado correcto vuelve a ser environment=prod.
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          local-cluster: "true"
