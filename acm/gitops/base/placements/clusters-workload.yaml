# Selecciona los clusters de carga (environment dev o prod), no el hub.
# OJO: los predicados de un Placement se combinan con O (union), no con Y.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: clusters-workload
  namespace: open-cluster-management
spec:
  # El clusterSet debe estar vinculado a este namespace por un ManagedClusterSetBinding
  # (ver ../managedclustersetbinding.yaml) o el Placement no selecciona nada.
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: environment
              operator: In
              values: [dev, prod]
