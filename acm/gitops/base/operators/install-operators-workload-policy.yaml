# Instalacion de los operadores WORKLOAD, por ACM.
#
# Estos van a los clusters de carga (dev y prod), no al hub. Mismo patron:
# ACM instala el operador (OperatorPolicy), Argo configura el operando.
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: install-operators-workload
  namespace: open-cluster-management
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhbk-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: None
          subscription:
            name: rhbk-operator
            namespace: keycloak
            channel: stable-v26.4
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: metallb-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: None
          subscription:
            name: metallb-operator
            namespace: metallb-system
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: cert-manager-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: None
          subscription:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
            channel: stable-v1
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: rhcl-operator
        spec:
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: None
          subscription:
            name: rhcl-operator
            namespace: kuadrant-system
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1beta1
        kind: OperatorPolicy
        metadata:
          name: servicemesh-operator
        spec:
          # Service Mesh (Istio) es dependencia de Connectivity Link: su gateway
          # usa el gatewayClass 'istio' que provee este operador. Va en workload
          # porque Istio corre donde estan las apps.
          remediationAction: enforce
          complianceType: musthave
          upgradeApproval: None
          subscription:
            name: servicemeshoperator3
            namespace: openshift-operators
            channel: stable
            source: redhat-operators
            sourceNamespace: openshift-marketplace
