# Entrega la conexion al object storage desde el almacen de secretos.
#
# ESTO ES LO QUE SE VERSIONA EN GIT, y no contiene ningun valor: solo dice DE
# DONDE leer (`platform/observability` en el almacen) y COMO llamar al Secret que
# se materializa (`thanos-object-storage`, el que referencia el
# MultiClusterObservability).
#
# QUE CAMBIA RESPECTO A ANTES. La conexion la sembraba acm/ansible/observability.yml
# escribiendo el Secret directamente en el cluster. Ahora el playbook deposita el
# valor en el almacen y ES ARGO quien gobierna la entrega: si alguien borra el
# Secret, ESO lo repone; si el valor cambia en el almacen, se propaga solo.
#
# PORTABILIDAD. Este fichero NO cambia al adoptar el material en otro entorno:
# lo unico que se toca es el ClusterSecretStore `platform-vault`, que aqui apunta
# a OpenBao y en el cliente apuntara a su Key Vault corporativo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: thanos-object-storage
  namespace: open-cluster-management-observability
spec:
  # Cada cuanto se relee del almacen. Una hora es suficiente para una credencial
  # de object storage; bajarlo solo anade carga sobre el almacen.
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    # El nombre debe coincidir EXACTAMENTE con storageConfig.metricObjectStorage
    # del MultiClusterObservability, o Thanos no encuentra su configuracion.
    name: thanos-object-storage
    # El Secret lo crea y lo mantiene ESO: si desaparece, lo repone.
    creationPolicy: Owner
  data:
    - secretKey: thanos.yaml
      remoteRef:
        key: platform/observability
        property: thanos.yaml
