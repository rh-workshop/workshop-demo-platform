apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # El hub de ACM y los namespaces destino de los operadores.
  - namespaces.yaml
  - multiclusterhub.yaml
  - managedclustersetbinding.yaml
  # Los Placement, centralizados: cada uno lo comparten varias políticas.
  - placements/clusters-hub.yaml
  - placements/clusters-workload.yaml
  # Una carpeta por política, con el binding que la une a su Placement.
  - policies/install-operators/hub-policy.yaml
  - policies/install-operators/hub-placementbinding.yaml
  - policies/install-operators/workload-policy.yaml
  - policies/install-operators/workload-placementbinding.yaml
  - policies/require-resourcequota/policy.yaml
  - policies/require-resourcequota/placementbinding.yaml
  - policies/require-resourcequota/workload-placementbinding.yaml
  # Pareja inseparable de la anterior: la cuota sin defaults bloquea despliegues.
  - policies/require-limitrange/policy.yaml
  - policies/require-limitrange/placementbinding.yaml
  - policies/require-limitrange/workload-placementbinding.yaml
  # Replica la credencial del registro a los namespaces de negocio de cada
  # cluster: sin ella los pods no descargan de Quay desde un spoke.
  - policies/require-registry-pull-secret/policy.yaml
  - policies/require-registry-pull-secret/placementbinding.yaml
  - policies/require-registry-pull-secret/workload-placementbinding.yaml
  # Observabilidad multi-cluster: metricas de todos los clusters gestionados,
  # centralizadas en el hub. Tambien es de lo que se alimenta el analisis del
  # canary de Argo Rollouts.
  - observability
