apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # El hub de ACM y los namespaces destino de los operadores.
  - namespaces.yaml
  - multiclusterhub.yaml
  - managedclustersetbinding.yaml
  # Los Placement, centralizados: cada uno lo comparten varias políticas.
  - placements/placement-clusters-hub.yaml
  - placements/placement-clusters-workload.yaml
  # Una carpeta por política, con el binding que la une a su Placement.
  - policies/install-operators/policy-hub.yaml
  - policies/install-operators/placementbinding-hub.yaml
  - policies/install-operators/policy-workload.yaml
  - policies/install-operators/placementbinding-workload.yaml
  - policies/require-resourcequota/policy.yaml
  - policies/require-resourcequota/placementbinding.yaml
  - policies/require-resourcequota/placementbinding-workload.yaml
  # Pareja inseparable de la anterior: la cuota sin defaults bloquea despliegues.
  - policies/require-limitrange/policy.yaml
  - policies/require-limitrange/placementbinding.yaml
  - policies/require-limitrange/placementbinding-workload.yaml
  # Las credenciales del registro que la politica de abajo reparte: una por
  # ambiente, entregadas por ESO desde el almacen. Van ANTES que la politica
  # porque son su entrada: sin ellas queda NonCompliant por "secrets not found".
  - quay-pull-credentials
  # Replica la credencial del registro a los namespaces de negocio de cada
  # cluster: sin ella los pods no descargan de Quay desde un spoke.
  - policies/require-registry-pull-secret/policy.yaml
  - policies/require-registry-pull-secret/placementbinding.yaml
  - policies/require-registry-pull-secret/placementbinding-workload.yaml
  # Replica el token del almacen de secretos a los clusters de carga: sin el,
  # su ClusterSecretStore no puede autenticarse contra el almacen del hub.
  - policies/require-vault-token/policy.yaml
  - policies/require-vault-token/placementbinding-workload.yaml
  # Aislamiento de red y RBAC de los namespaces de negocio. El binding al hub va
  # suelto; la Policy la genera el Policy Generator (ver generators: abajo).
  - policies/require-namespace-isolation/placementbinding-hub.yaml
  # Certificados del agente de ACS: sin ellos ningun SecuredCluster arranca.
  # Retira self-provisioner a los autenticados: un Project creado a mano nace sin
  # cuota, sin aislamiento y sin RBAC, fuera del gobierno.
  - policies/require-no-self-provisioner/policy.yaml
  - policies/require-no-self-provisioner/placementbinding-hub.yaml
  - policies/require-no-self-provisioner/placementbinding-workload.yaml
  # Replicas incompletas: un StatefulSet a 1/2 no se cae, pierde la alta
  # disponibilidad en silencio y se confunde con un despliegue en curso.
  - policies/require-workloads-fully-available/policy.yaml
  - policies/require-workloads-fully-available/placementbinding-workload.yaml
  - policies/require-acs-init-bundle/policy.yaml
  - policies/require-acs-init-bundle/placementbinding.yaml
  # Observabilidad multi-cluster: metricas de todos los clusters gestionados,
  # centralizadas en el hub.
  - observability

# Plugin del Policy Generator: envuelve manifiestos Kubernetes normales en
# Policies de ACM. Requiere --enable-alpha-plugins (ver bootstrap/manifests/argocd.yaml).
generators:
  - policies/require-namespace-isolation/policy-generator-config.yaml
