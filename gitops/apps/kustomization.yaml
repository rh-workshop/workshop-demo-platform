apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# El AppProject workshop-multicluster NO va aquí: lo crea el bootstrap
# (bootstrap/manifests/), porque la barandilla no se instala a sí misma.
resources:
  # Primero el gobierno de namespaces (sync-wave -1): inventario, cuotas,
  # RBAC por grupo y aislamiento de red, antes de que nada despliegue dentro.
  - hub/namespace-governance-application.yaml
  - hub/acm-application.yaml
  - hub/quay-application.yaml
  - hub/acs-application.yaml
  - hub/pipelines-application.yaml
  - hub/developer-hub-application.yaml
  # Istio (Sail) en el hub: provee el gatewayClass 'istio' del que depende connectivity-link.
  - hub/service-mesh-hub-application.yaml
  # ClusterIssuers en el hub: el TLSPolicy del gateway compartido depende de ellos.
  - hub/cert-manager-hub-application.yaml
  - hub/connectivity-link-application.yaml
  # Almacen de secretos: va antes que los productos que leen de el.
  - hub/openbao-application.yaml
  # Argo Rollouts NO va aquí: es un componente de CARGA, no de gestión. Su
  # controlador tiene que estar en el mismo cluster que los pods que sustituye,
  # así que lo despliegan los ApplicationSets workload-<ambiente> (dev, test,
  # prod y contingencia). El hub aloja el plano de control —ACM, Quay, ACS,
  # Argo CD— y no ejecuta despliegues progresivos de negocio.
  # Gobierno del workshop de aplicaciones: la única Application que no genera
  # ningún ApplicationSet (los servicios sí — ver gitops/appsets/workshop-*).
  # Las políticas del demo-service viven en apps/demo-service/overlays/dev (las
  # despliega el ApplicationSet de servicios) y el permiso de descarga de imagen
  # va DENTRO de cada servicio (apps/<servicio>/base): ninguno amerita Application propia.
  - hub/workshop-pipelines-application.yaml
  - ../clusters
  - ../appsets
