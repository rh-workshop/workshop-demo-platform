apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Los AppProject NO van aquí: los crea el bootstrap
# (bootstrap/manifests/), porque la barandilla no se instala a sí misma.
resources:
  # ACM y el gobierno de namespaces de PLATAFORMA (Quay, ACS, Pipelines...) NO
  # estan aqui: los sincroniza la INSTANCIA DE GOBIERNO (gitops/apps-governance/),
  # que es la unica con permiso para escribir Policies, Groups y GitOpsCluster.
  # Esta app-of-apps despliega productos; no acuña privilegio.
  #
  # EXCEPCION: el gobierno de namespaces de NEGOCIO (workshop-demo-dev y
  # hermanos) SI vive aqui, en namespace-governance-workload-hub. Un RoleBinding
  # a los ClusterRole estandar edit/view/admin no acuña privilegio nuevo, y
  # necesita compartir instancia con las Applications de negocio que dependen
  # de el para que el sync-wave garantice el orden entre ambas.
  - hub/application-namespace-governance-workload-hub.yaml
  - hub/application-quay.yaml
  - hub/application-acs.yaml
  - hub/application-pipelines.yaml
  - hub/application-developer-hub.yaml
  # Istio (Sail) en el hub: provee el gatewayClass 'istio' del que depende connectivity-link.
  - hub/application-service-mesh-hub.yaml
  # ClusterIssuers en el hub: el TLSPolicy del gateway compartido depende de ellos.
  - hub/application-cert-manager-hub.yaml
  - hub/application-connectivity-link.yaml
  # Almacen de secretos: va antes que los productos que leen de el.
  - hub/application-openbao.yaml
  # El puente con ESO: va en cada cluster, aqui el del hub.
  - hub/application-openbao-store.yaml
  # Gobierno del workshop de aplicaciones: la única Application que no genera
  # ningún ApplicationSet (los servicios sí — ver gitops/appsets/workshop-*).
  # Las políticas del demo-service viven en apps/demo-service/overlays/dev (las
  # despliega el ApplicationSet de servicios) y el permiso de descarga de imagen
  # va DENTRO de cada servicio (apps/<servicio>/base): ninguno amerita Application propia.
  - hub/application-workshop-pipelines.yaml
  # `../clusters` NO esta aqui: declara GitOpsCluster, Placement y
  # ManagedClusterSetBinding, y el controller de esta instancia solo tiene
  # lectura sobre esos kinds desde que la escritura se movio a gobierno. Dejarlo
  # hacia que el sync fallara con `forbidden` en un cluster nuevo -- en el actual
  # sobrevivia solo porque los objetos ya existian. Lo sincroniza
  # gitops/apps-governance/.
  - ../appsets
