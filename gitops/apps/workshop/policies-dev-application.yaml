# Onda 3 — políticas de exposición del servicio.
# Van después de la aplicación porque se declaran SOBRE su HTTPRoute: si la ruta
# no existe todavía, la política no tiene destino al que adjuntarse.
#
# Vivía en workshop-demo-app-config/bootstrap/: se movió aquí porque crear
# Applications es gobierno de plataforma; el CONTENIDO de las políticas sigue
# siendo del equipo de aplicaciones (policies/ en su repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies-dev
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: application
    workshop.redhat.com/component: policies
    workshop.redhat.com/environment: dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
    targetRevision: main
    path: policies/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-demo-dev
  # El dominio real del cluster se fija en vivo (día 0) y Argo lo respeta: el repo queda genérico.
  ignoreDifferences:
    - group: kuadrant.io
      kind: AuthPolicy
      jqPathExpressions:
        - .spec.rules.authentication[]?.jwt.issuerUrl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
