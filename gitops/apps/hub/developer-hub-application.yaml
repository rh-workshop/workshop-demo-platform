# Application de Developer Hub (solo hub): el portal centralizado.
#
# Es hub-only por diseno: el hub de ACM es el cluster que gestiona, no el que
# corre cargas. Una sola instancia ve las apps de todos los spokes via sus
# plugins. No se hace fan-out con ApplicationSet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-developer-hub
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: developer-hub
    workshop.redhat.com/environment: hub
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: developer-hub/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: developer-hub
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
