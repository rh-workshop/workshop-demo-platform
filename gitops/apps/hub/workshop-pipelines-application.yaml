# Onda 2 — definiciones de construcción (Pipeline e identidad que lo ejecuta).
# Argo CD gobierna la DEFINICIÓN del pipeline; las ejecuciones (PipelineRun) las
# dispara quien construye, y no las gestiona Argo.
#
# El permiso de descarga de imagen NO vive aquí: cada servicio lleva su propio
# RoleBinding en apps/<servicio>/base del repo de aplicaciones, porque el
# permiso nace y muere con el servicio que lo necesita.
#
# Los manifiestos vivían en workshop-demo-app-config/platform/pipelines/: se
# movieron a este repo (workshop-pipelines/gitops/) porque el pipeline monta el
# token con permiso de escritura sobre el repo de configuración; quien edita el
# pipeline controla ese token, y eso es gobierno de plataforma. Por lo mismo la
# Application corre en el AppProject workshop-multicluster (plataforma), no en
# workshop-platform (aplicaciones).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-workshop-pipelines
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: pipelines
    workshop.redhat.com/environment: dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: workshop-pipelines/gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-demo-dev
  syncPolicy:
    retry:
      # Arranque en frio: el CRD del producto lo instala ACM por su cuenta y puede
      # tardar minutos. Sin backoff, Argo agota los 5 intentos rapidos y se rinde.
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
