# Application de quay (solo hub): el registro de imagenes, unico y central.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-quay
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: quay
    workshop.redhat.com/environment: hub
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: quay/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: quay-enterprise
  syncPolicy:
    retry:
      # Arranque en frio: el CRD del producto lo instala ACM por su cuenta y puede
      # tardar minutos. Sin backoff, Argo agota los 5 intentos rapidos y se rinde.
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
