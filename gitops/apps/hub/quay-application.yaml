# Application de quay (solo hub): el registro de imagenes, unico y central.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-quay
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: quay
    workshop.redhat.com/environment: hub
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: quay/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: quay-enterprise
  # DRIFT QUE INTRODUCE EL OPERADOR DE NOOBAA. Al reconciliar el CR lo completa
  # con secciones vacias que no existen en Git (autoscaler, bucketLogging,
  # cleanupPolicy, loadBalancerSourceSubnets, security.kms). El recurso esta
  # Ready y el sync termina bien, pero la Application queda OutOfSync a
  # perpetuidad y con selfHeal Argo reescribe el CR una y otra vez sin efecto.
  #
  # Se ignoran SOLO esos campos, por nombre: cualquier cambio real del CR
  # (dbType, la clase de almacenamiento, el backingstore) se sigue viendo.
  ignoreDifferences:
    - group: noobaa.io
      kind: NooBaa
      jqPathExpressions:
        - .spec.autoscaler
        - .spec.bucketLogging
        - .spec.bucketNotifications
        - .spec.cleanupPolicy
        - .spec.loadBalancerSourceSubnets
        - .spec.security
  syncPolicy:
    retry:
      # Arranque en frio: el CRD del producto lo instala ACM por su cuenta y puede
      # tardar minutos. Sin backoff, Argo agota los 5 intentos rapidos y se rinde.
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
