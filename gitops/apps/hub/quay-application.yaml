# Application de quay (solo hub): el registro de imagenes, unico y central.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quay
  namespace: openshift-gitops
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform.git
    targetRevision: main
    path: quay/gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: quay-enterprise
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
