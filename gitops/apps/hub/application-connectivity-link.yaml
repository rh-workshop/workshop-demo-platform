# Application de connectivity-link en el HUB: el Gateway compartido, el CR de
# Kuadrant y las políticas transversales (TLSPolicy + AuthPolicy por defecto).
#
# Los servicios de demostración del workshop corren en el propio hub, así que el
# hub también necesita el gateway. Antes esta pieza estaba DUPLICADA en el repo
# de aplicaciones (workshop-demo-app-config/platform/); la fuente de verdad es
# ESTE repositorio, y el repo de apps ya no declara plataforma.
#
# El hostname del Gateway y el issuer del AuthPolicy son valores de día 0: se
# fijan en vivo con el dominio real del cluster y Argo los respeta vía
# ignoreDifferences. La base queda genérica con marcadores.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-connectivity-link-hub
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: connectivity-link
    workshop.redhat.com/environment: hub
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: connectivity-link/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: kuadrant-system
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - .spec.listeners[].hostname
    - group: kuadrant.io
      kind: AuthPolicy
      jqPathExpressions:
        - .spec.defaults.rules.authentication[]?.jwt.issuerUrl
    # El host de la Route del gateway compartido también es valor de día 0:
    # se fija en vivo con el dominio real y Argo lo respeta.
    - group: route.openshift.io
      kind: Route
      jsonPointers:
        - /spec/host
  syncPolicy:
    retry:
      # Arranque en frio: el CRD del producto lo instala ACM por su cuenta y puede
      # tardar minutos. Sin backoff, Argo agota los 5 intentos rapidos y se rinde.
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
