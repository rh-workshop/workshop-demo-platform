# Application de acm (solo hub): el hub de gobierno y las politicas.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-acm
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: acm
    workshop.redhat.com/environment: hub
  annotations:
    # Wave 0: ACM instala el MultiClusterHub y con él los CRDs (Placement, GitOpsCluster) que la wave 3 necesita.
    argocd.argoproj.io/sync-wave: "0"
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: acm/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
