# Application de acs (solo hub): Central + SecuredCluster de seguridad.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acs
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: acs/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: stackrox
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
