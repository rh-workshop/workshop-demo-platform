# Application de monitorizacion: la CONFIGURACION del stack que OpenShift ya
# instala de serie, no el stack en si.
#
# prune: false a proposito. El ConfigMap lo consume el Cluster Monitoring
# Operator, que es quien gobierna el namespace openshift-monitoring; si Argo
# borrara recursos ahi al dejar de verlos en Git, tumbaria la monitorizacion del
# cluster. Argo lo mantiene al dia, pero nunca limpia detras del operador.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: monitoring/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
