# Application de Argo Rollouts (solo hub): el controlador de progressive delivery.
#
# El operador OpenShift GitOps ya instalado gestiona TAMBIÉN Argo Rollouts: aquí
# no se instala operador alguno, solo se declara su CR RolloutManager. Lo consume
# el canary AUTOMÁTICO del workshop (apps/canary-service del repo de
# aplicaciones): un Rollout con AnalysisTemplate que promociona o revierte solo.
# Va al hub porque es donde despliegan los servicios del workshop.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-rollouts
  labels:
    # Distingue de un vistazo qué es infraestructura y qué es aplicación.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: rollouts
    workshop.redhat.com/environment: hub
  namespace: openshift-gitops
spec:
  project: workshop-multicluster
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: rollouts/gitops/overlays/hub
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    retry:
      # Arranque en frio: el CRD RolloutManager aparece con el operador GitOps y puede
      # tardar. Sin backoff, Argo agota los 5 intentos rapidos y se rinde.
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
