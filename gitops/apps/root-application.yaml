# La Application raíz: la aplica el BOOTSTRAP del cluster
# (bootstrap/ansible/bootstrap.yml), después de crear los AppProjects y el CR
# ArgoCD.
#
# Despliega, en este orden lógico, todo lo demás:
#   - gitops/clusters  : la cadena ACM+Argo (binding, placements, GitOpsCluster)
#   - gitops/appsets   : el ApplicationSet que hace fan-out de los productos
#                        workload a los spokes por rol
#   - gitops/apps/hub  : las Applications de los productos que solo viven en el
#                        hub (acm, quay, acs)
#
# A partir de este apply, Argo se encarga del resto. Nada del plano de control
# se auto-gestiona: el CR ArgoCD y TODOS los AppProjects (incluido el
# gitops-control en el que corre este root) los crea el bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma-root
  namespace: openshift-gitops
spec:
  project: gitops-control
  source:
    repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
