# La UNICA pieza que se aplica a mano (oc apply -f).
#
# Despliega, en este orden logico, todo lo demas:
#   - gitops/clusters  : la cadena ACM+Argo (binding, placements, GitOpsCluster)
#   - gitops/appsets   : el ApplicationSet que hace fan-out de los productos
#                        workload a los spokes por rol
#   - gitops/apps/hub  : las Applications de los productos que solo viven en el
#                        hub (acm, quay, acs)
#
# A partir de este apply, Argo se encarga del resto. El CR ArgoCD y este
# AppProject NO se auto-gestionan: el AppProject va incluido aqui, pero el CR
# ArgoCD se aplica en el bootstrap del cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plataforma-root
  namespace: openshift-gitops
spec:
  project: workshop-platform
  source:
    repoURL: https://github.com/rh-workshop/workshop-platform.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
