# Permisos con los que Argo CD escribe en un cluster de carga.
#
# El companero del ManagedServiceAccount: aquel emite la identidad, este declara
# que puede hacer. Sin el, ACM entrega el token del addon `application-manager`
# (ClusterRole ['*']/['*']/['*']) y Argo escribe en produccion como
# cluster-admin, con el endurecimiento del hub sin efecto en los spokes.
#
# LA LECTURA VA ENUMERADA, no `['*']/['*']`. Argo necesita leer para calcular el
# diff, pero un comodin de lectura incluye `secrets`, y combinado con la
# escritura de `roles`/`rolebindings` de aqui abajo permite fabricar un Role con
# `secrets: get` y bindearselo: lectura efectiva de todos los secretos del
# cluster desde un commit. Enumerar cuesta mantener una linea al anadir un
# producto y es lo que impide esa ruta.
#
# Al anadir un componente a la plataforma hay que anadir su grupo de API aqui, o
# la Application queda OutOfSync con "forbidden: cannot create/patch".
#
# PERFIL NONPROD (dev, test). Conserva la escritura sobre ClusterSecretStore y
# Console: en no productivos se itera sobre la config del vault y del plugin de
# consola, y frenarlo ahi solo mueve el trabajo fuera de Git.
apiVersion: rbac.open-cluster-management.io/v1alpha1
kind: ClusterPermission
metadata:
  name: argocd-push
  namespace: CHANGE_ME_CLUSTER_NAMESPACE
spec:
  clusterRole:
    rules:
    - apiGroups:
      - ''
      resources:
      - namespaces
      - services
      - configmaps
      - serviceaccounts
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
      - pods
      - events
      - endpoints
      - nodes
      verbs:
      - get
      - list
      - watch
    - apiGroups:
      - apps
      resources:
      - deployments
      - statefulsets
      - replicasets
      - daemonsets
      verbs:
      - get
      - list
      - watch
    - apiGroups:
