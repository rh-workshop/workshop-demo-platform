# Permisos con los que Argo CD escribe en un cluster de carga.
#
# El companero del ManagedServiceAccount: aquel emite la identidad, este declara
# que puede hacer. Sin el, ACM entrega el token del addon `application-manager`
# (ClusterRole ['*']/['*']/['*']) y Argo escribe en produccion como
# cluster-admin, con el endurecimiento del hub sin efecto en los spokes.
#
# LA LECTURA VA ENUMERADA, no `['*']/['*']`. Argo necesita leer para calcular el
# diff, pero un comodin de lectura incluye `secrets`, y combinado con la
# escritura de `roles`/`rolebindings` de aqui abajo permite fabricar un Role con
# `secrets: get` y bindearselo: lectura efectiva de todos los secretos del
# cluster desde un commit. Enumerar cuesta mantener una linea al anadir un
# producto y es lo que impide esa ruta.
#
# Al anadir un componente a la plataforma hay que anadir su grupo de API aqui, o
# la Application queda OutOfSync con "forbidden: cannot create/patch".
#
# PERFIL NONPROD (dev, test). Conserva la escritura sobre ClusterSecretStore y
# Console: en no productivos se itera sobre la config del vault y del plugin de
# consola, y frenarlo ahi solo mueve el trabajo fuera de Git.
  # LECTURA AMPLIA (`['*']/['*']: get,list,watch`). Es un REQUISITO de Argo, no
  # un descuido: el controlador construye un cache del cluster entero para
  # calcular el diff, y necesita listar TODO -- incluidos `secrets` y los CRDs
  # que instale cualquier operador. Se intento acotarla y el resultado fue el
  # cache sin construir y todas las Applications del spoke en Unknown:
  #
  #   - Enumerar grupos de API falla en cuanto un operador anade un CRD nuevo
  #     (paso con extensions.kuadrant.io y con core.strimzi.io).
  #   - Excluir `secrets` rompe el arranque del cache: Argo los lista para
  #     diffear los Secret que el mismo gestiona.
  #
  # QUE SI ACOTA EL RIESGO, y es donde hay que mirar: la ESCRITURA de abajo va
  # enumerada recurso por recurso, y `secrets` NO esta entre lo que puede
  # escribir. Argo puede leer un secreto para compararlo con Git, no crearlo ni
  # modificarlo. El riesgo residual -- fabricar un Role con `secrets: get` via la
  # escritura de `roles`/`rolebindings` -- no amplia nada: ya tiene esa lectura.
  # Cerrarlo de verdad exige quitarle `roles`/`rolebindings`, que rompe el
  # despliegue del RBAC por namespace que este mismo repo gobierna.
apiVersion: rbac.open-cluster-management.io/v1alpha1
kind: ClusterPermission
metadata:
  name: argocd-push
  namespace: CHANGE_ME_CLUSTER_NAMESPACE
spec:
  clusterRole:
    rules:
    - apiGroups:
      - '*'
      resources:
      - '*'
      verbs:
      - get
      - list
      - watch
    - apiGroups:
      - ''
      resources:
      - namespaces
      verbs:
      - create
      - update
      - patch
    - apiGroups:
      - ''
      resources:
      - services
      - configmaps
      - serviceaccounts
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - apps
      resources:
      - deployments
      - statefulsets
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - networking.k8s.io
      resources:
      - networkpolicies
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - policy
      resources:
      - poddisruptionbudgets
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - rbac.authorization.k8s.io
      resources:
      - roles
      - rolebindings
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - route.openshift.io
      resources:
      - routes
      - routes/custom-host
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - external-secrets.io
      resources:
      - externalsecrets
      - clustersecretstores
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - operator.openshift.io
      resources:
      - externalsecretsconfigs
      - consoles
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - cert-manager.io
      resources:
      - certificates
      - clusterissuers
      - issuers
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - gateway.networking.k8s.io
      resources:
      - gateways
      - httproutes
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - kuadrant.io
      resources:
      - kuadrants
      - authpolicies
      - ratelimitpolicies
      - tlspolicies
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - operator.authorino.kuadrant.io
      resources:
      - authorinos
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - limitador.kuadrant.io
      resources:
      - limitadors
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - k8s.keycloak.org
      resources:
      - keycloaks
      - keycloakrealmimports
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - kafka.strimzi.io
      resources:
      - kafkas
      - kafkanodepools
      - kafkatopics
      - kafkausers
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - sailoperator.io
      resources:
      - istios
      - istiocnis
      - istiorevisiontags
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - security.istio.io
      resources:
      - peerauthentications
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - networking.istio.io
      resources:
      - destinationrules
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - platform.stackrox.io
      resources:
      - securedclusters
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - config.stackrox.io
      resources:
      - securitypolicies
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - monitoring.coreos.com
      resources:
      - podmonitors
      - servicemonitors
      verbs:
      - create
      - update
      - patch
      - delete
    - apiGroups:
      - metallb.io
      resources:
      - metallbs
      - ipaddresspools
      - l2advertisements
      verbs:
      - create
      - update
      - patch
      - delete
  clusterRoleBinding:
    subject:
      apiGroup: authentication.open-cluster-management.io
      kind: ManagedServiceAccount
      name: argocd-push
