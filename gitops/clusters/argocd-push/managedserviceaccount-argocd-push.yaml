# Identidad con la que Argo CD escribe en cada cluster de carga.
#
# Sin esto, el GitOpsCluster usa el token del addon `application-manager`, cuyo
# ClusterRole es apiGroups/resources/verbs: ['*'] -- Argo escribe en produccion
# como cluster-admin, y el endurecimiento del hub no aplica en los spokes.
#
# ACM emite y ROTA el token (rotationValidity), y lo proyecta al hub como Secret
# en el namespace del cluster. Los permisos los define el ClusterPermission
# companero, con los recursos enumerados.
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: argocd-push
  namespace: CHANGE_ME_CLUSTER_NAMESPACE
spec:
  rotation:
    enabled: true
    validity: 720h
