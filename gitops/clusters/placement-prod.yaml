# Selecciona los clusters de rol producción (environment=prod).
# Produce una PlacementDecision que el GitOpsCluster convierte en Secret de cluster para Argo y que el ApplicationSet lee para hacer fan-out.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: clusters-prod
  namespace: openshift-gitops
spec:
  clusterSets:
  - default
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          environment: prod
