# Enlaza los Placement de ACM con Argo CD.
#
# Cuando su controlador reconcilia, crea un Secret de cluster en el namespace de
# Argo (openshift-gitops) por cada cluster que seleccionan los Placement
# referenciados. Ese Secret es lo que permite al ApplicationSet desplegar en un
# spoke: sin el, Argo no sabe como llegar al cluster gestionado.
#
# Se referencia un unico Placement que abarca todos los roles; los overlays por
# ambiente los resuelve el ApplicationSet segun la etiqueta del cluster.
#
# managedServiceAccountRef fija la IDENTIDAD con la que Argo escribe en cada
# spoke. Sin el, ACM entrega el token del addon `application-manager`, cuyo
# ClusterRole es ['*']/['*']/['*']: Argo seria cluster-admin en produccion y el
# RBAC enumerado del hub no aplicaria a los clusters gestionados. Los permisos
# reales de esta identidad los declara el ClusterPermission de argocd-push/.
apiVersion: apps.open-cluster-management.io/v1beta1
kind: GitOpsCluster
metadata:
  annotations:
    # El CRD lo trae ACM, que instala el MISMO sync (app acm): sin esto, el dry-run del arranque en frio invalida todo el sync de la root.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Wave 3: los CRDs de ACM (Placement, GitOpsCluster) no existen hasta que el MultiClusterHub termina de instalarlos.
    argocd.argoproj.io/sync-wave: "3"
  name: gitops-cluster
  namespace: openshift-gitops
spec:
  argoServer:
    argoNamespace: openshift-gitops
    cluster: local-cluster
  managedServiceAccountRef: argocd-push
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: clusters-all
    namespace: openshift-gitops
