# Selecciona los clusters de rol desarrollo (environment=dev).
# Hace que los overlays "dev" de los productos workload caigan en los spokes etiquetados environment=dev, no en el hub.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  annotations:
    # El CRD lo trae ACM, que instala el MISMO sync (app acm): sin esto, el dry-run del arranque en frio invalida todo el sync de la root.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Wave 3: los CRDs de ACM (Placement, GitOpsCluster) no existen hasta que el MultiClusterHub termina de instalarlos.
    argocd.argoproj.io/sync-wave: "3"
  name: clusters-dev
  namespace: openshift-gitops
spec:
  clusterSets:
  - default
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          environment: dev
