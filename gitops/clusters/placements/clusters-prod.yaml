# Selecciona los clusters de rol producción (environment=prod).
# Produce una PlacementDecision que el GitOpsCluster convierte en Secret de cluster para Argo y que el ApplicationSet lee para hacer fan-out.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  annotations:
    # El CRD lo trae ACM, que instala el MISMO sync (app acm): sin esto, el dry-run del arranque en frio invalida todo el sync de la root.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Wave 3: los CRDs de ACM (Placement, GitOpsCluster) no existen hasta que el MultiClusterHub termina de instalarlos.
    argocd.argoproj.io/sync-wave: "3"
  name: clusters-prod
  namespace: openshift-gitops
spec:
  clusterSets:
  - default
  predicates:
  - requiredClusterSelector:
      labelSelector:
        matchLabels:
          environment: prod
