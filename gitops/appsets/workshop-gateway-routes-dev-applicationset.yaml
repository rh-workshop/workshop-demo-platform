# Descubrimiento de las RUTAS del gateway de los servicios del workshop.
#
# Hermano de workshop-services-dev: recorre `apps/*/gateway-route/overlays/dev`
# del repo de aplicaciones. La Route passthrough de cada servicio vive en
# platform-gateway (junto al gateway compartido), por eso es una Application
# aparte con ese destino y va en la onda 1, antes que el servicio (onda 2).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workshop-gateway-routes-dev
  labels:
    # Mismas etiquetas que las Applications que genera, para filtrarlo junto a ellas.
    workshop.redhat.com/layer: application
    workshop.redhat.com/component: workshop-gateway-routes
    workshop.redhat.com/environment: dev
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
        revision: main
        directories:
          - path: apps/*/gateway-route/overlays/dev
  template:
    metadata:
      # Onda 1 — la ruta existe antes de que el servicio la necesite.
      name: '{{trimSuffix "-service" (index .path.segments 1)}}-gateway-route-dev'
      labels:
        # Distingue de un vistazo qué es infraestructura y qué es aplicación.
        workshop.redhat.com/layer: application
        workshop.redhat.com/component: '{{trimSuffix "-service" (index .path.segments 1)}}'
        workshop.redhat.com/environment: dev
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: workshop-platform
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-gateway
      # El dominio real del cluster se fija en vivo (día 0) y Argo lo respeta: el repo queda genérico.
      ignoreDifferences:
        - group: route.openshift.io
          kind: Route
          jsonPointers:
            - /spec/host
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
  # Si se borra el ApplicationSet, las Applications generadas sobreviven.
  syncPolicy:
    preserveResourcesOnDeletion: true
