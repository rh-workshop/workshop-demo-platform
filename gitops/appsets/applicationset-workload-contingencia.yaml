# Fan-out de los productos WORKLOAD a los clusters de ambiente contingencia.
#
# El generador NO nombra ningún cluster: selecciona por el Placement
# clusters-contingencia (ambiente=contingencia), así que si mañana el cluster de contingencia cambia
# de nombre, esto no se toca. clusterDecisionResource lee la PlacementDecision de
# clusters-contingencia vía el ConfigMap acm-placement y expone {{.name}} (nombre del
# cluster) y {{.server}} (su API).
#
# La Application generada se llama <producto>-contingencia (por AMBIENTE, no por el
# nombre del cluster) para que se entienda de un vistazo a qué entorno pertenece.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    # Wave 4: el generador clusterDecisionResource lee PlacementDecisions, que no existen hasta la wave 3.
    argocd.argoproj.io/sync-wave: "4"
  name: workload-contingencia
  labels:
    # Mismas etiquetas que las Applications que genera, para filtrarlo junto a ellas.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: workload
    workshop.redhat.com/environment: contingencia
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - matrix:
      generators:
      - clusterDecisionResource:
          configMapRef: acm-placement
          labelSelector:
            matchLabels:
              cluster.open-cluster-management.io/placement: clusters-contingencia
          requeueAfterSeconds: 180
      - list:
          elements:
          - producto: keycloak
            namespace: keycloak
            proyecto: platform-workload-prod
          - producto: connectivity-link
            namespace: kuadrant-system
            proyecto: platform-workload-prod
          - producto: cert-manager
            namespace: cert-manager
            proyecto: platform-workload-prod
          # Gobierno de los namespaces de la ruta de datos: cuota, limites y RBAC.
          # Va por Argo y no por Policy para que funcione tambien sin ACM.
          - producto: namespace-governance
            namespace: kuadrant-system
            proyecto: governance
          # Gobierno del namespace de NEGOCIO de contingencia (workshop-demo-
          # contingencia, solo demo-service tiene overlay contingencia): cuota,
          # limites, RBAC y aislamiento de red ANTES de que la Application del
          # servicio despliegue dentro.
          - producto: namespace-governance-workload
            namespace: workshop-demo-contingencia
            proyecto: governance
            wave: "-1"
          # El puente con ESO: cada cluster necesita su ClusterSecretStore para
          # que sus ExternalSecret puedan leer del almacen, que vive en el hub.
          - producto: openbao-store
            namespace: external-secrets
            proyecto: platform-workload-prod
          - producto: kafka
            namespace: kafka
            proyecto: platform-workload-prod
          # MetalLB solo aplica en BARE-METAL. En un cloud (AWS/Azure/GCP) el proveedor
          # ya provisiona un balanceador por cada Service LoadBalancer, y MetalLB en L2
          # no funciona: la red virtual no reenvia el ARP gratuito del que depende.
          # OBLIGATORIO en la instalacion del cliente, que es sobre servidores propios: sin MetalLB
          # los Service de tipo LoadBalancer se quedan en Pending y Kafka no queda expuesto.
          # Aqui sigue comentado porque este cluster corre en nube y la propia nube los provisiona.
          # - producto: metallb
          #   namespace: metallb-system
  template:
    metadata:
      name: 'config-{{.producto}}-contingencia'
      labels:
        # Distingue de un vistazo qué es infraestructura y qué es aplicación.
        workshop.redhat.com/layer: infrastructure
        # Permite agrupar en la consola las dos Applications de un mismo componente.
        workshop.redhat.com/component: '{{.producto}}'
        workshop.redhat.com/environment: contingencia
        workshop.redhat.com/cluster: '{{.name}}'
      annotations:
        # Por defecto sin wave explicita (Argo la trata como 0); namespace-
        # governance-workload la ADELANTA con su propia entrada `wave` en el
        # `list`, para sincronizar antes que las Applications de negocio que
        # dependen de que su namespace ya exista gobernado.
        argocd.argoproj.io/sync-wave: '{{default "0" .wave}}'
    spec:
      # El dominio lo declara cada componente en el `list`: el gobierno no
      # comparte sobre de permisos con la configuracion de un producto.
      project: '{{.proyecto}}'
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
        targetRevision: main
        path: '{{.producto}}/gitops/overlays/contingencia'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        retry:
          # Arranque en frio: los CRDs (Kuadrant, producto) los instala ACM por su
          # cuenta y pueden tardar minutos. Sin backoff Argo agota 5 intentos y se rinde.
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  syncPolicy:
    preserveResourcesOnDeletion: true
