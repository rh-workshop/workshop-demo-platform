# Fan-out de los productos WORKLOAD a los clusters de ambiente dev.
#
# El generador NO nombra ningún cluster: selecciona por el Placement
# clusters-dev (ambiente=dev), así que si mañana el cluster de dev cambia
# de nombre, esto no se toca. clusterDecisionResource lee la PlacementDecision de
# clusters-dev vía el ConfigMap acm-placement y expone {{.name}} (nombre del
# cluster) y {{.server}} (su API).
#
# La Application generada se llama <producto>-dev (por AMBIENTE, no por el
# nombre del cluster) para que se entienda de un vistazo a qué entorno pertenece.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    # Wave 4: el generador clusterDecisionResource lee PlacementDecisions, que no existen hasta la wave 3.
    argocd.argoproj.io/sync-wave: "4"
  name: workload-dev
  labels:
    # Mismas etiquetas que las Applications que genera, para filtrarlo junto a ellas.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: workload
    workshop.redhat.com/environment: dev
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - matrix:
      generators:
      - clusterDecisionResource:
          configMapRef: acm-placement
          labelSelector:
            matchLabels:
              cluster.open-cluster-management.io/placement: clusters-dev
          requeueAfterSeconds: 180
      - list:
          elements:
          - producto: keycloak
            namespace: keycloak
            proyecto: platform-workload-nonprod
            wave: "0"
          - producto: connectivity-link
            namespace: kuadrant-system
            proyecto: platform-workload-nonprod
            wave: "0"
          - producto: cert-manager
            namespace: cert-manager
            proyecto: platform-workload-nonprod
            wave: "0"
          # Gobierno de los namespaces de PLATAFORMA del cluster de dev (la ruta
          # de datos: kuadrant-system): cuota, limites y RBAC. Va por Argo y no
          # por Policy para que funcione tambien sin ACM. En governance, no aqui:
          # es el mismo componente que en el hub gobierna Quay/ACS/etc, y vive
          # en la instancia de gobierno.
          - producto: namespace-governance
            namespace: kuadrant-system
            proyecto: governance
            wave: "0"
          # Gobierno de los namespaces de NEGOCIO del cluster de dev (canary,
          # bluegreen, circuit-breaker, api): cuota, limites, RBAC de 3 grupos
          # y aislamiento de red, ANTES de que la Application del servicio
          # despliegue dentro. En apps-nonprod y wave temprana, no en governance:
          # el RBAC estandar edit/view/admin no acuña privilegio, y necesita
          # compartir instancia con las Applications de negocio que dependen de
          # el para que el sync-wave garantice el orden entre ambas.
          - producto: namespace-governance-workload
            namespace: canary-demo-dev
            proyecto: governance
            wave: "-1"
          # El puente con ESO: cada cluster necesita su ClusterSecretStore para
          # que sus ExternalSecret puedan leer del almacen, que vive en el hub.
          - producto: openbao-store
            namespace: external-secrets
            proyecto: platform-workload-nonprod
            wave: "0"
          - producto: kafka
            namespace: kafka
            proyecto: platform-workload-nonprod
            wave: "0"
          # MetalLB solo aplica en BARE-METAL. En un cloud (AWS/Azure/GCP) el proveedor
          # ya provisiona un balanceador por cada Service LoadBalancer, y MetalLB en L2
          # no funciona: la red virtual no reenvia el ARP gratuito del que depende.
          # OBLIGATORIO en la instalacion del cliente, que es sobre servidores propios: sin MetalLB
          # los Service de tipo LoadBalancer se quedan en Pending y Kafka no queda expuesto.
          # Aqui sigue comentado porque este cluster corre en nube y la propia nube los provisiona.
          # - producto: metallb
          #   namespace: metallb-system
  template:
    metadata:
      name: 'config-{{.producto}}-dev'
      labels:
        # Distingue de un vistazo qué es infraestructura y qué es aplicación.
        workshop.redhat.com/layer: infrastructure
        # Permite agrupar en la consola las dos Applications de un mismo componente.
        workshop.redhat.com/component: '{{.producto}}'
        workshop.redhat.com/environment: dev
        workshop.redhat.com/cluster: '{{.name}}'
      annotations:
        # TODA entrada del `list` lleva `wave` explicito -- con
        # goTemplateOptions: [missingkey=error], `{{default "0" .wave}}` FALLA
        # si algun elemento no declara la clave (Sprig evalua .wave antes de
        # aplicar el default). namespace-governance-workload la ADELANTA a "-1"
        # para sincronizar antes que las Applications de negocio de
        # workshop-services-dev (wave 2) que dependen de que su namespace ya
        # exista gobernado; el resto va en "0".
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      # El dominio lo declara cada componente en el `list`: el gobierno no
      # comparte sobre de permisos con la configuracion de un producto.
      project: '{{.proyecto}}'
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
        targetRevision: main
        path: '{{.producto}}/gitops/overlays/dev'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        retry:
          # Arranque en frio: los CRDs (Kuadrant, producto) los instala ACM por su
          # cuenta y pueden tardar minutos. Sin backoff Argo agota 5 intentos y se rinde.
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  syncPolicy:
    preserveResourcesOnDeletion: true
