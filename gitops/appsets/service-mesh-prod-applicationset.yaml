# Fan-out de Service Mesh (HELM) a los clusters de ambiente prod.
#
# Service Mesh usa Helm (no Kustomize como los demas workload), por eso tiene su
# propio ApplicationSet en vez de ir en el 'list' del workload-prod: el template
# apunta a un chart con helm.valueFiles, no a un overlay de Kustomize. Igual que
# los demas, selecciona el cluster por el Placement clusters-prod, sin nombrarlo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: service-mesh-prod
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - clusterDecisionResource:
      configMapRef: acm-placement
      labelSelector:
        matchLabels:
          cluster.open-cluster-management.io/placement: clusters-prod
      requeueAfterSeconds: 180
  template:
    metadata:
      name: 'service-mesh-prod'
    spec:
      project: workshop-platform
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
        targetRevision: main
        path: service-mesh/helm
        helm:
          valueFiles:
            - envs/values-prod.yaml
      destination:
        server: '{{.server}}'
        namespace: istio-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  syncPolicy:
    preserveResourcesOnDeletion: true
