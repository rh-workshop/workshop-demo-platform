# Fan-out de Service Mesh (HELM) a los clusters de ambiente dev.
#
# Service Mesh usa Helm (no Kustomize como los demás workload), por eso tiene su
# propio ApplicationSet en vez de ir en el 'list' del workload-dev: el template
# apunta a un chart con helm.valueFiles, no a un overlay de Kustomize. Igual que
# los demás, selecciona el cluster por el Placement clusters-dev, sin nombrarlo.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: service-mesh-dev
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - clusterDecisionResource:
      configMapRef: acm-placement
      labelSelector:
        matchLabels:
          cluster.open-cluster-management.io/placement: clusters-dev
      requeueAfterSeconds: 180
  template:
    metadata:
      name: 'service-mesh-dev'
      labels:
        # Distingue de un vistazo qué es infraestructura y qué es aplicación.
        workshop.redhat.com/layer: infrastructure
        # Permite agrupar en la consola las dos Applications de un mismo componente.
        workshop.redhat.com/component: service-mesh
        workshop.redhat.com/environment: dev
        workshop.redhat.com/cluster: '{{.name}}'
    spec:
      project: workshop-multicluster
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
        targetRevision: main
        path: service-mesh/helm
        helm:
          valueFiles:
            - envs/values-dev.yaml
      destination:
        server: '{{.server}}'
        namespace: istio-system
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  syncPolicy:
    preserveResourcesOnDeletion: true
