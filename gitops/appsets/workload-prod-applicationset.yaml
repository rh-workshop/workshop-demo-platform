# Fan-out de los productos WORKLOAD a los clusters de ambiente prod.
#
# El generador NO nombra ningún cluster: selecciona por el Placement
# clusters-prod (ambiente=prod), así que si mañana el cluster de prod cambia
# de nombre, esto no se toca. clusterDecisionResource lee la PlacementDecision de
# clusters-prod vía el ConfigMap acm-placement y expone {{.name}} (nombre del
# cluster) y {{.server}} (su API).
#
# La Application generada se llama <producto>-prod (por AMBIENTE, no por el
# nombre del cluster) para que se entienda de un vistazo a qué entorno pertenece.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-prod
  labels:
    # Mismas etiquetas que las Applications que genera, para filtrarlo junto a ellas.
    workshop.redhat.com/layer: infrastructure
    workshop.redhat.com/component: workload
    workshop.redhat.com/environment: prod
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
  - matrix:
      generators:
      - clusterDecisionResource:
          configMapRef: acm-placement
          labelSelector:
            matchLabels:
              cluster.open-cluster-management.io/placement: clusters-prod
          requeueAfterSeconds: 180
      - list:
          elements:
          - producto: keycloak
            namespace: keycloak
          - producto: connectivity-link
            namespace: kuadrant-system
          - producto: cert-manager
            namespace: cert-manager
          - producto: metallb
            namespace: metallb-system
  template:
    metadata:
      name: 'config-{{.producto}}-prod'
      labels:
        # Distingue de un vistazo qué es infraestructura y qué es aplicación.
        workshop.redhat.com/layer: infrastructure
        # Permite agrupar en la consola las dos Applications de un mismo componente.
        workshop.redhat.com/component: '{{.producto}}'
        workshop.redhat.com/environment: prod
        workshop.redhat.com/cluster: '{{.name}}'
    spec:
      project: workshop-multicluster
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-platform-config.git
        targetRevision: main
        path: '{{.producto}}/gitops/overlays/prod'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
  syncPolicy:
    preserveResourcesOnDeletion: true
