# Descubrimiento de los SERVICIOS del workshop en el repo de aplicaciones.
#
# El generador `git` de directorios recorre `apps/*/overlays/dev` del repo
# workshop-demo-app-config: el equipo de aplicaciones crea la carpeta de su
# servicio y este ApplicationSet la detecta solo — sin PR al repo de
# plataforma y, sobre todo, SIN tocar el plano de gobierno. La plantilla
# (project, destino, syncPolicy, ignoreDifferences) la define plataforma aquí;
# el AppProject workshop-platform (allow-list, falla cerrado) acota lo que ese
# repo puede desplegar.
#
# El patrón `apps/*/overlays/dev` NO cruza segmentos, así que cada servicio da
# UNA Application con todo lo suyo: Deployment, Service, HTTPRoute, AuthPolicy y
# RateLimitPolicy. La entrada al gateway (una Route única) es de plataforma y
# vive en connectivity-link. El permiso de descarga de imagen va DENTRO de cada servicio: un RoleBinding en
# apps/<servicio>/base con metadata.namespace fijo en workshop-demo-dev (el
# dueño del ImageStream), por lo que el overlay dev no lleva namespace global.
#
# Convención de nombres que asume la plantilla: la carpeta se llama
# `<componente>-service`; el namespace de destino es `<componente>-demo-dev`,
# salvo el servicio original `demo-service`, que vive en `workshop-demo-dev`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workshop-services-dev
  labels:
    # Mismas etiquetas que las Applications que genera, para filtrarlo junto a ellas.
    workshop.redhat.com/layer: application
    workshop.redhat.com/component: workshop-services
    workshop.redhat.com/environment: dev
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
        revision: main
        directories:
          - path: apps/*/overlays/dev
  template:
    metadata:
      # Onda 2 — los servicios van después de las rutas del gateway (onda 1).
      name: 'app-{{index .path.segments 1}}-dev'
      labels:
        # Distingue de un vistazo qué es infraestructura y qué es aplicación.
        workshop.redhat.com/layer: application
        workshop.redhat.com/component: '{{trimSuffix "-service" (index .path.segments 1)}}'
        workshop.redhat.com/environment: dev
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: workshop-platform
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{if eq (index .path.segments 1) "demo-service"}}workshop-demo-dev{{else}}{{trimSuffix "-service" (index .path.segments 1)}}-demo-dev{{end}}'
      # Sin ignoreDifferences para el hostname ni el issuer: los overlays llevan el
      # dominio real del cluster de laboratorio, así que Git y cluster coinciden y
      # Argo gobierna ambos campos. Ignorarlos obligaba a parchearlos a mano y un
      # sync manual (que no respeta ignoreDifferences) devolvía el placeholder,
      # dejando 404 en el gateway y 401 con tokens válidos.
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
          - CreateNamespace=true
  # Si se borra el ApplicationSet, las Applications generadas sobreviven.
  syncPolicy:
    preserveResourcesOnDeletion: true
