# Descubrimiento de los SERVICIOS del workshop en el repo de aplicaciones.
#
# El generador `git` de directorios recorre `apps/*/overlays/dev` del repo
# workshop-demo-app-config: el equipo de aplicaciones crea la carpeta de su
# servicio y este ApplicationSet la detecta solo — sin PR al repo de
# plataforma y, sobre todo, SIN tocar el plano de gobierno. La plantilla
# (project, destino, syncPolicy, ignoreDifferences) la define plataforma aquí;
# el AppProject workshop-platform (allow-list, falla cerrado) acota lo que ese
# repo puede desplegar.
#
# El patrón `apps/*/overlays/dev` NO cruza segmentos, así que cada servicio da
# UNA Application con todo lo suyo: Deployment, Service, HTTPRoute, AuthPolicy y
# RateLimitPolicy. La entrada al gateway (una Route única) es de plataforma y
# vive en connectivity-link. El permiso de descarga de imagen va DENTRO de cada servicio: un RoleBinding en
# apps/<servicio>/base con metadata.namespace fijo en workshop-demo-dev (el
# dueño del ImageStream), por lo que el overlay dev no lleva namespace global.
#
# DEV VA A SU PROPIO CLUSTER, igual que test, prod y contingencia: el destino lo
# decide el Placement `clusters-dev` de ACM. El hub es el plano de GESTIÓN (ACM,
# Quay, ACS, Argo) y no debe alojar cargas de negocio; mezclarlas ahí acopla el
# ciclo de vida de las aplicaciones al del plano de control.
#
# Convención de nombres que asume la plantilla: la carpeta se llama
# `<componente>-service`; el namespace de destino es `<componente>-demo-dev`,
# salvo el servicio original `demo-service`, que vive en `workshop-demo-dev`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    # Wave 4: el generador clusterDecisionResource lee PlacementDecisions, que no existen hasta la wave 3.
    argocd.argoproj.io/sync-wave: "4"
  name: workshop-services-dev
  labels:
    # Mismas etiquetas que las Applications que genera, para filtrarlo junto a ellas.
    workshop.redhat.com/layer: application
    workshop.redhat.com/component: workshop-services
    workshop.redhat.com/environment: dev
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    # matrix = (cluster que decide el Placement) x (servicios que hay en el repo).
    # El clusterDecisionResource es lo que hace que dev vaya a SU cluster: sin él
    # el destino quedaba cableado al hub y los servicios de dev se desplegaban en
    # el cluster de gestion, junto a ACM y Quay. Los demas ambientes ya usaban
    # este patron; dev era el unico desalineado.
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: clusters-dev
              requeueAfterSeconds: 180
          - git:
              repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
              revision: main
              directories:
                - path: apps/*/overlays/dev
  template:
    metadata:
      # Onda 2 — los servicios van después de las rutas del gateway (onda 1).
      name: 'app-{{index .path.segments 1}}-dev'
      labels:
        # Distingue de un vistazo qué es infraestructura y qué es aplicación.
        workshop.redhat.com/layer: application
        workshop.redhat.com/component: '{{trimSuffix "-service" (index .path.segments 1)}}'
        workshop.redhat.com/environment: dev
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      # Dominio apps, ambiente dev: el destino es la barandilla -- un manifiesto
      # de este proyecto no puede aterrizar en un namespace de otro ambiente.
      project: apps-nonprod
      source:
        repoURL: https://github.com/rh-workshop/workshop-demo-app-config.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        # El cluster del ambiente, decidido por el Placement — nunca el hub.
        server: '{{.server}}'
        namespace: '{{if eq (index .path.segments 1) "demo-service"}}workshop-demo-dev{{else}}{{trimSuffix "-service" (index .path.segments 1)}}-demo-dev{{end}}'
      # Sin ignoreDifferences para el hostname ni el issuer: los overlays llevan el
      # dominio real del cluster de laboratorio, así que Git y cluster coinciden y
      # Argo gobierna ambos campos. Ignorarlos obligaba a parchearlos a mano y un
      # sync manual (que no respeta ignoreDifferences) devolvía el placeholder,
      # dejando 404 en el gateway y 401 con tokens válidos.
      syncPolicy:
        retry:
          # Arranque en frio: los CRDs (Kuadrant, producto) los instala ACM por su
          # cuenta y pueden tardar minutos. Sin backoff Argo agota 5 intentos y se rinde.
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - RespectIgnoreDifferences=true
          - CreateNamespace=true
        # ETIQUETA DE TENANT EN EL NAMESPACE, no solo en la Application. El label
        # `workshop.redhat.com/component` ya distinguia la Application por
        # servicio; el namespace que la contiene nacia sin el, asi que ningun
        # RoleBinding ni Policy podia acotar por equipo -- `app-developers` tenia
        # `edit` en TODOS los namespaces de negocio por igual, sin poder decir
        # "el equipo de canary no toca el de circuit-breaker".
        #
        # Mismo calculo que el namespace de destino de arriba: no crea un tenant
        # nuevo, nombra el que ya existe de facto por servicio. RBAC por tenant
        # queda listo para activarse (RoleBinding acotado por esta etiqueta) en
        # cuanto existan los grupos de Entra/Keycloak correspondientes; hasta
        # entonces el RoleBinding generico de ACM sigue dando el mismo acceso.
        # OJO: Argo compara este objeto anidado con mas rigor del que aplica -- la
        # ApplicationSet queda marcada OutOfSync en `platform-root` incluso recien
        # aplicada y sin diferencia real con Git (comprobado: kubectl apply y el
        # objeto vivo coinciden byte a byte). Es cosmetico: el campo SI se aplica,
        # SI persiste entre ciclos, y el namespace SI nace etiquetado. No confundir
        # con una reversion -- no lo es.
        managedNamespaceMetadata:
          labels:
            workshop.redhat.com/tenant: '{{if eq (index .path.segments 1) "demo-service"}}workshop-demo{{else}}{{trimSuffix "-service" (index .path.segments 1)}}{{end}}'
  # Si se borra el ApplicationSet, las Applications generadas sobreviven.
  syncPolicy:
    preserveResourcesOnDeletion: true
