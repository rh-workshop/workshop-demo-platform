# El config.yaml de Quay (SECRET_KEY, DATABASE_SECRET_KEY, SUPER_USERS, feature
# flags) sincronizado desde el almacen, en vez de un `oc create secret` a mano.
#
# QUAYREGISTRY.SPEC.CONFIGBUNDLESECRET REFERENCIA ESTE SECRET POR NOMBRE
# (quay/gitops/base/quayregistry.yaml): el operador de Quay lo lee y aplica al
# pod. El ExternalSecret solo cambia DE DONDE sale el contenido -- del almacen
# en vez de un comando imperativo del bootstrap -- no cambia cómo lo consume
# el operador.
#
# EL VALOR ES UN BLOB, NO PROPIEDADES SUELTAS. config.yaml es un YAML completo,
# no una credencial con user/password como el resto de ExternalSecret de este
# repo. Se guarda entero como una sola propiedad en el almacen
# (platform/quay/config-bundle, propiedad config.yaml) y se mapea 1:1 -- sin
# `template`, porque no hay que componer nada.
#
# SEMBRADO INICIAL: bootstrap/ansible/bootstrap.yml sigue siendo quien genera
# el YAML la primera vez (SECRET_KEY/DATABASE_SECRET_KEY únicos por
# instalación), pero ahora lo escribe en el almacén en vez de crear el Secret
# de Kubernetes directamente. A partir de ahí, este ExternalSecret gobierna el
# Secret; el bootstrap solo siembra si el path del almacén no existe aún.
#
# CAMBIAR LA CONFIG DESPUÉS DEL DÍA-0: editar el valor en el almacén (o vía
# `bao kv put`) y esperar el refresco, o forzarlo con
# `oc annotate externalsecret quay-config-bundle -n quay-enterprise
# force-sync=$(date +%s) --overwrite`. El QuayRegistry reconciliará el pod al
# detectar el cambio en el Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: quay-config-bundle
  namespace: quay-enterprise
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: quay-config-bundle
    creationPolicy: Owner
  data:
    - secretKey: config.yaml
      remoteRef:
        key: platform/quay/config-bundle
        property: config.yaml
