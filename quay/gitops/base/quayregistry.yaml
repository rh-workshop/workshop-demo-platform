# Instancia de Quay. El operador reconcilia este CR: crea el despliegue, la base
# de datos, Redis, la ruta y los certificados según los componentes marcados.
#
# `managed: true` = lo gestiona el operador. `managed: false` = queda fuera
# (aquí: replicación y autoescalado; ver cada componente más abajo).
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy), no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: company-quay
  namespace: quay-enterprise
spec:
  # El Secret con la configuración se referencia POR NOMBRE: su contenido nunca
  # se versiona en Git.
  configBundleSecret: quay-config-bundle
  components:
    - kind: quay
      managed: true
    # NO-PRODUCCION: postgres gestionado = 1 pod sin HA. En prod = DB externa
    # gestionada (managed: false + DB_URI en el config bundle). Ver
    # docs/production-outside-the-lab.md.
    - kind: postgres
      managed: true
    - kind: redis
      managed: true
    # NO-PRODUCCION: objectstorage gestionado usa NooBaa ("disponibilidad limitada"
    # según Red Hat). En prod = S3/RADOS GW/Azure Blob (managed: false +
    # DISTRIBUTED_STORAGE_CONFIG). Ver docs/production-outside-the-lab.md.
    - kind: objectstorage
      managed: true
    - kind: route
      managed: true
    # NO-PRODUCCION: tls gestionado usa el wildcard del cluster. En prod = cert
    # corporativo (managed: false + ssl.cert/ssl.key via ESO desde Key Vault).
    - kind: tls
      managed: true
    # Clair ON: escaneo de vulnerabilidades en el registro (gate al push). Decisión
    # de arquitectura: ACS lee estos resultados vía integración Scanner+Registry en
    # vez de re-escanear (ver docs/production-backlog.md). La doc exige que si clair
    # es managed, clairpostgres también.
    - kind: clair
      managed: true
    - kind: clairpostgres
      managed: true
    - kind: mirror
      managed: false
    - kind: monitoring
      # NO-PRODUCCION: monitoring managed exige el operador en modo all-namespaces
      # (hoy es single-namespace por su OperatorGroup). En prod: instalar el operador
      # cluster-wide y poner managed: true, o crear el ServiceMonitor aparte.
      managed: false
    # HPA ON: el registro sirve pulls de todo el cluster + spokes; debe escalar
    # ante picos. Antes estaba desactivado y sin réplicas declaradas.
    - kind: horizontalpodautoscaler
      managed: true
