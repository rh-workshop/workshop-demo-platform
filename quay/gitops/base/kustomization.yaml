apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # SOLO el registro. El ALMACENAMIENTO que hay debajo lo aporta el overlay del
  # cluster eligiendo un componente: components/storage-s3 (object storage
  # nativo de la nube) o components/storage-noobaa (MCG sobre un PVC, para
  # clusters sin object storage). Ver quay_storage_backend en vars/platform-vars.yml.
  #
  # NooBaa no vive en la base: en un cluster de nube sobra, y su cuota hace que el
  # push del CI falle con NOT_ENOUGH_SPACE aunque el disco este casi vacio.
  - quayregistry.yaml
  # El Secret que referencia configBundleSecret, sincronizado desde el almacen
  # en vez de un `oc create secret` del bootstrap.
  - externalsecret-quay-config-bundle.yaml
