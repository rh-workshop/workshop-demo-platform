apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# SIN transformador global de namespace: cada recurso de la base ya declara el
# suyo, y NooBaa —cuando se usa— DEBE quedarse en openshift-storage (el operador
# MCG solo reconcilia ahi); el transformador lo reubicaba a quay-enterprise y lo
# dejaba huerfano e inerte.
resources:
  - ../../base

# BACKEND DE ALMACENAMIENTO DE ESTE CLUSTER. El hub corre en AWS, que ya ofrece
# object storage nativo: se usa S3 directo y no se despliega MCG. Un cluster
# on-premise sin object storage cambia esta linea por storage-noobaa, y nada mas.
# Debe coincidir con quay_storage_backend de vars/platform-vars.yml, que es lo
# que lee el bootstrap para sembrar la conexion en el config bundle.
components:
  - ../../components/storage-s3

labels:
  - pairs:
      app.kubernetes.io/part-of: workshop-platform
      workshop.redhat.com/environment: hub
