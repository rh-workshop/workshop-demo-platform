# Backing store por defecto del MCG: un pv-pool sobre EBS (gp3). Va DECLARADO
# porque el NooBaa lleva manualDefaultBackingStore (ver noobaa.yaml): sin root
# creds de AWS en el sandbox, la via automatica del operador nunca termina.
# NO-PRODUCCION: en produccion el storage de Quay es S3/Azure Blob unmanaged.
apiVersion: noobaa.io/v1alpha1
kind: BackingStore
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy mcg-operator): sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: noobaa-default-backing-store
  namespace: openshift-storage
spec:
  type: pv-pool
  pvPool:
    numVolumes: 1
    resources:
      requests:
        storage: 50Gi
---
# BucketClass por defecto sobre el backing store manual: con
# manualDefaultBackingStore el operador tampoco la crea solo.
apiVersion: noobaa.io/v1alpha1
kind: BucketClass
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy mcg-operator): sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: noobaa-default-bucket-class
  namespace: openshift-storage
spec:
  placementPolicy:
    tiers:
      - backingStores:
          - noobaa-default-backing-store
