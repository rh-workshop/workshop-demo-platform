# Credenciales de S3 para Quay, acuñadas por el Cloud Credential Operator.
#
# POR QUE UN CredentialsRequest Y NO UNA LLAVE A MANO. El CCO crea el usuario
# IAM, le adjunta ESTA politica y deposita las llaves en el Secret indicado; el
# ciclo de vida lo gobierna el cluster. La alternativa —reutilizar las
# credenciales de otro componente (p. ej. las del image-registry interno)—
# funciona pero presta una identidad ajena, con permisos pensados para otro
# bucket: no pasa una auditoria y rompe el minimo privilegio.
#
# ALCANCE MINIMO, y es deliberado: los permisos de OBJETO se limitan al bucket
# de Quay (Resource acotado), no a "todos los buckets de la cuenta". Solo las
# acciones de nivel de servicio que S3 no sabe acotar por recurso quedan con
# Resource "*". Asi una credencial filtrada no da acceso a los demas buckets.
#
# Requiere que el CCO pueda acuñar (modo mint o passthrough). En un cluster STS
# o en modo manual el CCO NO resuelve la peticion: ahi las credenciales las
# aporta quien instala, creando a mano el Secret que este objeto declara — el
# playbook quay/ansible/storage.yml lo lee igual y no distingue el origen.
apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: quay-s3
  namespace: openshift-cloud-credential-operator
  annotations:
    # El CRD lo instala el CCO, que es parte del cluster; se mantiene la misma
    # opcion que el resto de CRs de producto para no invalidar el sync en frio.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Donde deposita el CCO las llaves. Es EXACTAMENTE el secreto que busca
  # quay/ansible/storage.yml para componer DISTRIBUTED_STORAGE_CONFIG.
  secretRef:
    name: quay-s3-credentials
    namespace: quay-enterprise
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
      # Operaciones sobre el CONTENIDO del bucket de Quay y sobre el bucket
      # mismo: acotadas por recurso. El playbook crea el bucket si falta, de ahi
      # CreateBucket; el resto es lo que el registro necesita para servir blobs
      # y para completar las subidas multiparte.
      - effect: Allow
        action:
          - s3:CreateBucket
          - s3:GetBucketLocation
          - s3:ListBucket
          - s3:ListBucketMultipartUploads
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          - s3:AbortMultipartUpload
          - s3:ListMultipartUploadParts
        resource: "arn:aws:s3:::quay-datastore-*"
      # ListAllMyBuckets es de nivel de cuenta: S3 no permite acotarlo por
      # recurso. Solo enumera nombres de bucket, no da acceso a su contenido.
      - effect: Allow
        action:
          - s3:ListAllMyBuckets
        resource: "*"
