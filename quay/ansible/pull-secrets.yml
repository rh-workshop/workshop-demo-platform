---
# Credencial de ORIGEN para descargar del registro (quay-pull-credentials).
#
# REPARTO DE RESPONSABILIDADES, que es lo importante de este fichero:
#
#   Ansible (aqui)  -> DEPOSITA la credencial en el almacen. Solo Ansible puede:
#                      los tokens de los robots se consultan a la API de Quay,
#                      que no es Kubernetes, asi que ni Argo ni una Policy pueden
#                      reconciliarlos.
#   ESO             -> ENTREGA el Secret en el hub desde el almacen
#                      (acm/gitops/base/quay-pull-credentials): si alguien lo
#                      borra lo repone, y rotar el robot es reescribir el almacen.
#   Policy de ACM   -> LO REPLICA a los namespaces de negocio de cada cluster
#                      (acm/gitops/base/policies/require-registry-pull-secret) y
#                      lo enlaza al ServiceAccount que descarga.
#
# POR QUE ASI Y NO SEMBRANDO EN CADA NAMESPACE DESDE AQUI. Antes este playbook
# escribia el secreto namespace por namespace, lo que obligaba a reejecutarlo
# por cada cluster nuevo y a mantener a mano la lista de namespaces. La Policy
# los descubre sola, repone el secreto si alguien lo borra y alcanza cualquier
# spoke que entre en su Placement — gobierno continuo en vez de un seed puntual.
# El contenido nunca pasa por Git: la Policy usa `fromSecret`, que LEE el valor
# del secreto que este playbook deja en el hub.
#
# UNA CREDENCIAL POR AMBIENTE, cada una con el robot `puller` de SU organizacion:
# es el minimo privilegio y lo que espera la Policy, que resuelve el nombre por el
# label `environment` del cluster. El hub usa la de tooling, que es de donde
# descargan los pipelines de CI.
#
#   export QUAY_HOST=<host-de-quay>
#   export QUAY_TOKEN=<token-oauth>
#   ansible-playbook quay/ansible/pull-secrets.yml

- name: Sembrar la credencial de origen del registro en el hub
  hosts: localhost
  connection: local
  gather_facts: false

  # El "qué" (prefijo, namespaces de CI) vive en vars/platform-vars.yml:
  # UN solo fichero de datos para todos los playbooks; aquí solo hay iteración.
  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    quay_host: "{{ lookup('env', 'QUAY_HOST') }}"
    quay_token: "{{ lookup('env', 'QUAY_TOKEN') }}"
    quay_api: "https://{{ quay_host }}/api/v1"
    validate_certs: "{{ lookup('env', 'QUAY_VALIDATE_CERTS') | default(true, true) }}"
    tooling_org: "{{ org_prefix }}-tooling"
    # DONDE VIVE LA CREDENCIAL DE ORIGEN, y no es elegible: los hub templates de
    # ACM (fromSecret) solo pueden leer secretos del namespace de ACM. Apuntar a
    # cualquier otro falla con "the namespace argument is restricted to
    # open-cluster-management". Por eso el origen se siembra aqui y no junto al CI.
    origen_namespace: open-cluster-management
    vault_namespace: openbao
    vault_token_secret: openbao-dev-token
    # Debe coincidir con el `remoteRef.key` de los ExternalSecret de
    # acm/gitops/base/quay-pull-credentials, o ESO no encuentra nada que entregar.
    vault_path: platform/quay

  tasks:
    - name: Comprobar que hay credenciales
      ansible.builtin.assert:
        that:
          - quay_host | length > 0
          - quay_token | length > 0
        fail_msg: Faltan QUAY_HOST o QUAY_TOKEN en el entorno.

    # EXISTIR NO ES SERVIR: el token de Quay caduca. Sin esta comprobacion, un token
    # vencido hacia fallar cada tarea con un 401 suelto, sin decir cual era la causa.
    - name: Comprobar que el token de Quay sigue siendo valido
      ansible.builtin.uri:
        url: "{{ quay_api }}/user/"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        validate_certs: "{{ validate_certs | bool }}"
        status_code: [200, 401, 403]
      register: token_check
      failed_when: false
      no_log: true

    - name: Avisar si el token de Quay ha caducado
      ansible.builtin.fail:
        msg: >-
          Quay rechaza el token (HTTP {{ token_check.status }}). Genera uno nuevo en la
          consola (organizacion -> Applications -> Create new application -> Generate
          token) y exportalo en QUAY_TOKEN.
      when: token_check.status != 200

    # El token de un robot no se genera: lo custodia Quay y se consulta por API.
    # Pedirlo aqui evita copiarlo a mano de la consola (y equivocarse de robot).
    - name: Consultar el token del robot pusher de cada ambiente de CI
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ org_prefix }}-{{ item.environment }}/robots/pusher"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: robots_pusher
      loop: "{{ ci_namespaces }}"
      no_log: true

    - name: Consultar el token del robot puller de tooling
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ tooling_org }}/robots/puller"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: robot_tooling
      no_log: true

    # server-side apply para CONVERGER un secreto que pudo crearse a mano antes
    # de existir este playbook: mismo nombre, contenido ahora gobernado de aqui.
    # Al rotar un robot, reejecutar actualiza el origen y la Policy propaga el
    # valor nuevo a todos los clusters sin intervencion.
    # UNA CREDENCIAL POR AMBIENTE. Cada ambiente tiene su PROPIA organizacion en el
    # registro, precisamente para que un CI comprometido en desarrollo no pueda tocar
    # produccion. Con un unico secreto compartido, los clusters de test/prod/contingencia
    # recibian el robot de dev y sus pods fallaban con "unauthorized" al descargar.
    #
    # Se usa el robot `puller` (solo lectura), no `pusher`: un cluster de carga descarga
    # imagenes, nunca publica.
    - name: Consultar el token del robot puller de cada ambiente
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ org_prefix }}-{{ item.name }}/robots/puller"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        validate_certs: "{{ validate_certs | bool }}"
      register: robots_puller
      loop: "{{ environments }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    # El Secret ya no se siembra aqui: lo entrega ESO desde el almacen
    # (acm/gitops/base/quay-pull-credentials). Ansible solo deposita el valor,
    # porque los tokens de los robots se consultan a la API de Quay y ni Argo ni
    # una Policy pueden reconciliarlos. Sin este paso los ExternalSecret quedan
    # SecretSyncedError y la Policy NonCompliant por "secrets not found".
    - name: Localizar el pod del almacen
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ vault_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=openbao
      register: bao_pod

    - name: Leer el token del almacen
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ vault_token_secret }}"
        namespace: "{{ vault_namespace }}"
      register: token_info
      no_log: true

    - name: Depositar la credencial de cada ambiente en el almacen
      kubernetes.core.k8s_exec:
        namespace: "{{ vault_namespace }}"
        pod: "{{ bao_pod.resources[0].metadata.name }}"
        command: >-
          env BAO_TOKEN={{ token_info.resources[0].data.token | b64decode }}
          BAO_ADDR=http://127.0.0.1:8200
          bao kv put -mount=secret {{ vault_path }}/pull-{{ item.item.name }}
          .dockerconfigjson={{ credencial | quote }}
      vars:
        # Un solo auth: cada ambiente descarga de SU organizacion. Las imagenes de
        # tooling solo las consumen los pipelines, que corren en el hub y reciben
        # la credencial de company-tooling por su propio label environment=hub.
        credencial: >-
          {{ {'auths': {
                quay_host: {
                  'username': org_prefix ~ '-' ~ item.item.name ~ '+puller',
                  'password': item.json.token,
                  'auth': (org_prefix ~ '-' ~ item.item.name ~ '+puller:' ~ item.json.token) | b64encode}
              }} | to_json }}
      loop: "{{ robots_puller.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      no_log: true

    # El hub descarga de company-tooling: es donde corren los pipelines de CI.
    - name: Depositar la credencial del hub en el almacen
      kubernetes.core.k8s_exec:
        namespace: "{{ vault_namespace }}"
        pod: "{{ bao_pod.resources[0].metadata.name }}"
        command: >-
          env BAO_TOKEN={{ token_info.resources[0].data.token | b64decode }}
          BAO_ADDR=http://127.0.0.1:8200
          bao kv put -mount=secret {{ vault_path }}/pull-hub
          .dockerconfigjson={{ credencial | quote }}
      vars:
        credencial: >-
          {{ {'auths': {
                quay_host: {
                  'username': tooling_org ~ '+puller',
                  'password': robot_tooling.json.token,
                  'auth': (tooling_org ~ '+puller:' ~ robot_tooling.json.token) | b64encode}
              }} | to_json }}
      no_log: true

    # Aqui se sembraba tambien un `quay-pull-credentials` sin sufijo en el hub,
    # con el pusher del ambiente. Se retiro: nadie lo leia (la Policy resuelve el
    # nombre CON sufijo por el label del cluster) y colisionaba con el que la
    # propia Policy escribe en el namespace del CI, dejando tres field managers
    # sobre el mismo objeto. Los pipelines publican con quay-push-credentials.

    - name: Recordar quien lo replica
      ansible.builtin.debug:
        msg: >-
          Credenciales depositadas en el almacen. ESO las entrega como Secret en
          el hub y la Policy de ACM require-registry-pull-secret las replica a los
          namespaces de negocio de cada cluster, enlazandolas al ServiceAccount
          que descarga. Aqui NO se siembra namespace por namespace a proposito.
