---
# Pull secret del CI (quay-pull-credentials) en cada namespace de CI.
#
# POR QUE EXISTE: el kubelet resuelve los pulls del CI con los imagePullSecrets
# del ServiceAccount builder, que solo llevaba el robot pusher del ambiente. Ese
# robot no tiene (ni debe tener) permiso sobre la organizacion tooling, asi que
# el pull de las herramientas espejadas fallaba con unauthorized.
#
# La solucion de menor privilegio es fusionar DOS credenciales en el MISMO
# dockerconfigjson, con clave por prefijo:
#   <quay>                    -> pusher del ambiente (imagenes de la aplicacion)
#   <quay>/<prefijo>-tooling  -> puller de tooling (solo lectura, solo tooling)
# El kubelet elige la entrada mas especifica segun el prefijo de la imagen, asi
# que no hace falta repartir robots con escritura entre organizaciones ni abrir
# lectura anonima al registro (FEATURE_ANONYMOUS_ACCESS sigue en false).
#
# Los tokens de los robots se CONSULTAN a la API de Quay en cada ejecucion y el
# Secret se escribe directo en el cluster: nada de esto pasa por Git.
#
#   export QUAY_HOST=<host-de-quay>
#   export QUAY_TOKEN=<token-oauth>
#   ansible-playbook quay/ansible/pull-secrets.yml

- name: Sembrar los pull secrets del CI
  hosts: localhost
  connection: local
  gather_facts: false

  # El "qué" (prefijo, namespaces de CI) vive en vars/platform-vars.yml:
  # UN solo fichero de datos para todos los playbooks; aquí solo hay iteración.
  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    quay_host: "{{ lookup('env', 'QUAY_HOST') }}"
    quay_token: "{{ lookup('env', 'QUAY_TOKEN') }}"
    quay_api: "https://{{ quay_host }}/api/v1"
    validate_certs: "{{ lookup('env', 'QUAY_VALIDATE_CERTS') | default(true, true) }}"
    tooling_org: "{{ org_prefix }}-tooling"

  tasks:
    - name: Comprobar que hay credenciales
      ansible.builtin.assert:
        that:
          - quay_host | length > 0
          - quay_token | length > 0
        fail_msg: Faltan QUAY_HOST o QUAY_TOKEN en el entorno.

    # El SA builder lo crea el controller de OpenShift al nacer el namespace, y
    # el namespace lo crea Argo: en un arranque en frio puede tardar, de ahi el
    # reintento en lugar de fallar a la primera.
    - name: Esperar al ServiceAccount builder de cada namespace de CI
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ServiceAccount
        name: builder
        namespace: "{{ item.namespace }}"
      register: builder_sa
      until: builder_sa.resources | default([]) | length > 0
      retries: 60
      delay: 10
      loop: "{{ ci_namespaces }}"
      loop_control:
        label: "{{ item.namespace }}"

    # El token de un robot no se genera: lo custodia Quay y se consulta por API.
    # Pedirlo aqui evita copiarlo a mano de la consola (y equivocarse de robot).
    - name: Consultar el token del robot pusher de cada ambiente de CI
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ org_prefix }}-{{ item.environment }}/robots/pusher"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: robots_pusher
      loop: "{{ ci_namespaces }}"
      no_log: true

    - name: Consultar el token del robot puller de tooling
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ tooling_org }}/robots/puller"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: robot_tooling
      no_log: true

    # server-side apply para CONVERGER un secreto que pudo crearse a mano antes
    # de existir este playbook: mismo nombre, contenido ahora gobernado de aqui.
    - name: Sembrar quay-pull-credentials en cada namespace de CI
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/dockerconfigjson
          metadata:
            name: quay-pull-credentials
            namespace: "{{ item.item.namespace }}"
          stringData:
            .dockerconfigjson: >-
              {{ {'auths': {
                    quay_host: {
                      'username': org_prefix ~ '-' ~ item.item.environment ~ '+pusher',
                      'password': item.json.token,
                      'auth': (org_prefix ~ '-' ~ item.item.environment ~ '+pusher:' ~ item.json.token) | b64encode},
                    quay_host ~ '/' ~ tooling_org: {
                      'username': tooling_org ~ '+puller',
                      'password': robot_tooling.json.token,
                      'auth': (tooling_org ~ '+puller:' ~ robot_tooling.json.token) | b64encode}
                 }} | to_json }}
      loop: "{{ robots_pusher.results }}"
      no_log: true

    # Se añade la entrada SOLO si falta: pisar la lista borraria el dockercfg
    # autogenerado del SA y romperia los pulls del registro interno.
    - name: Enlazar quay-pull-credentials al ServiceAccount builder
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: ServiceAccount
        name: builder
        namespace: "{{ item.item.namespace }}"
        definition:
          imagePullSecrets: "{{ item.resources[0].imagePullSecrets | default([]) + [{'name': 'quay-pull-credentials'}] }}"
      when: "'quay-pull-credentials' not in (item.resources[0].imagePullSecrets | default([]) | map(attribute='name') | list)"
      loop: "{{ builder_sa.results }}"
      loop_control:
        label: "{{ item.item.namespace }}"
