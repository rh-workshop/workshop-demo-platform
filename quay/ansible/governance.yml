---
# Gobierno de Quay: cuota y auto-prune por organizacion (via API).
#
# Complementa organizations.yml. FEATURE_QUOTA_MANAGEMENT y FEATURE_AUTO_PRUNE
# estan activos en el config bundle, pero sin cuota ni politica por org no aplican
# nada. Este playbook cierra ese ciclo.
#
# NOTA sobre SUPER_USERS y auto-registro (hallazgo de seguridad): van en el config
# BUNDLE (config.yaml), no por esta API. En prod, el bundle (via ESO) debe fijar:
#   SUPER_USERS: ["quayadmin"]
#   FEATURE_USER_CREATION: false
#   FEATURE_USER_INITIALIZE: false   # tras crear el primer usuario
# Sin esto, cualquiera se autoregistra y no hay superusuario. Ver
# docs/produccion-fuera-del-lab.md.
#
#   export QUAY_HOST=<host-de-quay>
#   export QUAY_TOKEN=<token-oauth>
#   ansible-playbook quay/ansible/governance.yml

- name: Configurar gobierno de Quay
  hosts: localhost
  connection: local
  gather_facts: false

  # El "qué" (prefijo, ambientes, cuotas y retención) vive en vars/platform-vars.yml:
  # UN solo fichero de datos para todos los playbooks; aquí solo hay iteración.
  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    quay_host: "{{ lookup('env', 'QUAY_HOST') }}"
    quay_token: "{{ lookup('env', 'QUAY_TOKEN') }}"
    quay_api: "https://{{ quay_host }}/api/v1"
    validate_certs: "{{ lookup('env', 'QUAY_VALIDATE_CERTS') | default(true, true) }}"

    # Cuota y retencion por organizacion. Las cuatro organizaciones son las de
    # organizations.yml; aqui solo cambia CUANTO guarda cada una.
    #
    # RETENCION POR FECHA, NO POR NUMERO DE TAGS. cosign publica la firma y la
    # atestacion SBOM como TAGS aparte del mismo repositorio (sha256-<hex>.sig y
    # .att), asi que cada build deja TRES tags. Con method=number_of_tags, "las
    # ultimas 10" se agotaban en tres commits y la poda borraba la .sig de una
    # imagen todavia desplegada: la politica de admision la habria rechazado y se
    # perdia la evidencia de procedencia. Podar por fecha borra imagen, firma y
    # atestacion a la vez, que es lo coherente.
    #
    # La retencion es inversa al flujo: en dev se acumulan muchas imágenes de
    # poca vida (cada commit publica una), mientras que en prod y contingencia
    # solo entra lo promocionado y hay que poder volver atrás varias versiones.
    # Podar prod con el mismo criterio que dev dejaría sin imagen a la que
    # revertir tras unos pocos despliegues.
    #
    # Los NUMEROS (quota_bytes, prune_keep_since) viven con cada ambiente en
    # vars/platform-vars.yml; aquí solo se derivan los nombres de organización.
    organizations: >-
      {%- set orgs = [] -%}
      {%- for amb in environments -%}
      {%- set _ = orgs.append({
            'name': org_prefix ~ '-' ~ amb.name,
            'quota_bytes': amb.quota_bytes,
            'prune_keep_since': amb.prune_keep_since
          }) -%}
      {%- endfor -%}
      {{ orgs + [{'name': org_prefix ~ '-tooling',
                  'quota_bytes': tooling_quota_bytes,
                  'prune_keep_since': tooling_prune_keep_since}] }}

  tasks:
    - name: Comprobar que hay credenciales
      ansible.builtin.assert:
        that:
          - quay_host | length > 0
          - quay_token | length > 0
        fail_msg: Faltan QUAY_HOST o QUAY_TOKEN en el entorno.

    # Se consulta antes de crear en lugar de aceptar el 400 de "ya existe": así el
    # playbook informa de lo que cambia de verdad y un 400 por payload inválido falla
    # en vez de pasar desapercibido (mismo criterio que organizations.yml).
    - name: Comprobar si la organizacion ya tiene cuota
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.name }}/quota"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: cuotas_existentes
      loop: "{{ organizations }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fijar la cuota de cada organizacion
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.item.name }}/quota"
        method: POST
        headers:
          Authorization: "Bearer {{ quay_token }}"
        body_format: json
        body:
          limit_bytes: "{{ item.item.quota_bytes }}"
        status_code: [201]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      when: item.json | length == 0
      loop: "{{ cuotas_existentes.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # La cuota existente se actualiza con PUT sobre su id: así el playbook converge
    # también cuando se cambia el valor en este fichero, no solo en la creación.
    - name: Actualizar la cuota si cambio el valor
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.item.name }}/quota/{{ item.json[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ quay_token }}"
        body_format: json
        body:
          limit_bytes: "{{ item.item.quota_bytes }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      when: item.json | length > 0 and item.json[0].limit_bytes != item.item.quota_bytes
      loop: "{{ cuotas_existentes.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Comprobar si la organizacion ya tiene politica de auto-prune
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.name }}/autoprunepolicy/"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: prune_existentes
      loop: "{{ organizations }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Politica de auto-prune por organizacion
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.item.name }}/autoprunepolicy/"
        method: POST
        headers:
          Authorization: "Bearer {{ quay_token }}"
        body_format: json
        body:
          method: creation_date
          value: "{{ item.item.prune_keep_since }}"
        status_code: [201]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      when: item.json.policies | length == 0
      loop: "{{ prune_existentes.results }}"
      loop_control:
        label: "{{ item.item.name }}"
