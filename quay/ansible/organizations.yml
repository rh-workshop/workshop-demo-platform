---
# Organizaciones, repositorios y cuentas robot de Quay.
#
# POR QUE ESTO NO ES GITOPS: una organizacion de Quay no es un recurso de
# Kubernetes. Vive dentro de la base de datos de Quay y solo existe llamando a
# su API REST. No hay CRD que la represente, asi que Argo CD no tiene nada que
# reconciliar. Este playbook hace ese trabajo, y es idempotente: se puede
# reejecutar sin duplicar nada.
#
# CREDENCIALES: el token OAuth se lee de una variable de entorno, nunca de un
# fichero versionado. Se genera en la consola de Quay, en la organizacion, en
# Applications -> Create new application -> Generate token.
#
#   export QUAY_HOST=<host-de-quay>
#   export QUAY_TOKEN=<token-oauth>
#   ansible-playbook quay/ansible/organizations.yml

- name: Configurar organizaciones y robots de Quay
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    quay_host: "{{ lookup('env', 'QUAY_HOST') }}"
    quay_token: "{{ lookup('env', 'QUAY_TOKEN') }}"
    quay_api: "https://{{ quay_host }}/api/v1"
    validate_certs: "{{ lookup('env', 'QUAY_VALIDATE_CERTS') | default(true, true) }}"

    # El "que" de este playbook: lo unico que se edita al anadir un dominio.
    #
    # UNA ORGANIZACION POR ENTORNO. La separación es de SEGURIDAD, no cosmética:
    # el robot que publica en dev no tiene ninguna credencial sobre prod, así que
    # un CI comprometido en desarrollo no puede alterar la imagen que corre en
    # producción. Con una sola organización compartida, un único token con
    # permiso de escritura alcanzaría todos los entornos.
    #
    # La promoción entre entornos NO se hace reconstruyendo: se copia el
    # manifiesto entre organizaciones (skopeo copy), de modo que el digest se
    # conserva y lo que se valida en test es exactamente lo que corre en prod.
    #
    # Los repositorios y robots son iguales en las cuatro; lo que cambia es quién
    # tiene permiso de escritura:
    #   dev / test   -> el CI publica (pusher con write)
    #   prod / conti -> NADIE publica desde CI: la imagen llega SOLO por promoción
    #                   con una credencial aparte, fuera del alcance del pipeline
    #                   de build. Por eso su pusher es 'read'.
    organizations:
      - name: company-dev
        email: plataforma+dev@example.com
        repositories: &repos_workshop
          # Una sola imagen para todos los escenarios: los tres servicios (demo,
          # canary v1/v2 y circuit-breaker) ejecutan el mismo binario y solo se
          # distinguen por las variables de entorno que les inyecta su Deployment.
          - name: app-workshop
            description: Imagen del servicio de ejemplo del taller
            visibility: private
        robots:
          - name: puller
            description: Cuenta de solo lectura para descargar imágenes
            permission: read
          - name: pusher
            description: Cuenta del pipeline de CI para publicar imágenes
            permission: write
      - name: company-test
        email: plataforma+test@example.com
        repositories: *repos_workshop
        robots:
          - name: puller
            description: Cuenta de solo lectura para descargar imágenes
            permission: read
          - name: pusher
            description: Cuenta del pipeline de CI para publicar imágenes
            permission: write
      - name: company-prod
        email: plataforma+prod@example.com
        repositories: *repos_workshop
        robots:
          - name: puller
            description: Cuenta de solo lectura para descargar imágenes
            permission: read
          # Solo lectura a propósito: a prod se llega promocionando, no publicando.
          - name: pusher
            description: Sin escritura desde CI; la imagen llega por promoción
            permission: read
      - name: company-contingencia
        email: plataforma+contingencia@example.com
        repositories: *repos_workshop
        robots:
          - name: puller
            description: Cuenta de solo lectura para descargar imágenes
            permission: read
          # Igual que prod: el sitio de contingencia sirve lo ya promocionado.
          - name: pusher
            description: Sin escritura desde CI; la imagen llega por promoción
            permission: read

  tasks:
    - name: Comprobar que hay credenciales
      ansible.builtin.assert:
        that:
          - quay_host | length > 0
          - quay_token | length > 0
        fail_msg: >-
          Faltan QUAY_HOST o QUAY_TOKEN en el entorno. Exportalos antes de
          ejecutar; nunca los escribas en este fichero.

    # Se consulta antes de crear en lugar de aceptar el 400 de "ya existe": así el
    # playbook informa de lo que cambia de verdad, y un 400 por payload inválido
    # (nombre ilegal, email duplicado) falla en vez de pasar desapercibido.
    - name: Comprobar si la organizacion ya existe
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200, 404]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: orgs_existentes
      loop: "{{ organizations }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Crear la organizacion
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/"
        method: POST
        headers:
          Authorization: "Bearer {{ quay_token }}"
        body_format: json
        body:
          name: "{{ item.item.name }}"
          email: "{{ item.item.email }}"
        status_code: [201]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      when: item.status == 404
      loop: "{{ orgs_existentes.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Comprobar que repositorios existen
      ansible.builtin.uri:
        url: "{{ quay_api }}/repository/{{ item.0.name }}/{{ item.1.name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200, 404]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: repos_existentes
      loop: "{{ organizations | subelements('repositories') }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1.name }}"

    - name: Crear los repositorios de cada organizacion
      ansible.builtin.uri:
        url: "{{ quay_api }}/repository"
        method: POST
        headers:
          Authorization: "Bearer {{ quay_token }}"
        body_format: json
        body:
          namespace: "{{ item.item.0.name }}"
          repository: "{{ item.item.1.name }}"
          description: "{{ item.item.1.description }}"
          visibility: "{{ item.item.1.visibility }}"
          repo_kind: image
        status_code: [201]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      when: item.status == 404
      loop: "{{ repos_existentes.results }}"
      loop_control:
        label: "{{ item.item.0.name }}/{{ item.item.1.name }}"

    - name: Comprobar que cuentas robot existen
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.0.name }}/robots/{{ item.1.name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200, 400, 404]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: robots_existentes
      loop: "{{ organizations | subelements('robots') }}"
      loop_control:
        label: "{{ item.0.name }}+{{ item.1.name }}"

    - name: Crear las cuentas robot
      ansible.builtin.uri:
        url: "{{ quay_api }}/organization/{{ item.item.0.name }}/robots/{{ item.item.1.name }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ quay_token }}"
        body_format: json
        body:
          description: "{{ item.item.1.description }}"
        status_code: [201]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      when: item.status != 200
      loop: "{{ robots_existentes.results }}"
      loop_control:
        label: "{{ item.item.0.name }}+{{ item.item.1.name }}"

    # Da a cada robot su permiso sobre CADA repositorio de su organizacion. Se
    # recorre (org, repo) con subelements y, dentro, se itera cada robot de esa org
    # con include_tasks. Antes se usaba repositories[0] (solo el primer repo): con
    # 2+ repos, los robots quedaban sin permiso sobre el resto silenciosamente.
    - name: Asignar permisos de robots por repositorio
      ansible.builtin.include_tasks: robot-permissions.yml
      loop: "{{ organizations | subelements('repositories') }}"
      loop_control:
        loop_var: org_repo
        label: "{{ org_repo.0.name }}/{{ org_repo.1.name }}"

    - name: Recordar como se obtiene el token del robot
      ansible.builtin.debug:
        msg: >-
          Organizaciones y robots listos. El token de cada robot se consulta en
          la consola de Quay (o con GET
          /api/v1/organization/<org>/robots/<robot>) y se guarda como pull
          secret en el cluster. Nunca se versiona en Git.
