---
# Espejado de las herramientas del CI en la organizacion <org_prefix>-tooling.
#
# POR QUE EXISTE: el pipeline consume semgrep/syft/gitleaks SIEMPRE desde el
# registro propio, nunca desde Docker Hub ni ghcr.io en tiempo de build: asi el
# CI no depende de la disponibilidad (ni de los rate limits) de un registro
# ajeno y lo que se ejecuta es exactamente lo que se espejo y escaneo. skopeo
# conserva el digest del manifiesto: el espejo es la MISMA imagen, no un rebuild.
#
# Idempotente: se pregunta por el tag EXACTO fijado en platform-vars y solo se
# copia si falta (primer arranque o subida de version). Requiere skopeo en el
# host que ejecuta el playbook.
#
# CREDENCIALES: como el resto de playbooks de Quay, del entorno, nunca de Git.
#
#   export QUAY_HOST=<host-de-quay>
#   export QUAY_TOKEN=<token-oauth>
#   ansible-playbook quay/ansible/mirror-tooling.yml

- name: Espejar las herramientas del CI en Quay
  hosts: localhost
  connection: local
  gather_facts: false

  # El "qué" (prefijo, herramientas, versiones) vive en vars/platform-vars.yml:
  # UN solo fichero de datos para todos los playbooks; aquí solo hay iteración.
  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    quay_host: "{{ lookup('env', 'QUAY_HOST') }}"
    quay_token: "{{ lookup('env', 'QUAY_TOKEN') }}"
    quay_api: "https://{{ quay_host }}/api/v1"
    validate_certs: "{{ lookup('env', 'QUAY_VALIDATE_CERTS') | default(true, true) }}"
    tooling_org: "{{ org_prefix }}-tooling"

  tasks:
    - name: Comprobar que hay credenciales
      ansible.builtin.assert:
        that:
          - quay_host | length > 0
          - quay_token | length > 0
        fail_msg: Faltan QUAY_HOST o QUAY_TOKEN en el entorno.

    # Solo se acepta 200: un 404 significa que el repositorio no existe y hay que
    # ejecutar antes organizations.yml. Fallar aqui es deliberado: si se dejara
    # empujar, Quay autocrearia el repositorio con otra visibilidad y otro dueño
    # que los declarados, y esa deriva pasaria desapercibida.
    - name: Comprobar si el tag ya esta espejado
      ansible.builtin.uri:
        url: "{{ quay_api }}/repository/{{ tooling_org }}/{{ item.name }}/tag/?specificTag={{ item.tag }}&onlyActiveTags=true"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: tags_existentes
      loop: "{{ tooling_repositories }}"
      loop_control:
        label: "{{ tooling_org }}/{{ item.name }}:{{ item.tag }}"

    # QUE EL TAG EXISTA NO BASTA. El tag es un apunte en la base de datos de
    # Quay; los BLOBS viven en el object storage. Si el almacenamiento cambia
    # (p. ej. migrar de NooBaa a S3), la base conserva los tags pero el bucket
    # nuevo esta vacio: el registro cree tener la imagen y todo pull muere con
    # un 500. Por eso la comprobacion real es pedir el MANIFIESTO, que es lo
    # unico que obliga a tocar el almacenamiento de verdad.
    - name: Comprobar que el manifiesto se puede leer de verdad
      ansible.builtin.command:
        argv:
          - skopeo
          - inspect
          # Misma plataforma que el espejado: comprobar la variante del host
          # daria un falso negativo desde un portatil arm64.
          - "--override-os=linux"
          - "--override-arch=amd64"
          - "--creds=$oauthtoken:{{ quay_token }}"
          - "--tls-verify={{ validate_certs | bool | string | lower }}"
          - "docker://{{ quay_host }}/{{ tooling_org }}/{{ item.item.name }}:{{ item.item.tag }}"
      register: manifiestos
      changed_when: false
      # Un fallo aqui NO es un error: significa "hay que espejar".
      failed_when: false
      when: item.json.tags | length > 0
      loop: "{{ tags_existentes.results }}"
      loop_control:
        label: "{{ tooling_org }}/{{ item.item.name }}:{{ item.item.tag }}"
      no_log: true

    # $oauthtoken es el usuario reservado de Quay para autenticar con un token
    # OAuth; con argv no hay shell y el literal viaja intacto. no_log porque el
    # token va en la linea de comandos.
    #
    # Se espeja si falta el tag O si el manifiesto no se puede leer (blobs
    # huerfanos tras un cambio de almacenamiento): ambos casos significan que la
    # imagen NO esta realmente servible.
    - name: Espejar la herramienta que falte o no sea legible
      ansible.builtin.command:
        argv:
          - skopeo
          - copy
          # Se fija la plataforma DESTINO, no la del host que ejecuta el
          # playbook: desde un portatil arm64 (macOS) skopeo elegiria esa
          # variante del manifest list y espejaria una imagen que los nodos del
          # cluster —linux/amd64— no pueden ejecutar.
          - "--override-os=linux"
          - "--override-arch=amd64"
          - "--dest-creds=$oauthtoken:{{ quay_token }}"
          - "--dest-tls-verify={{ validate_certs | bool | string | lower }}"
          - "docker://{{ item.0.item.source }}:{{ item.0.item.tag }}"
          - "docker://{{ quay_host }}/{{ tooling_org }}/{{ item.0.item.name }}:{{ item.0.item.tag }}"
      changed_when: true
      when: item.0.json.tags | length == 0 or item.1.rc | default(1) != 0
      loop: "{{ tags_existentes.results | zip(manifiestos.results) | list }}"
      loop_control:
        label: "{{ item.0.item.source }}:{{ item.0.item.tag }}"
      no_log: true
