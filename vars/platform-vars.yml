# Datos de PLATAFORMA compartidos por los playbooks de producto (quay, keycloak,
# acs) — el ÚNICO sitio donde un adoptante cambia su prefijo de organizaciones,
# sus ambientes y su inventario de aplicaciones. SIN credenciales: las
# credenciales van SIEMPRE por variables de entorno (ver cada playbook).
#
# Este fichero SÍ se versiona: describe el modelo (el "qué"), no un cluster
# concreto. Lo específico de los clusters (dominios, API, tokens) vive en
# bootstrap/ansible/clusters.yml, que está en .gitignore.
#
# Los playbooks lo cargan con vars_files e ITERAN sobre estos datos: añadir un
# ambiente o una aplicación es añadir una entrada aquí, nunca tocar un playbook.

# Prefijo de las organizaciones del registro (…-dev, …-test, …-prod, …-contingencia,
# …-tooling). Un adoptante lo sustituye por el suyo AQUÍ y reejecuta los playbooks.
# OJO: los overlays de Kustomize y los defaults de los pipelines llevan el prefijo
# literal (Argo no lee variables): ver docs/adopcion-cliente.md para la lista.
org_prefix: company

# Dominio de los correos administrativos de las organizaciones del registro.
org_email_domain: example.com

# Los AMBIENTES del modelo y su gobierno en el registro. ci_push decide el
# permiso del robot pusher: true = el CI publica (write); false = NADIE publica
# desde CI (read) y la imagen llega SOLO por promoción con credencial aparte.
environments:
  - name: dev
    ci_push: true
    quota_bytes: 53687091200
    # auto-prune por ANTIGÜEDAD: se conserva todo lo publicado en este plazo.
    prune_keep_since: 4w
  - name: test
    ci_push: true
    quota_bytes: 53687091200
    prune_keep_since: 12w
  - name: prod
    ci_push: false
    quota_bytes: 107374182400
    # Más histórico: es de donde se revierte y la evidencia de lo firmado.
    prune_keep_since: 52w
  - name: contingencia
    ci_push: false
    quota_bytes: 107374182400
    # Igual que prod: debe poder servir cualquier versión que prod sirva.
    prune_keep_since: 52w

# Repositorios de imagen de las APLICACIONES: los mismos en todas las
# organizaciones de ambiente (la promoción copia org→org sin renombrar) y los
# mismos nombres que usan los overlays del repo de configuración de aplicaciones.
image_repositories:
  - name: demo-service
    description: Imagen del servicio de ejemplo del taller
    visibility: private
  - name: api-service
    description: Imagen del servicio REST del taller
    visibility: private
  - name: kafka-audit-pipeline
    description: Pipeline de logs de auditoría sobre Kafka (descifra, enmascara y entrega)
    visibility: private
  # Su código NO viaja en la imagen de producción: es un artefacto aparte a propósito.
  - name: kafka-audit-demo-producer
    description: Generador de datos ficticios del pipeline de auditoría (solo dev y test)
    visibility: private
  - name: kafka-audit-producer-dotnet
    description: Host de ejemplo del paquete .NET que cifra y publica eventos de auditoría
    visibility: private

# Herramientas de CI espejadas desde upstream (excepción documentada a la norma
# "solo Red Hat": no existe imagen Red Hat de semgrep, syft ni gitleaks). El
# espejado lo hace quay/ansible/mirror-tooling.yml (skopeo) con el tag fijado
# AQUÍ: subir de versión = cambiar el tag y reejecutar, nunca editar un playbook.
# OJO: los defaults de workshop-pipelines/gitops llevan el tag literal (Tekton
# no lee estas vars): al subir de versión hay que cambiarlos a la vez.
#
# PRIVADOS a propósito aunque sean OSS: con FEATURE_ANONYMOUS_ACCESS en false
# (criterio de banca: nada de lectura anónima en el registro) la vía auditable
# es el robot puller de tooling — solo lectura y solo esta organización —
# fusionado en el pull secret del CI por quay/ansible/pull-secrets.yml.
tooling_repositories:
  - name: semgrep
    description: SAST del CI, espejo de docker.io/semgrep/semgrep
    visibility: private
    source: docker.io/semgrep/semgrep
    tag: "1.79.0"
  - name: syft
    description: Generador de SBOM del CI, espejo de docker.io/anchore/syft
    visibility: private
    source: docker.io/anchore/syft
    tag: v1.19.0
  - name: gitleaks
    description: Detector de secretos del CI, espejo de ghcr.io/gitleaks/gitleaks
    visibility: private
    source: ghcr.io/gitleaks/gitleaks
    tag: v8.29.1

# Namespaces donde corre el CI y el ambiente con cuyo robot publican. Publican
# con quay-push-credentials; el pull secret se lo entrega la Policy de ACM como a
# cualquier namespace de negocio.
#
# SOLO el namespace donde CORRE el pipeline, en el HUB. Los namespaces donde
# únicamente se DESPLIEGA no se listan aquí: la Policy de ACM
# require-registry-pull-secret los descubre sola y replica la credencial a cada
# cluster. Añadir un servicio nuevo no exige tocar este fichero.
ci_namespaces:
  - namespace: workshop-demo-dev
    environment: dev

# Cuota y retención de la organización tooling (pocos tags, poco volumen;
# se referencian por tag fijado: conservar largo plazo).
tooling_quota_bytes: 10737418240
tooling_prune_keep_since: 52w

# DÓNDE GUARDA QUAY LOS BLOBS. No cambia el registro (Quay sigue siendo Quay):
# cambia la capa de almacenamiento que hay debajo.
#
#   s3     — object storage nativo de la nube. Es el DEFAULT y lo correcto en
#            AWS: durabilidad y escalado del proveedor, sin piezas intermedias.
#            El QuayRegistry pasa a `objectstorage: managed: false` y el bundle
#            lleva DISTRIBUTED_STORAGE_CONFIG apuntando al bucket.
#   noobaa — MCG/NooBaa emulando S3 sobre un PVC. Es el camino para clusters SIN
#            object storage de nube (bare-metal / on-premise, caso muy real en
#            banca). Red Hat lo documenta como de "disponibilidad limitada".
#
# POR QUÉ EL DEFAULT ES s3, con evidencia: con noobaa sobre un PVC de 50Gi, el
# push del CI fallaba con `blob upload invalid` porque NooBaa respondía
# NOT_ENOUGH_SPACE ("Couldn't allocate chunk") teniendo 49Gi libres al 1% de
# uso — su contabilidad interna se corrompía al reiniciarse el pod del
# backingstore (ciclo ALL_NODES_OFFLINE → Rejected → OPTIMAL). Un intermediario
# más que puede caerse entre el CI y el registro.
quay_storage_backend: s3

# Bucket de S3 para los blobs (solo si quay_storage_backend es s3). Vacío = se
# deriva del nombre de infraestructura del cluster, que es único por instalación
# y evita colisiones en el espacio de nombres global de S3.
quay_s3_bucket: ""

# Bucket de S3 para las MÉTRICAS de la observabilidad multi-cluster. Vacío = se
# deriva igual que el anterior.
#
# Es un bucket DISTINTO del de imágenes a propósito: métricas e imágenes tienen
# ciclos de vida y retenciones que no coinciden, y separarlos permite aplicar
# políticas de retención a uno sin tocar el otro. Comparten backend porque la
# decisión de dónde vive el object storage es una sola (quay_storage_backend).
observability_s3_bucket: ""

# Realm de Keycloak del modelo. Cambiarlo aquí NO basta: el KeycloakRealmImport
# (keycloak/gitops/base) y los issuerUrl de los overlays llevan el nombre
# literal — ver docs/adopcion-cliente.md.
keycloak_realm: workshop

# Clientes machine-to-machine del realm: uno por servicio expuesto por el
# gateway cuya AuthPolicy exige JWT. Añadir un servicio = añadir una entrada.
keycloak_clients:
  - id: demo-service
    displayName: Servicio de ejemplo
    # Flujo máquina-a-máquina: la aplicación pide el token con su propio identificador y secreto.
    service_account: true
    publicAccess: false
  - id: canary-service
    displayName: Servicio canary (canary deployment)
    service_account: true
    publicAccess: false
  - id: circuit-breaker-service
    displayName: Servicio circuit breaker
    service_account: true
    publicAccess: false
