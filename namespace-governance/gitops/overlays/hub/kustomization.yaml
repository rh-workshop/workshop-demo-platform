# Overlay del HUB: trae toda la base/, incluidos los namespaces exclusivos del
# hub (Quay, ACS, Developer Hub, Pipelines, workshop-demo-dev) y el subconjunto
# workload/ compartido con los spokes. Los spokes usan overlays/<rol>, que
# referencia solo base/workload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
