# Overlay del HUB: hoy todo el gobierno aplica al hub (los namespaces de los
# spokes los distribuyen las políticas de ACM). Si un día los spokes necesitan
# cuotas o RBAC propios, se añade un overlay dev/prod que recorte la base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
