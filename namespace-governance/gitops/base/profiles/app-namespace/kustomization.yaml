# Perfil de namespace de APLICACIÓN: el juego completo de gobierno que recibe
# todo namespace de negocio (dev). No fija namespace: lo pone quien lo consume
# (namespaces/<ns>/kustomization.yaml) con el transformer namespace:.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # La pareja ResourceQuota + LimitRange NO está aquí: la imponen las Policies
  # require-resourcequota y require-limitrange de ACM. Es una regla transversal
  # ("todo namespace de negocio debe tener cuota y defaults"), y como tal alcanza
  # también a los namespaces que aún no existen — un Kustomize solo alcanza los
  # que enumera. Declararla además aquí crearía dos dueños del mismo objeto.
  # RBAC por GRUPO (nunca usuarios): admin, developer y viewer.
  - platform-admins-rolebinding.yaml
  - app-developers-rolebinding.yaml
  - platform-viewers-rolebinding.yaml
  # Aislamiento de red (modelo cerrado): mismo namespace + gateway compartido
  # + monitoring + routers; todo lo demás queda denegado.
  - allow-same-namespace-networkpolicy.yaml
  - allow-from-platform-gateway-networkpolicy.yaml
  - allow-from-monitoring-networkpolicy.yaml
  - allow-from-openshift-ingress-networkpolicy.yaml
