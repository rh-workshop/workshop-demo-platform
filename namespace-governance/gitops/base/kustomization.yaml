# Base del gobierno de namespaces: UN DIRECTORIO POR NAMESPACE gobernado.
# Cada directorio consume un perfil compartido (profiles/) y declara SOLO sus
# desviaciones; para saber qué gobierna un namespace se abre su directorio.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Namespaces de aplicaciones (perfil app-namespace, sin desviaciones).
  - namespaces/workshop-demo-dev
  - namespaces/canary-demo-dev
  - namespaces/bluegreen-demo-dev
  - namespaces/circuit-breaker-demo-dev
  - namespaces/api-demo-dev
  # Namespaces de plataforma (perfil platform-namespace + desviaciones).
  - namespaces/quay-enterprise
  - namespaces/stackrox
  - namespaces/developer-hub
  - namespaces/openshift-pipelines
  - namespaces/kuadrant-system
  - namespaces/platform-gateway
