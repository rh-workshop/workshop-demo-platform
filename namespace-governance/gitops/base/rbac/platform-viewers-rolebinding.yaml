# Perfil VIEWER (auditoría / soporte de primera línea): solo lectura en todos
# los namespaces gobernados. Grupo genérico mapeable a Entra/LDAP.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-viewers
  namespace: quay-enterprise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: platform-viewers
