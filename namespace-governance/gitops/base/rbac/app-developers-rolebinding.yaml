# Perfil APP DEVELOPER: despliega (edit) en los namespaces de aplicaciones y
# puede LEER el gateway compartido y Kuadrant para depurar su exposición, sin
# poder tocarlos. Grupo genérico: el cluster real mapeará su grupo de
# Entra/LDAP equivalente.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-developers-edit
  namespace: workshop-demo-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: app-developers
---
