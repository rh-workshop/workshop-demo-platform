# Perfil PLATFORM ADMIN: administra los namespaces de plataforma y de
# aplicaciones (admin permite gestionar RBAC local, cuotas no: esas son de
# este componente). Se otorga a un GRUPO, nunca a usuarios sueltos: el cluster
# real mapeará aquí su grupo de Entra/LDAP (p. ej. vía claim de grupos del IdP).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-admins
  namespace: quay-enterprise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: platform-admins
---
