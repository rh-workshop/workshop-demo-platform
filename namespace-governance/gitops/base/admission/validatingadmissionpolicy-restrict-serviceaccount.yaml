# Impide que una carga de trabajo se ejecute con la cuenta del CI.
#
# EL PROBLEMA QUE RESUELVE. El Role app-developer-no-secrets niega `secrets` a
# proposito, pero concede `pods` y `pods/exec`. En el mismo namespace vive el SA
# `pipeline`, que SI lee secretos (tiene el ClusterRole `edit` por
# openshift-pipelines-edit) y en cuyo namespace estan las credenciales del CI:
# git-credentials, pac-git-token, argocd-env-secret, cosign-signing-key,
# quay-push-credentials, quay-promotion-credentials y acs-pipeline-credentials.
#
# Con ambos permisos, negar `secrets` no protege nada: basta crear un Deployment
# con `serviceAccountName: pipeline`, entrar con `oc rsh` y leer desde dentro lo
# que el rol niega desde fuera. La cuenta de un desarrollador acaba con la llave
# de firma de imagenes y con un token de escritura a Git — y de ahi a produccion,
# saltandose release-managers y las ventanas de sincronizacion.
#
# POR QUE UNA VALIDATINGADMISSIONPOLICY Y NO MAS RBAC. RBAC autoriza el verbo
# sobre el recurso; no sabe expresar "puedes crear pods, pero no CON esta
# identidad". El campo `serviceAccountName` solo se puede inspeccionar en
# admision. Es nativa del apiserver (CEL, sin webhook que mantener ni que pueda
# caerse) y esta en v1 desde 1.30.
#
# ALCANCE. Solo la cuenta `pipeline`, y solo fuera de un TaskRun. Es la unica
# del namespace que lee secretos: `builder` -- la que usan de hecho los 32
# PipelineRun de aqui -- y `deployer` no los leen. Un pod sin
# `serviceAccountName` usa `default` y no le afecta. Lo que se cierra es la
# usurpacion de la identidad, no la ejecucion del CI.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: restrict-ci-serviceaccount
  labels:
    app.kubernetes.io/part-of: namespace-governance
spec:
  # Fail: si la politica no se puede evaluar, se rechaza. Un control de seguridad
  # que se salta ante un error propio no es un control.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: sa
      expression: "object.spec.serviceAccountName"
    # Los pods que crea Tekton para un TaskRun llevan esta etiqueta; los pone el
    # controlador, no quien envia el manifiesto. Un pod escrito a mano no la
    # tiene, y es esa diferencia la que separa la ejecucion legitima del CI de la
    # usurpacion de su identidad.
    - name: esTaskRun
      expression: "has(object.metadata.labels) && 'tekton.dev/taskRun' in object.metadata.labels"
  validations:
    # Solo `pipeline`: es la UNICA cuenta del namespace que lee secretos
    # (ClusterRole edit via openshift-pipelines-edit). `builder` y `deployer` no
    # los leen -- verificado -- y `builder` es justamente la que usan los 32
    # PipelineRun que corren aqui: incluirla dejaria el CI sin poder ejecutarse.
    - expression: "variables.sa != 'pipeline' || variables.esTaskRun"
      reason: Forbidden
      messageExpression: >-
        'no se permite ejecutar cargas con la cuenta ' + variables.sa + ': lee los
        secretos del namespace (firma de imagenes, registro y Git). Solo Tekton
        puede usarla, en los pods que crea para un TaskRun. Usa la cuenta default
        o una propia de la aplicacion.'
---
# El binding fija DONDE aplica. Se excluye openshift-pipelines: es donde corren
# los PipelineRun legitimos, que si deben usar la cuenta del CI.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: restrict-ci-serviceaccount
  labels:
    app.kubernetes.io/part-of: namespace-governance
spec:
  policyName: restrict-ci-serviceaccount
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        # Los namespaces del propio Tekton y del plano de control quedan fuera:
        # ahi la cuenta del CI es la identidad correcta, no una usurpacion.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - openshift-pipelines
            - openshift-operators
            - openshift-gitops
