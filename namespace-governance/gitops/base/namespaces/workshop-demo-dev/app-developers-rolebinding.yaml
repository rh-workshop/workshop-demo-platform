# Sustituye al `app-developers-edit` del perfil: mismo grupo, Role acotado sin secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-developers-no-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-developer-no-secrets
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: app-developers
