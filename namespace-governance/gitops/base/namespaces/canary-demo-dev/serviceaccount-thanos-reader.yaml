# Identidad con la que el análisis del canary consulta las métricas.
#
# El Thanos Querier de OpenShift NO es un Prometheus abierto: exige un Bearer
# token y comprueba con SubjectAccessReview que quien pregunta tenga permiso de
# lectura. Sin esto responde 403, el AnalysisRun falla y —con failureLimit: 1—
# aborta TODO despliegue canary, aunque la aplicación esté perfectamente sana.
#
# Se necesitan tres piezas: la identidad (este ServiceAccount), el permiso
# (ClusterRoleBinding a cluster-monitoring-view, el rol de solo lectura que ya
# trae OpenShift) y el token (un Secret de tipo service-account-token, que el
# propio cluster rellena).
#
# POR QUÉ VIVE AQUÍ Y NO EN EL REPO DE APLICACIONES: un ClusterRoleBinding es de
# ámbito de cluster y quien puede crear uno puede enlazar cluster-admin a una
# ServiceAccount propia. Declararlo desde workshop-demo-app-config obligaba a
# abrir ClusterRoleBinding (y Secret) en el AppProject workshop-platform, y eso
# convertía cualquier commit del repo de aplicaciones en cluster-admin efectivo.
# El RBAC de ámbito de cluster es gobierno de plataforma: vive en este repo, en
# el proyecto workshop-multicluster, junto al resto del RBAC por namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-reader
---
# Permiso de SOLO LECTURA sobre las métricas del cluster. cluster-monitoring-view
# es un ClusterRole que ya existe en OpenShift: no se define uno propio.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  # El nombre lleva el namespace porque un ClusterRoleBinding es global: dos ambientes no pueden compartirlo.
  name: canary-thanos-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
  - kind: ServiceAccount
    name: thanos-reader
    # El namespace lo fija el kustomization de este directorio (namespace: canary-demo-dev).
    namespace: canary-demo-dev
---
# Token de larga duración del ServiceAccount. El CONTENIDO no está en Git: al
# declarar el tipo y la anotación, es el propio cluster quien genera y rellena el
# campo `token`. Argo lo sincroniza vacío y el controlador lo completa.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-querier-token
  annotations:
    kubernetes.io/service-account.name: thanos-reader
type: kubernetes.io/service-account-token
