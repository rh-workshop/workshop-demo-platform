# LimitRange de los namespaces de aplicaciones: inyecta defaults a los
# contenedores sin resources (pods de pipeline, sidecars) para que la cuota no
# bloquee ningún despliegue. El límite por defecto de 2Gi da margen a los pasos
# de build (buildah) que corren en workshop-demo-dev.
apiVersion: v1
kind: LimitRange
metadata:
  name: default-limits
  namespace: workshop-demo-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 25m
        memory: 64Mi
      default:
        cpu: "1"
        memory: 2Gi
