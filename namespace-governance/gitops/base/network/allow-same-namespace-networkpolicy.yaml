# Aislamiento de los namespaces de aplicaciones (primera NetworkPolicy del
# cluster): en cuanto existe una policy que selecciona los pods, todo lo no
# permitido queda denegado. Esta permite el tráfico DENTRO del namespace
# (fortio -> servicios, sidecars, pods de pipeline).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: workshop-demo-dev canary-demo-dev bluegreen-demo-dev circuit-breaker-demo-dev api-demo-dev
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
