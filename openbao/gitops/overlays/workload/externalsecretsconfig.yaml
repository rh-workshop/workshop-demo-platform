# La instancia del controlador de ESO en un cluster de carga.
#
# El OPERADOR lo instala la OperatorPolicy de ACM; esto es el OPERANDO: sin él nadie
# atiende los ClusterSecretStore ni los ExternalSecret de este cluster.
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  annotations:
    # El CRD lo instala la OperatorPolicy, no este sync: sin esto el dry-run del arranque en frio invalida la Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  # El nombre es fijo: el operador solo reconcilia la instancia llamada `cluster`.
  name: cluster
spec: {}
