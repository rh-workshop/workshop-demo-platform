# Salida de ESO hacia el almacen, que vive en OTRO cluster.
#
# POR QUE HACE FALTA. El operador de ESO instala una politica `deny-all-traffic` que corta
# todo su egress. En el hub basta permitir el namespace del almacen, porque esta al lado;
# aqui el almacen esta fuera del cluster, asi que hay que permitir la salida a Internet
# por HTTPS. Sin esta regla el ClusterSecretStore falla con "context deadline exceeded" y
# ningun secreto se sincroniza.
#
# ALCANCE. Se limita al puerto 443 y se excluyen los rangos privados que no son el destino,
# para no abrir la salida entera. En la instalacion del cliente, donde el almacen es
# corporativo y tiene direccion conocida, este bloque se acota a esa IP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-openbao-remoto
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  policyTypes:
    - Egress
  egress:
    # Sin `except` de rangos privados: la salida atraviesa la red del nodo, asi que
    # excluirlos cortaba el trafico antes de llegar a Internet. Se acota por PUERTO.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
