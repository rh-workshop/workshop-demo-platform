# El puente hacia el almacen, que vive en el cluster de GESTION.
#
# Un solo almacen para todos los ambientes: centralizarlo es lo que permite gobernar en
# un sitio quien guarda que. Por eso el `server` no es un Service local (no existe aqui)
# sino la direccion publicada del hub, sobre HTTPS.
#
# AUTENTICACION. Por token, que es lo que admite el modo de arranque. En produccion se
# usa el auth de Kubernetes del almacen: la credencial es EFIMERA y no hay token estatico
# que rotar ni custodiar.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: platform-vault
spec:
  provider:
    vault:
      # Direccion publicada del almacen en el hub. La fija el overlay del ambiente.
      server: https://CHANGE_ME_OPENBAO_HOST
      # KV version 2: guarda historico de cada secreto, asi se ve que cambio y se puede volver atras.
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-token
          key: token
          # El token vive en el namespace del almacen, no repartido por ahi.
          namespace: openbao
