# Permite que External Secrets alcance el almacen.
#
# POR QUE HACE FALTA. El operador de ESO aplica en su namespace una politica
# `eso-sys-deny-all-traffic` que corta TODO el egress, y solo abre DNS y el API
# server. Con eso el controlador no puede hablar con ningun almacen: el
# ClusterSecretStore queda en `InvalidProviderConfig: unable to validate store` y
# los ExternalSecret en `could not get secret data from provider` — mensajes que
# no mencionan la red y despistan al diagnosticar.
#
# Es un endurecimiento deliberado del operador, no un defecto: obliga a declarar
# explicitamente hacia donde puede salir. Esta politica es esa declaracion.
#
# ALCANCE MINIMO: se abre la ENTRADA al almacen desde el namespace de ESO y solo
# al puerto 8200. No se toca el deny-all de ESO —que sigue protegiendo su
# egress— porque en OpenShift con OVN basta con que el destino admita la entrada.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-secrets-ingress
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
  ingress:
    # El router de OpenShift: atiende la Route por la que entran los ExternalSecret de los
    # clusters de carga, que no pueden alcanzar el Service interno desde fuera.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8200
    - from:
        # El namespace del controlador de ESO local. Nadie mas habla con el almacen:
        # el resto del trafico sigue denegado.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 8200
---
# Trafico ENTRE REPLICAS: Raft usa el 8201 para replicar y elegir lider, y el
# 8200 para reenviar peticiones al nodo activo. Sin esta regla las tres replicas
# arrancan pero no forman cluster, y el almacen queda sin quorum.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-raft-peer-traffic
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbao
      ports:
        - protocol: TCP
          port: 8200
        - protocol: TCP
          port: 8201
    # Resolucion DNS: sin ella una replica no encuentra a las otras por nombre.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
