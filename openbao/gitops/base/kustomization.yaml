# OpenBao: almacen de secretos de la plataforma + su puente con External Secrets.
#
# El ClusterSecretStore y el controlador de ESO NO estan aqui: viven en
# openbao-store/gitops/, que se despliega en TODOS los clusters (el hub y los de
# carga). Este directorio es solo el ALMACEN, que existe una unica vez.
#
# El Secret `openbao-dev-token` tampoco esta aqui: aunque en modo dev no custodia nada
# sensible, versionar un token sienta un precedente que no debe existir en este
# repo. Lo genera el playbook openbao/ansible/bootstrap.yml junto con la carga
# inicial de secretos.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - service.yaml
  # Entrada desde los clusters de carga: sus ExternalSecret viven fuera de este cluster.
  - route.yaml
  # Permite la ENTRADA desde el namespace de ESO. La regla de SALIDA vive en
  # openbao-store, porque hace falta en CADA cluster y no solo aqui.
  - networkpolicy.yaml
  - statefulset.yaml
