# Expone el almacen para los clusters de carga.
#
# POR QUE HACE FALTA. El ClusterSecretStore de cada spoke lee del almacen que
# vive en el hub, y un Service solo es visible dentro de su propio cluster: sin
# esta Route, los ExternalSecret de dev/test/prod fallan con un timeout de red.
#
# TLS DE EXTREMO A EXTREMO, no negociable: por aqui viaja el token de acceso al
# almacen y los propios secretos. `edge` termina el TLS en el router y reenvia en
# claro dentro del cluster; se usa `edge` y no `passthrough` porque el modo dev
# de OpenBao no sirve TLS propio — es una de las razones por las que esta
# instancia esta marcada como NO-PRODUCCION.
#
# EN PRODUCCION el almacen es EXTERNO al cluster (el Key Vault corporativo del
# cliente) y esta Route no existe: los clusters salen hacia el, no al reves.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openbao
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
spec:
  to:
    kind: Service
    name: openbao
  port:
    targetPort: https
  tls:
    # REENCRYPT, no edge. Con edge el router descifra y habla al pod en CLARO:
    # ahora el almacen solo escucha TLS, asi que edge falla la conexion al
    # backend -- y aunque funcionara, los secretos viajarian sin cifrar dentro
    # del cluster. destinationCACertificate lleva la CA interna (workshop-ca)
    # que firma el certificado del almacen: el router no la conoce de serie y
    # sin ella rechaza el backend por certificado desconocido.
    termination: reencrypt
    destinationCACertificate: |
      -----BEGIN CERTIFICATE-----
      MIIBcDCCARagAwIBAgIUW516I94bsoJxWbelOQtvdGksHsowCgYIKoZIzj0EAwIw
      FjEUMBIGA1UEAxMLd29ya3Nob3AtY2EwHhcNMjYwOTAyMTQ0NDU4WhcNMzYwODMw
      MTQ0NDU4WjAWMRQwEgYDVQQDEwt3b3Jrc2hvcC1jYTBZMBMGByqGSM49AgEGCCqG
      SM49AwEHA0IABIYobNFsC4fN4U/b2Sjacr672bztjp+XeZEyng2UR/J+t/meXxDs
      iyr0iGFdrdpREt99cUs9cdSoQhVGd328HxWjQjBAMA4GA1UdDwEB/wQEAwICpDAP
      BgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBRKd5UaBg7buNuA6WZVVgD2g5xNQDAK
      BggqhkjOPQQDAgNIADBFAiEA850iNQoLkr+FaM8+lfOGBoEtGQkc5lICHHBb9+F2
      XosCIA0IcFsWfViVrHzQY/jUn0dQ4wP1CwTReeVIIsvaF8de
      -----END CERTIFICATE-----
    # Nadie debe hablar con el almacen en claro, ni siquiera por error.
    insecureEdgeTerminationPolicy: Redirect
