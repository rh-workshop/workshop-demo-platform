# Instancia del controlador de External Secrets.
#
# EL OPERADOR NO BASTA. La OperatorPolicy de ACM instala el operador, pero ese
# solo observa este CR: es este objeto el que despliega el CONTROLADOR que
# realmente lee del almacen y materializa los Secret. Sin el, los
# ClusterSecretStore y ExternalSecret se crean pero nadie los atiende — quedan
# sin estado, que es justo lo que despista al diagnosticar.
#
# Es el mismo patron que el resto de productos del repo: el operador lo instala
# ACM, y el CR de configuracion lo gobierna Argo desde Git.
apiVersion: operator.openshift.io/v1alpha1
kind: ExternalSecretsConfig
metadata:
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  # El nombre es fijo: el operador solo reconcilia la instancia llamada `cluster`.
  name: cluster
spec: {}
