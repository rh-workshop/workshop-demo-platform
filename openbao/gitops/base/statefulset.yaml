# OpenBao: el almacen de secretos de la plataforma.
#
# QUE ES. El fork open source de HashiCorp Vault, bajo la Linux Foundation, tras
# el cambio de Vault a licencia BUSL. Misma API y mismos conceptos.
#
# QUE PAPEL CUMPLE. Guarda los secretos que siembran los playbooks de cada
# producto. External Secrets los lee de aqui y los materializa como Secret en el
# cluster que los necesita, de modo que en Git solo vive el ExternalSecret — que
# dice DE DONDE leer, nunca el valor. Es lo que permite que Argo gobierne
# tambien los secretos.
#
# UN SOLO ALMACEN, EN EL HUB. Los spokes NO llevan su propia instancia: leen de
# esta por su Route, con un token acotado a su entorno (politica
# eso-read-<entorno>). Una instancia por cluster serian cinco almacenes
# desconectados, cinco inicializaciones y cinco desellados.
#
# ################## MODO PRODUCCION ##################
#
# ALMACENAMIENTO RAFT, NO MEMORIA. El almacen persiste en disco (PVC por replica)
# y replica por Raft entre las tres. Lo que hace falta para un almacen de
# secretos de verdad:
#
#   - Los secretos SOBREVIVEN al reinicio del pod. Con `inmem` se perdian en cada
#     reinicio y habia que reejecutar el bootstrap entero.
#   - Tolera la caida de UNA replica sin perder quorum (3 nodos, quorum 2). Con
#     una sola replica, un reinicio dejaba sin secretos a los cinco clusters.
#   - El estado es auditable y respaldable (snapshot de Raft).
#
# ARRANCA SELLADO. No hay token raiz conocido ni desellado automatico: tras el
# primer despliegue hay que inicializar y desellar con las claves de Shamir, que
# se reparten entre custodios distintos. Ese es el procedimiento del playbook
# openbao/ansible/bootstrap.yml, y es deliberado que exija intervencion: un
# almacen que se desella solo no protege de quien tenga acceso al cluster.
#
# TLS. La comunicacion entre replicas y con los clientes va cifrada con el
# certificado que emite cert-manager (secret `openbao-tls`), no en claro.
#
# DEPENDENCIA CIRCULAR. El almacen vive dentro del cluster que necesita secretos.
# No bloquea porque ningun secreto de este almacen hace falta para levantar Argo
# ni ACM — entran despues. Si algun dia lo hiciera, el almacen tendria que salir
# del cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: workshop-gitops
data:
  # La configuracion del servidor. `bao server -config` la lee al arrancar; sin
  # ella el binario exige -dev y arranca en memoria.
  config.hcl: |
    ui = true

    # Escucha TLS. El certificado lo emite cert-manager y lo monta el pod; sin
    # TLS los secretos viajarian en claro por la red del cluster.
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/openbao/tls/tls.crt"
      tls_key_file  = "/openbao/tls/tls.key"
    }

    # Raft: almacenamiento integrado y replicado. `node_id` sale del nombre del
    # pod, que en un StatefulSet es estable (openbao-0, -1, -2) y sobrevive al
    # reprogramado -- por eso un StatefulSet y no un Deployment.
    storage "raft" {
      path    = "/openbao/data"
      node_id = "NODE_ID"

      # leader_ca_cert_file es OBLIGATORIO con TLS. Al unirse al cluster, el
      # proceso SERVIDOR no usa BAO_CACERT -- esa variable es del cliente `bao` --
      # asi que sin esto el join falla con "x509: certificate signed by unknown
      # authority" y las replicas 1 y 2 nunca forman quorum. El sintoma engana:
      # los tres pods arrancan y solo openbao-0 aparece como peer.
      retry_join {
        leader_api_addr       = "https://openbao-0.openbao-internal.openbao.svc.cluster.local:8200"
        leader_tls_servername = "openbao-0.openbao-internal.openbao.svc.cluster.local"
        leader_ca_cert_file   = "/openbao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr       = "https://openbao-1.openbao-internal.openbao.svc.cluster.local:8200"
        leader_tls_servername = "openbao-1.openbao-internal.openbao.svc.cluster.local"
        leader_ca_cert_file   = "/openbao/tls/ca.crt"
      }
      retry_join {
        leader_api_addr       = "https://openbao-2.openbao-internal.openbao.svc.cluster.local:8200"
        leader_tls_servername = "openbao-2.openbao-internal.openbao.svc.cluster.local"
        leader_ca_cert_file   = "/openbao/tls/ca.crt"
      }
    }

    # Direcciones con las que cada replica se anuncia al resto del cluster Raft.
    # FQDN COMPLETO, no el nombre corto: `openbao-0.openbao-internal` depende del
    # `search` de /etc/resolv.conf y en el arranque devuelve NXDOMAIN, con lo que
    # el join muere en "TLS handshake timeout" -- un sintoma que parece de
    # certificados y es de resolucion de nombres.
    api_addr     = "https://POD_NAME.openbao-internal.openbao.svc.cluster.local:8200"
    cluster_addr = "https://POD_NAME.openbao-internal.openbao.svc.cluster.local:8201"

    # El almacen ETIQUETA SUS PROPIOS PODS con su estado (active / standby /
    # sealed / initialized) y marca como NO-LISTO al que este sellado o en
    # standby. El Service deja de enrutarle sin que haga falta un probe que
    # adivine ese estado desde fuera.
    #
    # Importa sobre todo tras un reinicio: las replicas arrancan SELLADAS, y sin
    # esto el Service podria mandar peticiones a una replica que no puede
    # responderlas. Requiere que el ServiceAccount pueda parchear su propio pod
    # (Role openbao-service-registration).
    service_registration "kubernetes" {}

    # Sin telemetria a un colector externo: las metricas se exponen en /v1/sys/metrics
    # y las recoge Prometheus del cluster.
    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname          = true
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: openbao
  annotations:
    # `serviceName` y `volumeClaimTemplates` son INMUTABLES: pasar de la version
    # en memoria (sin PVC, Service `openbao`) a esta obliga a recrear el objeto,
    # y un `apply` normal falla con "updates to statefulset spec [...] are
    # forbidden". Replace=true hace que Argo borre y recree en vez de parchear.
    #
    # Los PVC NO se borran con el StatefulSet: quedan y se reasocian por nombre
    # (data-openbao-0...), asi que el estado de Raft sobrevive a este reemplazo.
    #
    # Force=true es IMPRESCINDIBLE junto a Replace: `Replace` por si solo hace un
    # `kubectl replace`, que sigue siendo un update y vuelve a chocar con los
    # campos inmutables ("updates to statefulset spec [...] are forbidden"). Con
    # Force, Argo borra y recrea. Sin ambos, el sync de TODA la Application queda
    # bloqueado reintentando el StatefulSet.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
  labels:
    app.kubernetes.io/name: openbao
    app.kubernetes.io/part-of: workshop-gitops
spec:
  # El Service headless: da a cada replica un nombre DNS estable
  # (openbao-0.openbao-internal), que es como se encuentran entre si en Raft.
  serviceName: openbao-internal
  replicas: 3
  # Parallel, NO OrderedReady. Con OrderedReady hay un bloqueo circular al
  # arrancar en frio: openbao-0 nace SELLADO, asi que nunca pasa a Ready; el
  # StatefulSet no crea openbao-1 ni -2 hasta que lo este; y openbao-0 no
  # encuentra a nadie con quien formar quorum, asi que su `retry_join` agota los
  # intentos y el proceso termina. El resultado es un pod reiniciandose en bucle
  # y un cluster que no llega a existir.
  #
  # Arrancar en paralelo no compite por formar el cluster: la inicializacion
  # (`bao operator init`) es un paso MANUAL posterior, y hasta entonces las tres
  # replicas solo se buscan entre si.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao
    spec:
      serviceAccountName: openbao
      # Reparte las replicas entre nodos distintos: tres replicas en el mismo
      # nodo no toleran la caida de ese nodo, que es justo lo que evitan.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: openbao
              topologyKey: kubernetes.io/hostname
      # Al parar, da tiempo a ceder el liderazgo Raft antes de que muera el proceso.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: tls
          secret:
            secretName: openbao-tls
        - name: home
          emptyDir: {}
      containers:
        - name: openbao
          # Imagen oficial del proyecto, fijada por version: un tag movil haria
          # que el almacen cambie de version en un reinicio sin que nadie lo decida.
          image: ghcr.io/openbao/openbao:2.6.1
          # La config lleva el node_id resuelto desde el nombre del pod: el
          # fichero del ConfigMap es igual para las tres y cada una escribe el suyo.
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -e "s/NODE_ID/${POD_NAME}/g" -e "s/POD_NAME/${POD_NAME}/g" \
                /openbao/config/config.hcl > /tmp/config.hcl
              exec bao server -config=/tmp/config.hcl
          ports:
            - name: https
              containerPort: 8200
            - name: cluster
              containerPort: 8201
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # service_registration los exige para saber QUE pod debe etiquetar.
            - name: BAO_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BAO_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BAO_ADDR
              value: https://127.0.0.1:8200
            # El certificado lo firma una CA propia del cluster; sin esto el
            # propio binario no se fia de su vecino al unirse al cluster Raft.
            - name: BAO_CACERT
              value: /openbao/tls/ca.crt
            # La imagen declara HOME=/home/openbao, pero OpenShift ejecuta el
            # contenedor con un UID ALEATORIO que no tiene ese directorio: el
            # binario cae a `/`, que es de solo lectura. Hay que montar algo
            # escribible en la ruta que la imagen espera.
            - name: HOME
              value: /home/openbao
          volumeMounts:
            - name: config
              mountPath: /openbao/config
            - name: tls
              mountPath: /openbao/tls
            - name: data
              mountPath: /openbao/data
            - name: home
              mountPath: /home/openbao
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          # SELLADO NO ES NO-LISTO PARA EL READINESS DEL POD, pero SI para el
          # Service: un almacen sellado responde a la API y no entrega secretos.
          # 501 = sellado, 503 = en standby, 200 = activo y desellado.
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          # STARTUP PROBE POR TCP, no por HTTP. Mientras el almacen esta sellado
          # y buscando quorum, /v1/sys/health no siempre responde -- y un probe
          # HTTP que no obtiene respuesta acaba matando el proceso con SIGKILL
          # (exit 137) justo al agotar failureThreshold. Comprobar que el puerto
          # ACEPTA es la senal correcta en esta fase: el proceso vive y escucha,
          # aunque todavia no pueda servir secretos.
          # 60 x 5s = hasta 5 minutos para arrancar y unirse al cluster Raft.
          startupProbe:
            tcpSocket:
              port: https
            failureThreshold: 60
            periodSeconds: 5
          # El liveness tambien va por TCP: un almacen SELLADO esta sano, solo
          # espera sus claves. Un liveness HTTP lo reiniciaria en bucle tras
          # cualquier reinicio, porque las replicas arrancan selladas por diseno.
          # Lo que debe detectar es un proceso muerto o colgado, no uno sellado.
          livenessProbe:
            tcpSocket:
              port: https
            failureThreshold: 6
            periodSeconds: 30
  # Un disco POR REPLICA. Es lo que convierte el almacen en persistente: el
  # StatefulSet reasocia cada PVC a su replica aunque el pod se reprograme.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
