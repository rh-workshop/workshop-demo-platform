---
# Arranque del almacen de secretos: token de acceso y carga inicial.
#
# POR QUE ES UN PLAYBOOK. Dos cosas que no pueden ir por Argo:
#   1. El TOKEN con el que External Secrets se autentica. Aunque en modo dev no
#      custodie nada sensible, versionar un token sienta un precedente que este
#      repo no debe tener.
#   2. Los VALORES de los secretos. Casi todos se obtienen consultando una API
#      externa (tokens de robot de Quay, llaves de S3): no existen hasta que
#      alguien los pide, asi que no hay nada que declarar en Git.
#
# ESTO NO CAMBIA CON EL PROVEEDOR. Con Azure Key Vault seguiria haciendo falta un
# paso que genere el valor y lo deposite; ESO cambia DONDE se guarda y COMO se
# entrega, no quien lo crea.
#
# RECARGA TRAS UN REINICIO. En modo dev el estado vive en memoria: si el pod se
# reinicia, el almacen queda vacio. Este playbook es idempotente y reejecutable —
# esa es la fricción que se acepta a cambio de no tener que desellar a mano.
#
#   ansible-playbook openbao/ansible/bootstrap.yml
- name: Arrancar el almacen de secretos y cargar los valores iniciales
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [openbao, secrets]

  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    openbao_namespace: openbao
    # Nombre que referencian el StatefulSet y el ClusterSecretStore.
    token_secret: openbao-dev-token

  tasks:
    # El token se genera UNA vez y se conserva: regenerarlo en cada ejecucion
    # invalidaria el ClusterSecretStore y dejaria todos los ExternalSecret
    # fallando hasta el siguiente sync.
    - name: Comprobar si el token del almacen ya existe
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ openbao_namespace }}"
        name: "{{ token_secret }}"
      register: token_actual

    - name: Generar el token del almacen si falta
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ token_secret }}"
            namespace: "{{ openbao_namespace }}"
          stringData:
            token: "{{ lookup('password', '/dev/null length=32 chars=hexdigits') | lower }}"
      when: token_actual.resources | length == 0
      no_log: true

    # El pod solo esta listo cuando responde su health: hasta entonces no admite
    # escrituras. El namespace y el StatefulSet los crea Argo.
    - name: Esperar a que el almacen responda
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ openbao_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=openbao
        field_selectors:
          - status.phase=Running
      register: bao_pod
      until: >-
        bao_pod.resources | length > 0 and
        (bao_pod.resources[0].status.containerStatuses | default([{}]))[0].ready | default(false)
      retries: 60
      delay: 10

    - name: Recuperar el token para hablar con el almacen
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ openbao_namespace }}"
        name: "{{ token_secret }}"
      register: token_info
      no_log: true

    - name: Fijar los datos de acceso
      ansible.builtin.set_fact:
        bao_token: "{{ token_info.resources[0].data.token | b64decode }}"
        bao_pod_name: "{{ bao_pod.resources[0].metadata.name }}"
      no_log: true

    # COPIA PARA ACM. Los hub templates de una Policy solo pueden leer secretos
    # del namespace `open-cluster-management`; sin esta copia, la Policy
    # require-vault-token no puede replicar el token a los clusters de carga y
    # falla con "the namespace argument is restricted to open-cluster-management".
    - name: Publicar el token donde ACM puede leerlo
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ token_secret }}"
            namespace: open-cluster-management
          stringData:
            token: "{{ bao_token }}"
      no_log: true

    # SEGMENTACION POR ENTORNO. Sin esto hay UN solo token con acceso a todo el
    # arbol `secret/platform/`: el que se replica a dev lee tambien
    # keycloak/db-prod, quay/pull-prod y el superuser de Quay. Un entorno de
    # desarrollo no debe poder leer las credenciales de produccion, y en un banco
    # eso no es una recomendacion.
    #
    # El corte es por RUTA: cada entorno recibe una policy que solo abre lo suyo,
    # y un token emitido con esa policy. La convencion de nombres ya lo permitia
    # (db-dev, pull-prod, kafka-audit/test...) — lo que faltaba era la policy.
    #
    # `quay/superuser` y `quay/admin-token` quedan FUERA de toda policy de
    # entorno: son credenciales de administracion del registro, no las consume
    # ningun ExternalSecret, y las usa el playbook de Quay con el token raiz.
    #
    # Esto es independiente del backend: la misma particion se traslada tal cual a
    # Azure Key Vault, donde cada entorno recibe su propio Key Vault o su propio
    # conjunto de secretos con una identidad distinta.
    - name: Declarar una policy de lectura por entorno
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN={{ bao_token }}
            sh -c 'cat <<POLICY | bao policy write eso-read-{{ item }} -

            path "secret/data/platform/keycloak/db-{{ item }}" { capabilities = ["read"] }

            path "secret/data/platform/quay/pull-{{ item }}" { capabilities = ["read"] }

            path "secret/data/platform/kafka-audit/{{ item }}" { capabilities = ["read"] }

            path "secret/metadata/platform/*" { capabilities = ["list"] }

            POLICY'
      loop: [hub, dev, test, prod, contingencia]
      changed_when: true
      no_log: true

    # El hub ademas lee lo que no es de un entorno concreto: la configuracion de
    # object storage de la observabilidad de ACM, que es unica para la flota.
    - name: Ampliar la policy del hub con los secretos de flota
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN={{ bao_token }}
            sh -c 'cat <<POLICY | bao policy write eso-read-hub -

            path "secret/data/platform/keycloak/db-hub" { capabilities = ["read"] }

            path "secret/data/platform/observability" { capabilities = ["read"] }

            path "secret/data/platform/quay/pull-*" { capabilities = ["read"] }

            path "secret/metadata/platform/*" { capabilities = ["list"] }

            POLICY'
      changed_when: true
      no_log: true

    # Un token POR ENTORNO, con su policy. Periodico y renovable: ESO lo renueva
    # solo mientras siga vivo, y deja de servir si el entorno se retira.
    - name: Emitir el token de ESO de cada entorno
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN={{ bao_token }}
            bao token create -policy=eso-read-{{ item }} -period=720h
            -display-name=eso-{{ item }} -format=json
      loop: [dev, test, prod, contingencia]
      register: tokens_entorno
      changed_when: true
      no_log: true

    # Cada token viaja al namespace del cluster que le corresponde. La Policy de
    # ACM require-vault-token lo replica desde ahi al spoke.
    - name: Publicar el token de cada entorno para ACM
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "openbao-token-{{ item.item }}"
            namespace: open-cluster-management
          stringData:
            token: "{{ (item.stdout | from_json).auth.client_token }}"
      loop: "{{ tokens_entorno.results }}"
      no_log: true

    # El token del HUB va al namespace del almacen: alli lo lee su propio
    # ClusterSecretStore, sin pasar por la Policy de ACM (que replica a spokes).
    - name: Emitir y publicar el token de ESO del hub
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=http://127.0.0.1:8200 BAO_TOKEN={{ bao_token }}
            bao token create -policy=eso-read-hub -period=720h
            -display-name=eso-hub -format=json
      register: token_hub
      changed_when: true
      no_log: true

    - name: Publicar el token del hub para su ClusterSecretStore
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openbao-eso-token-hub
            namespace: "{{ openbao_namespace }}"
          stringData:
            token: "{{ (token_hub.stdout | from_json).auth.client_token }}"
      no_log: true

    # AQUI NO SE CARGA NINGUN SECRETO, y es deliberado: cada playbook de producto
    # deposita LO SUYO en el almacen, porque es quien sabe componer ese valor
    # (acm/ansible/observability.yml consulta las credenciales del object storage,
    # los de quay/ansible/ hablan con la API del registro). Centralizar la carga
    # aqui obligaria a este playbook a conocer todos los productos, y a
    # reejecutarlo entero para actualizar uno solo.
    #
    # Lo unico que hace este playbook es dejar el almacen LISTO para recibirlos.
    - name: Informar del estado del almacen
      ansible.builtin.debug:
        msg: >-
          Almacen listo en openbao/openbao.svc:8200. El ClusterSecretStore
          `platform-vault` lo expone a los ExternalSecret de cualquier namespace,
          y sus valores nunca pasan por Git. OJO: en modo dev el estado vive en
          MEMORIA — si el pod se reinicia, reejecuta este playbook.
