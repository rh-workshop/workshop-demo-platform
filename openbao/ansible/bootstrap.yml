---
# Arranque del almacen de secretos: inicializacion, politicas y tokens.
#
# POR QUE ES UN PLAYBOOK. Tres cosas que no pueden ir por Argo:
#   1. La INICIALIZACION del almacen. Genera las claves de desello, que no pueden
#      vivir en Git ni en el cluster: son lo que protege el almacen de quien
#      tenga acceso al cluster.
#   2. Los TOKENS con los que External Secrets se autentica. Un token en Git es
#      un secreto en Git.
#   3. Los VALORES de los secretos. Casi todos se obtienen consultando una API
#      externa (tokens de robot de Quay, llaves de S3): no existen hasta que
#      alguien los pide, asi que no hay nada que declarar en Git.
#
# EL ALMACEN ARRANCA SELLADO. Tras un despliegue nuevo hay que inicializarlo y
# desellar CADA replica con 3 de las 5 claves de Shamir. Es intencionadamente
# manual: un almacen que se desella solo no protege de nada, porque las claves
# tendrian que estar donde el proceso pueda leerlas.
#
# TRAS UN REINICIO el almacen vuelve a estar SELLADO, pero NO vacio: el estado
# persiste en Raft (PVC por replica). Solo hay que desellar, no recargar.
#
#   export BAO_OPERATOR_TOKEN='<token raiz o de operador>'
#   ansible-playbook openbao/ansible/bootstrap.yml
- name: Arrancar el almacen de secretos y cargar los valores iniciales
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [openbao, secrets]

  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    openbao_namespace: openbao
    # Reparto de las claves de desello: hacen falta 3 de 5 para abrir el almacen.
    # Ninguna persona sola puede desellarlo, y se tolera perder dos claves.
    shamir_shares: 5
    shamir_threshold: 3

  tasks:
    # INICIALIZACION. Ocurre UNA sola vez en la vida del almacen: crea el estado
    # en Raft, genera las claves de Shamir y el token raiz. Reejecutarla sobre un
    # almacen ya inicializado devuelve 400 y no destruye nada — por eso se
    # comprueba antes en vez de asumir.
    #
    # ESTE PLAYBOOK NO CUSTODIA LAS CLAVES. Las imprime una vez y es
    # responsabilidad de los custodios guardarlas fuera del cluster (gestor de
    # contrasenas corporativo, sobres sellados). Guardarlas en un Secret del
    # mismo cluster anularia el sellado: quien tuviera acceso al cluster tendria
    # las claves y el almacen dejaria de proteger de nada.
    - name: Comprobar si el almacen ya esta inicializado
      ansible.builtin.command:
        argv: [oc, exec, -n, "{{ openbao_namespace }}", openbao-0, --, sh, -c,
               "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt bao status -format=json"]
      register: estado_inicial
      changed_when: false
      failed_when: false

    - name: Inicializar el almacen si es la primera vez
      ansible.builtin.command:
        argv: [oc, exec, -n, "{{ openbao_namespace }}", openbao-0, --, sh, -c,
               "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt bao operator init -key-shares={{ shamir_shares }} -key-threshold={{ shamir_threshold }} -format=json"]
      register: init_out
      when: not (estado_inicial.stdout | default('{}') | from_json).get('initialized', false)
      no_log: true

    - name: Mostrar las claves UNA sola vez para su custodia
      ansible.builtin.debug:
        msg: >-
          GUARDA ESTO AHORA, NO SE VUELVE A MOSTRAR. Claves de desello:
          {{ (init_out.stdout | from_json).unseal_keys_b64 | join(' | ') }}
          -- Token raiz: {{ (init_out.stdout | from_json).root_token }}
          -- Repartelas entre {{ shamir_shares }} custodios distintos; hacen falta
          {{ shamir_threshold }} para desellar. El token raiz se usa para el
          arranque y despues se REVOCA (bao token revoke -self).
      when: init_out is not skipped

    # DESELLADO. Cada replica arranca sellada y necesita `shamir_threshold`
    # claves. Es intencionadamente manual: automatizarlo con las claves en el
    # cluster equivaldria a no sellar.
    - name: Comprobar si el almacen esta sellado
      ansible.builtin.command:
        argv: [oc, exec, -n, "{{ openbao_namespace }}", openbao-0, --, sh, -c,
               "BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt bao status -format=json"]
      register: estado_sello
      changed_when: false
      failed_when: false

    - name: Parar si el almacen esta sellado
      ansible.builtin.fail:
        msg: >-
          El almacen esta SELLADO. Desellalo antes de seguir, en CADA replica
          (openbao-0, -1, -2), con {{ shamir_threshold }} claves distintas:
            oc exec -n {{ openbao_namespace }} openbao-N -- sh -c
            'BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt bao operator unseal'
          Repite el comando una vez por clave. Despues reejecuta este playbook.
      when: (estado_sello.stdout | default('{"sealed":true}') | from_json).get('sealed', true)

    # El token raiz NO se versiona ni se guarda en el cluster: lo aporta quien
    # ejecuta el playbook, por variable de entorno, y solo vive en esta ejecucion.
    - name: Exigir el token de operacion
      ansible.builtin.fail:
        msg: >-
          Falta el token de operacion. Exportalo antes de ejecutar:
            export BAO_OPERATOR_TOKEN='<token raiz o de un operador con permisos>'
          No se guarda en ningun Secret: el almacen ya no tiene un token conocido.
      when: lookup('env', 'BAO_OPERATOR_TOKEN') | length == 0

    # El pod solo esta listo cuando responde su health: hasta entonces no admite
    # escrituras. El namespace y el StatefulSet los crea Argo.
    - name: Esperar a que el almacen responda
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ openbao_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=openbao
        field_selectors:
          - status.phase=Running
      register: bao_pod
      until: >-
        bao_pod.resources | length > 0 and
        (bao_pod.resources[0].status.containerStatuses | default([{}]))[0].ready | default(false)
      retries: 60
      delay: 10

    - name: Fijar los datos de acceso
      ansible.builtin.set_fact:
        # Del ENTORNO, no de un Secret: el almacen ya no tiene un token conocido
        # y guardarlo en el cluster reintroduciria lo que el sellado evita.
        bao_token: "{{ lookup('env', 'BAO_OPERATOR_TOKEN') }}"
        bao_pod_name: "{{ bao_pod.resources[0].metadata.name }}"
      no_log: true

    # El token de OPERACION no se copia a ningun sitio. Lo que ACM replica a los
    # spokes son los tokens POR ENTORNO que se emiten mas abajo, cada uno con su
    # politica de solo lectura acotada.

    # SEGMENTACION POR ENTORNO. Sin esto hay UN solo token con acceso a todo el
    # arbol `secret/platform/`: el que se replica a dev lee tambien
    # keycloak/db-prod, quay/pull-prod y el superuser de Quay. Un entorno de
    # desarrollo no debe poder leer las credenciales de produccion, y en un banco
    # eso no es una recomendacion.
    #
    # El corte es por RUTA: cada entorno recibe una policy que solo abre lo suyo,
    # y un token emitido con esa policy. La convencion de nombres ya lo permitia
    # (db-dev, pull-prod, kafka-audit/test...) — lo que faltaba era la policy.
    #
    # `quay/superuser` y `quay/admin-token` quedan FUERA de toda policy de
    # entorno: son credenciales de administracion del registro, no las consume
    # ningun ExternalSecret, y las usa el playbook de Quay con el token raiz.
    #
    # Esto es independiente del backend: la misma particion se traslada tal cual a
    # Azure Key Vault, donde cada entorno recibe su propio Key Vault o su propio
    # conjunto de secretos con una identidad distinta.
    - name: Declarar una policy de lectura por entorno
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt BAO_TOKEN={{ bao_token }}
            sh -c 'cat <<POLICY | bao policy write eso-read-{{ item }} -

            path "secret/data/platform/keycloak/db-{{ item }}" { capabilities = ["read"] }

            path "secret/data/platform/quay/pull-{{ item }}" { capabilities = ["read"] }

            path "secret/data/platform/kafka-audit/{{ item }}" { capabilities = ["read"] }

            path "secret/metadata/platform/*" { capabilities = ["list"] }

            POLICY'
      loop: [hub, dev, test, prod, contingencia]
      changed_when: true
      no_log: true

    # El hub ademas lee lo que no es de un entorno concreto: la configuracion de
    # object storage de la observabilidad de ACM, que es unica para la flota, y
    # todas las pull credentials de Quay, porque los ExternalSecret de los cinco
    # entornos se resuelven AQUI.
    #
    # `keycloak/db-dev` es una desviacion consciente: el Keycloak que corre en el
    # hub consume esa ruta, no `db-hub`. Se abre la ruta concreta en vez de un
    # comodin `db-*`, que le daria tambien las credenciales de produccion.
    - name: Ampliar la policy del hub con los secretos de flota
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt BAO_TOKEN={{ bao_token }}
            sh -c 'cat <<POLICY | bao policy write eso-read-hub -

            path "secret/data/platform/keycloak/db-hub" { capabilities = ["read"] }

            path "secret/data/platform/keycloak/db-dev" { capabilities = ["read"] }

            path "secret/data/platform/observability" { capabilities = ["read"] }

            path "secret/data/platform/quay/pull-*" { capabilities = ["read"] }

            path "secret/metadata/platform/*" { capabilities = ["list"] }

            POLICY'
      changed_when: true
      no_log: true

    # Un token POR ENTORNO, con su policy. Periodico y renovable: ESO lo renueva
    # solo mientras siga vivo, y deja de servir si el entorno se retira.
    - name: Emitir el token de ESO de cada entorno
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt BAO_TOKEN={{ bao_token }}
            bao token create -policy=eso-read-{{ item }} -period=720h
            -display-name=eso-{{ item }} -format=json
      loop: [dev, test, prod, contingencia]
      register: tokens_entorno
      changed_when: true
      no_log: true

    # Cada token viaja al namespace del cluster que le corresponde. La Policy de
    # ACM require-vault-token lo replica desde ahi al spoke.
    - name: Publicar el token de cada entorno para ACM
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "openbao-token-{{ item.item }}"
            namespace: open-cluster-management
          stringData:
            token: "{{ (item.stdout | from_json).auth.client_token }}"
      loop: "{{ tokens_entorno.results }}"
      no_log: true

    # El token del HUB va al namespace del almacen: alli lo lee su propio
    # ClusterSecretStore, sin pasar por la Policy de ACM (que replica a spokes).
    - name: Emitir y publicar el token de ESO del hub
      ansible.builtin.command:
        argv:
          - oc
          - exec
          - -n
          - "{{ openbao_namespace }}"
          - "{{ bao_pod_name }}"
          - --
          - sh
          - -c
          - >-
            BAO_ADDR=https://127.0.0.1:8200 BAO_CACERT=/openbao/tls/ca.crt BAO_TOKEN={{ bao_token }}
            bao token create -policy=eso-read-hub -period=720h
            -display-name=eso-hub -format=json
      register: token_hub
      changed_when: true
      no_log: true

    - name: Publicar el token del hub para su ClusterSecretStore
      kubernetes.core.k8s:
        state: present
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: openbao-eso-token-hub
            namespace: "{{ openbao_namespace }}"
          stringData:
            token: "{{ (token_hub.stdout | from_json).auth.client_token }}"
      no_log: true

    # AQUI NO SE CARGA NINGUN SECRETO, y es deliberado: cada playbook de producto
    # deposita LO SUYO en el almacen, porque es quien sabe componer ese valor
    # (acm/ansible/observability.yml consulta las credenciales del object storage,
    # los de quay/ansible/ hablan con la API del registro). Centralizar la carga
    # aqui obligaria a este playbook a conocer todos los productos, y a
    # reejecutarlo entero para actualizar uno solo.
    #
    # Lo unico que hace este playbook es dejar el almacen LISTO para recibirlos.
    - name: Informar del estado del almacen
      ansible.builtin.debug:
        msg: >-
          Almacen listo en openbao/openbao.svc:8200. El ClusterSecretStore
          `platform-vault` lo expone a los ExternalSecret de cualquier namespace,
          y sus valores nunca pasan por Git. OJO: en modo dev el estado vive en
          MEMORIA — si el pod se reinicia, reejecuta este playbook.
