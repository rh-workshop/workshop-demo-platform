# Credencial SMTP para el reporte periodico de vulnerabilidades de ACS
# (acs/ansible/integrations.yml, --tags reportes). Sincronizada desde el
# almacen, nunca creada a mano ni versionada — es un secreto real, no config.
#
# NO SE SIEMBRA EN EL BOOTSTRAP. A diferencia del config bundle de Quay, este
# secreto no tiene huevo-gallina: ACS ya esta vivo cuando se ejecuta
# integrations.yml, asi que el propio playbook puede depositarlo en el almacen
# antes de leerlo de vuelta (mismo patron de "crear en frio si falta" que el
# resto de credenciales del producto, no uno especial).
#
# Un adoptante siembra el valor real con:
#   bao kv put -mount=secret platform/acs/smtp username=<usuario> password=<password>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acs-smtp
  namespace: stackrox
  annotations:
    # El CRD lo instala la OperatorPolicy de ACM, no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-vault
    kind: ClusterSecretStore
  target:
    name: acs-smtp
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: platform/acs/smtp
        property: username
    - secretKey: password
      remoteRef:
        key: platform/acs/smtp
        property: password
