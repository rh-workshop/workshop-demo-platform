# SecuredCluster: el agente que vigila un cluster y reporta a Central.
#
# Instala el sensor, el admission controller (puede BLOQUEAR despliegues que
# violen una politica) y el collector (observa el trafico y los procesos con eBPF).
# `centralEndpoint` apunta al Central; cuando Central esta en el mismo cluster, es
# el Service interno.
apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: stackrox
spec:
  clusterName: local-cluster
  centralEndpoint: central.stackrox.svc:443
  admissionControl:
    listenOnCreates: true
    listenOnUpdates: true
    # timeout explicito, no el default implicito del operador. El bloqueo real lo
    # decide enforcementActions de cada SecurityPolicy (ver policies/), aqui solo
    # se garantiza que el admission controller escucha y responde a tiempo.
    timeoutSeconds: 10
  perNode:
    collector:
      # CORE_BPF es el unico modo soportado (EBPF retirado).
      collection: CORE_BPF
  scanner:
    scannerComponent: AutoSense
  # NO-PRODUCCION: clusterName y centralEndpoint valen solo para el hub (Central
  # local). Un spoke necesita el endpoint de la Route de Central + init bundle
  # (Secret via ESO, no en Git). Ver docs/production-outside-the-lab.md.
