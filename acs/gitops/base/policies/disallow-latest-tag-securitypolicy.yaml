# Politica de seguridad de ACS COMO CODIGO (GitOps), no por API.
#
# En ACS 4.11 las politicas SI tienen CRD (SecurityPolicy), reconciliado por el
# config-controller de Central. Por eso van aqui, versionadas y sincronizadas por
# Argo, en vez de por un playbook imperativo. El playbook Ansible queda solo para
# lo que de verdad no tiene CRD (integraciones, informes).
#
# Esta politica prohibe la etiqueta 'latest' (impide saber que version corre).
# enforcementActions declara el bloqueo EXPLICITAMENTE, no depende del default del
# operador: FAIL_BUILD rompe el pipeline en BUILD; SCALE_TO_ZERO bloquea en DEPLOY.
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  annotations:
    # El CRD lo instala ACM (OperatorPolicy), no este sync: sin esto el dry-run del arranque en frio invalida la Application entera.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: disallow-latest-tag
  namespace: stackrox
spec:
  policyName: Prohibir la etiqueta latest
  description: Una imagen con la etiqueta latest no permite saber que version corre ni reproducir un despliegue.
  severity: HIGH_SEVERITY
  categories:
    - Security Best Practices
  lifecycleStages:
    - BUILD
    - DEPLOY
  enforcementActions:
    - FAIL_BUILD_ENFORCEMENT
    - SCALE_TO_ZERO_ENFORCEMENT
  policySections:
    - sectionName: Regla principal
      policyGroups:
        - fieldName: Image Tag
          booleanOperator: OR
          values:
            - value: latest
