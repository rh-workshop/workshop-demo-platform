# El agente de contingencia, que reporta al Central del HUB.
#
# centralEndpoint sale por la Route publica y no por el Service: Central vive en
# otro cluster, y `central.stackrox.svc` solo resuelve dentro del hub.
#
# clusterName es el nombre del ManagedCluster en ACM, no el ambiente: es lo que
# Central muestra en su inventario y debe ser unico en toda la flota.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - configmap-acs-central.yaml
patches:
  - target:
      kind: SecuredCluster
      name: stackrox-secured-cluster-services
    patch: |
      - op: add
        path: /spec/clusterName
        value: cluster-contingencia
      - op: add
        path: /spec/centralEndpoint
        value: CHANGE_ME_CENTRAL_ENDPOINT
      # Fail-closed: si el admission controller no responde, el despliegue se
      # rechaza.
      - op: replace
        path: /spec/admissionControl/failurePolicy
        value: Fail

# El endpoint del hub es un dato del entorno: se inyecta desde el ConfigMap para
# que viva en un solo sitio.
replacements:
  - source:
      kind: ConfigMap
      name: acs-central
      fieldPath: data.endpoint
    targets:
      - select:
          kind: SecuredCluster
          name: stackrox-secured-cluster-services
        fieldPaths:
          - spec.centralEndpoint
