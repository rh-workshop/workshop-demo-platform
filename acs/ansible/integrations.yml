---
# Integraciones de ACS que NO tienen CRD (van por la API REST de Central).
#
# QUE VA POR GITOPS Y QUE NO:
#   - Las POLITICAS de seguridad SI tienen CRD (SecurityPolicy) desde ACS 4.11 y
#     van por Argo (ver acs/gitops/base/policies/). NO se gestionan aqui.
#   - Las INTEGRACIONES con registros/escaneres, las colecciones y los informes
#     de vulnerabilidades solo existen tras la API de Central. Ese es el trabajo
#     de este playbook, y es idempotente.
#
# ESTE PLAYBOOK configura la integracion ACS -> Quay (decision de arquitectura):
# Clair escanea la imagen en el registro (gate al push) y ACS LEE esos resultados
# de Quay en vez de re-escanear. Tipo "Scanner + Registry" con un robot account de
# solo lectura. Asi hay defensa en profundidad y un solo panel, sin escanear dos
# veces la misma imagen. Ver docs/backlog-produccion.md (decisiones de arquitectura).
#
# CREDENCIALES: del entorno, nunca versionadas. El token de API se genera en la
# consola de ACS (Platform Configuration -> Integrations -> API Token, rol Admin).
#
#   export ACS_HOST=<host-de-central>
#   export ACS_TOKEN=<token-de-api>
#   export QUAY_HOST=<host-de-quay>
#   export QUAY_ROBOT_USER=<org+robot>       # robot de solo lectura
#   export QUAY_ROBOT_TOKEN=<token-del-robot>
#   ansible-playbook acs/ansible/integrations.yml

- name: Configurar integraciones de ACS
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    acs_host: "{{ lookup('env', 'ACS_HOST') }}"
    acs_token: "{{ lookup('env', 'ACS_TOKEN') }}"
    acs_api: "https://{{ acs_host }}/v1"
    quay_host: "{{ lookup('env', 'QUAY_HOST') }}"
    quay_robot_user: "{{ lookup('env', 'QUAY_ROBOT_USER') }}"
    quay_robot_token: "{{ lookup('env', 'QUAY_ROBOT_TOKEN') }}"
    # PRODUCCION: verificar SIEMPRE el certificado de Central. false solo es un
    # atajo de lab (MITM sobre el token Admin). Sobreescribible solo explicitamente.
    validate_certs: "{{ lookup('env', 'ACS_VALIDATE_CERTS') | default(true, true) }}"

  tasks:
    - name: Comprobar que hay credenciales
      ansible.builtin.assert:
        that:
          - acs_host | length > 0
          - acs_token | length > 0
          - quay_host | length > 0
          - quay_robot_user | length > 0
          - quay_robot_token | length > 0
        fail_msg: >-
          Faltan ACS_HOST/ACS_TOKEN/QUAY_HOST/QUAY_ROBOT_USER/QUAY_ROBOT_TOKEN en
          el entorno. Exportalos antes de ejecutar; nunca los escribas aqui.

    # Se consulta antes de crear: un POST sobre una integración existente falla, y un
    # PUT sobre su id permite converger endpoint/credenciales si cambian (p. ej. al
    # renombrar el registro). Mismo criterio de idempotencia que organizations.yml.
    - name: Comprobar si la integracion ya existe
      ansible.builtin.uri:
        url: "{{ acs_api }}/imageintegrations"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: integraciones_existentes

    - name: Localizar la integracion quay-company por nombre
      ansible.builtin.set_fact:
        integracion_quay: "{{ integraciones_existentes.json.integrations | selectattr('name', 'equalto', 'quay-company') | list | first | default({}) }}"

    - name: Registrar Quay como Scanner + Registry en ACS
      ansible.builtin.uri:
        # Con id existente se actualiza (PUT); sin él se crea (POST).
        url: "{{ acs_api }}/imageintegrations{{ '/' + integracion_quay.id if integracion_quay else '' }}"
        method: "{{ 'PUT' if integracion_quay else 'POST' }}"
        headers:
          Authorization: "Bearer {{ acs_token }}"
        body_format: json
        body:
          # Sustituir "company" por el nombre de la organización de Quay (el mismo de quay/ansible/organizations.yml).
          name: quay-company
          id: "{{ integracion_quay.id | default(omit) }}"
          type: quay
          categories:
            - REGISTRY
            - SCANNER
          quay:
            endpoint: "https://{{ quay_host }}"
            # robot de SOLO LECTURA; ACS lee imagenes y resultados de Clair
            oauthToken: "{{ quay_robot_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      no_log: true

    # --- Integracion de FIRMA (cosign) ---
    # El ID de una SignatureIntegration lo GENERA Central al crearla: no se puede
    # inventar en Git. Flujo correcto: este playbook la crea (o la encuentra) con
    # la llave publica de cosign y muestra el ID; ese ID se escribe en las dos
    # SecurityPolicy de acs/gitops/base/policies/ (un commit por instalacion) y
    # Argo las reconcilia. Sin este paso las politicas de firma nacen INERTES:
    # referencian una integracion que no existe y no bloquean nada.
    #   export COSIGN_PUBLIC_KEY="$(cat cosign.pub)"   # la MISMA llave del CI
    - name: Comprobar si la integracion de firma ya existe
      ansible.builtin.uri:
        url: "{{ acs_api }}/signatureintegrations"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: firmas_existentes
      when: lookup('env', 'COSIGN_PUBLIC_KEY') | length > 0

    - name: Crear la integracion de firma cosign-workshop si falta
      ansible.builtin.uri:
        url: "{{ acs_api }}/signatureintegrations"
        method: POST
        headers:
          Authorization: "Bearer {{ acs_token }}"
        body_format: json
        body:
          name: cosign-workshop
          cosign:
            publicKeys:
              - name: workshop-ci
                publicKeyPemEnc: "{{ lookup('env', 'COSIGN_PUBLIC_KEY') }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      register: firma_creada
      when: >-
        lookup('env', 'COSIGN_PUBLIC_KEY') | length > 0 and
        (firmas_existentes.json.integrations | default([]) | selectattr('name', 'equalto', 'cosign-workshop') | list | length == 0)

    - name: Mostrar el ID de la integracion de firma (escribirlo en las SecurityPolicy)
      ansible.builtin.debug:
        msg: >-
          SignatureIntegration cosign-workshop id =
          {{ (firma_creada.json.id if (firma_creada is not skipped and firma_creada.json is defined)
             else (firmas_existentes.json.integrations | default([]) | selectattr('name', 'equalto', 'cosign-workshop') | map(attribute='id') | first | default('SIN CREAR: exporta COSIGN_PUBLIC_KEY'))) }}
          — actualizar acs/gitops/base/policies/require-image-signature*.yaml con este valor y commitear.
      when: lookup('env', 'COSIGN_PUBLIC_KEY') | length > 0

    - name: Recordar el resto del ciclo
      ansible.builtin.debug:
        msg: >-
          Integracion ACS->Quay lista. Las politicas de seguridad se gestionan como
          CR SecurityPolicy (acs/gitops/base/policies/), no aqui. Los informes de
          vulnerabilidades se programan en la consola (Vulnerability Management ->
          Reporting) sobre una coleccion; nada de eso se versiona en Git.
