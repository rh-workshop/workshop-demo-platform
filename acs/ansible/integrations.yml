---
# Integraciones de ACS que NO tienen CRD (van por la API REST de Central).
#
# QUE VA POR GITOPS Y QUE NO:
#   - Las POLITICAS de seguridad SI tienen CRD (SecurityPolicy) desde ACS 4.11 y
#     van por Argo (ver acs/gitops/base/policies/)... con UNA excepcion: las dos
#     de firma referencian el ID de la SignatureIntegration, que lo genera
#     Central en cada instalacion, asi que las aplica ESTE playbook con el ID
#     real inyectado (acs/ansible/policies/).
#   - Las INTEGRACIONES con registros/escaneres, las colecciones y los informes
#     de vulnerabilidades solo existen tras la API de Central. Ese es el trabajo
#     de este playbook, y es idempotente.
#
# ESTE PLAYBOOK configura la integracion ACS -> Quay: UNA image integration por
# organizacion del registro (los robots de Quay no cruzan organizaciones), cada
# una con su robot acs-scanner de SOLO LECTURA que crea organizations.yml. Solo
# categoria REGISTRY: la categoria SCANNER (leer resultados de Clair) exigiria
# un token OAuth de Quay que hoy solo existe como admin — contra el menor
# privilegio; el escaneo lo hace el scanner propio de ACS con esta credencial.
#
# CREDENCIALES: del entorno, nunca versionadas. El token de API se genera en la
# consola de ACS (Platform Configuration -> Integrations -> API Token, rol Admin).
# El token admin de Quay sale del secreto de dia-0 quay-enterprise/quay-admin-token
# (lo persiste bootstrap.yml) y SOLO se usa para consultar los tokens de los robots.
#
#   export ACS_HOST=<host-de-central>
#   export ACS_TOKEN=<token-de-api>
#   ansible-playbook acs/ansible/integrations.yml

- name: Configurar integraciones de ACS
  hosts: localhost
  connection: local
  gather_facts: false

  # El "qué" (prefijo, ambientes, namespaces de CI) vive en vars/platform-vars.yml;
  # el inventario del entorno aporta base_domain (mismo patrón que bootstrap.yml).
  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"
    - "{{ lookup('first_found', [playbook_dir ~ '/../../bootstrap/ansible/clusters.yml', playbook_dir ~ '/../../bootstrap/ansible/clusters.example.yml'], errors='ignore') }}"

  vars:
    # Raíz del repo, para las SecurityPolicy de firma que aplica este playbook (no Argo).
    repo_root: "{{ playbook_dir }}/../.."
    # Fallback si no hay inventario: se sustituye en clusters.yml o con -e.
    base_domain: CHANGE_ME_BASE_DOMAIN
    # Hostname del registro derivado del inventario (misma regla que bootstrap.yml); QUAY_HOST lo pisa.
    quay_host: "{{ lookup('env', 'QUAY_HOST') | default('company-quay-quay-quay-enterprise.' ~ base_domain, true) }}"
    # Verificación TLS hacia Quay, separada de la de Central (certificados distintos).
    quay_validate_certs: "{{ lookup('env', 'QUAY_VALIDATE_CERTS') | default(true, true) }}"
    # Una integración POR organización del registro: ambientes + tooling.
    orgs_registro: "{{ (environments | map(attribute='name') | list + ['tooling']) | map('regex_replace', '^', org_prefix ~ '-') | list }}"
    # Nombre de la integración de firma: parametrizable; el ID lo genera Central.
    firma_nombre: "{{ org_prefix }}-pipeline-cosign"
    # Las dos políticas que referencian esa integración y su nombre en Central (para verificarlas).
    politicas_firma:
      - file: "{{ repo_root }}/acs/ansible/policies/require-image-signature-securitypolicy.yaml"
        nombre: Exigir firma cosign verificada
      - file: "{{ repo_root }}/acs/ansible/policies/require-image-signature-deploy-securitypolicy.yaml"
        nombre: Exigir firma cosign verificada en el despliegue
    acs_host: "{{ lookup('env', 'ACS_HOST') }}"
    acs_token: "{{ lookup('env', 'ACS_TOKEN') }}"
    acs_api: "https://{{ acs_host }}/v1"
    # PRODUCCION: verificar SIEMPRE el certificado de Central. false solo es un
    # atajo de lab (MITM sobre el token Admin). Sobreescribible solo explicitamente.
    validate_certs: "{{ lookup('env', 'ACS_VALIDATE_CERTS') | default(true, true) }}"

  tasks:
    # always: tambien con --tags firma hace falta la credencial de Central.
    - name: Comprobar que hay credenciales de Central
      ansible.builtin.assert:
        that:
          - acs_host | length > 0
          - acs_token | length > 0
        fail_msg: >-
          Faltan ACS_HOST o ACS_TOKEN en el entorno. Exportalos antes de
          ejecutar; nunca los escribas aqui.
      tags: [always]

    # --- Integracion de REGISTRO (una por organizacion de Quay) ---
    # Sin image integration, roxctl falla con "no matching image registries
    # found": Central ni siquiera puede resolver los metadatos de la imagen.
    # Reaplicable solo: --tags registro.
    - name: Leer el token admin de Quay del secreto de dia-0
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: quay-admin-token
        namespace: quay-enterprise
      register: quay_admin_secreto
      tags: [registro]

    # Solo para CONSULTAR los tokens de los robots: la integracion no usa el admin.
    - name: Resolver el token admin de Quay (secreto > entorno)
      ansible.builtin.set_fact:
        quay_admin_token: >-
          {{ (quay_admin_secreto.resources[0].data.token | b64decode | trim)
             if quay_admin_secreto.resources | default([]) | length > 0
             else lookup('env', 'QUAY_TOKEN') }}
      no_log: true
      tags: [registro]

    - name: Comprobar que hay token admin de Quay
      ansible.builtin.assert:
        that: quay_admin_token | trim | length > 0
        fail_msg: >-
          Ni existe el secreto quay-enterprise/quay-admin-token ni hay QUAY_TOKEN
          en el entorno: sin el no se pueden consultar los robots del registro.
      tags: [registro]

    # Un 404 aqui significa que falta el robot: ejecutar antes quay/ansible/organizations.yml.
    - name: Consultar el token del robot acs-scanner de cada organizacion
      ansible.builtin.uri:
        url: "https://{{ quay_host }}/api/v1/organization/{{ item }}/robots/acs-scanner"
        method: GET
        headers:
          Authorization: "Bearer {{ quay_admin_token }}"
        status_code: [200]
        validate_certs: "{{ quay_validate_certs }}"
      changed_when: false
      register: robots_scanner
      loop: "{{ orgs_registro }}"
      no_log: true
      tags: [registro]

    - name: Comprobar que integraciones de registro existen en Central
      ansible.builtin.uri:
        url: "{{ acs_api }}/imageintegrations"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: integraciones_existentes
      tags: [registro]

    # Se converge por nombre: sin id se crea (POST) y con endpoint o robot
    # cambiados se actualiza (PUT); si todo coincide no se toca (idempotencia real).
    - name: Registrar cada organizacion de Quay en ACS (categoria REGISTRY)
      ansible.builtin.uri:
        url: "{{ acs_api }}/imageintegrations{{ '/' + integracion_actual.id if integracion_actual else '' }}"
        method: "{{ 'PUT' if integracion_actual else 'POST' }}"
        headers:
          Authorization: "Bearer {{ acs_token }}"
        body_format: json
        body:
          name: "quay-{{ item.item }}"
          id: "{{ integracion_actual.id | default(omit) }}"
          type: quay
          categories: [REGISTRY]
          quay:
            endpoint: "https://{{ quay_host }}"
            registryRobotCredentials:
              username: "{{ item.item }}+acs-scanner"
              password: "{{ item.json.token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      vars:
        integracion_actual: "{{ integraciones_existentes.json.integrations | default([]) | selectattr('name', 'equalto', 'quay-' ~ item.item) | list | first | default({}) }}"
      when: >-
        not integracion_actual or
        integracion_actual.quay.endpoint != 'https://' ~ quay_host or
        (integracion_actual.quay.registryRobotCredentials.username | default('')) != item.item ~ '+acs-scanner'
      loop: "{{ robots_scanner.results }}"
      loop_control:
        label: "quay-{{ item.item }}"
      no_log: true
      tags: [registro]

    # Releer tras converger: el test de una integracion ya persistida debe llevar
    # su id o Central lo rechaza por "nombre duplicado".
    - name: Releer las integraciones de registro ya persistidas
      ansible.builtin.uri:
        url: "{{ acs_api }}/imageintegrations"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: integraciones_persistidas
      tags: [registro]

    # VERIFICACION real contra el registro: Central prueba la credencial del
    # robot sin persistir nada; si falla, la integracion existiria pero no
    # resolveria imagenes — el mismo sintoma que motivo este bloque.
    - name: Probar cada integracion de registro contra Quay
      ansible.builtin.uri:
        url: "{{ acs_api }}/imageintegrations/test"
        method: POST
        headers:
          Authorization: "Bearer {{ acs_token }}"
        body_format: json
        body:
          name: "quay-{{ item.item }}"
          id: "{{ integraciones_persistidas.json.integrations | selectattr('name', 'equalto', 'quay-' ~ item.item) | map(attribute='id') | first }}"
          type: quay
          categories: [REGISTRY]
          quay:
            endpoint: "https://{{ quay_host }}"
            registryRobotCredentials:
              username: "{{ item.item }}+acs-scanner"
              password: "{{ item.json.token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      loop: "{{ robots_scanner.results }}"
      loop_control:
        label: "quay-{{ item.item }}"
      no_log: true
      tags: [registro]

    # --- Integracion de FIRMA (cosign) + politicas que la referencian ---
    # El ID de una SignatureIntegration lo GENERA Central al crearla: un ID
    # literal en Git no es reproducible (en cada instalacion sale otro) y deja
    # la politica INERTE — existe en el papel y no bloquea nada. Por eso este
    # bloque crea (o reutiliza por NOMBRE) la integracion, resuelve su ID en
    # ejecucion y aplica las dos SecurityPolicy con el ID inyectado, con el
    # mismo patron CHANGE_ME_* del bootstrap. Reaplicable solo: --tags firma.
    - name: Leer la clave publica de cosign del secreto del CI
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: cosign-signing-key
        namespace: "{{ (ci_namespaces | first).namespace }}"
      register: cosign_secreto
      tags: [firma]

    # La MISMA llave cuyo par privado usa la task de firma: si difieren, todo lo
    # firmado quedaria "no verificado". Fallback por entorno para poder sembrar
    # Central antes de que exista el secreto del CI.
    - name: Resolver la clave publica de cosign (secreto > entorno)
      ansible.builtin.set_fact:
        cosign_public_key: >-
          {{ (cosign_secreto.resources[0].data['cosign.pub'] | b64decode)
             if cosign_secreto.resources | default([]) | length > 0
             else lookup('env', 'COSIGN_PUBLIC_KEY') }}
      tags: [firma]

    - name: Comprobar que hay clave publica de cosign
      ansible.builtin.assert:
        that: cosign_public_key | trim | length > 0
        fail_msg: >-
          Ni existe el secreto cosign-signing-key en
          {{ (ci_namespaces | first).namespace }} ni hay COSIGN_PUBLIC_KEY en el
          entorno: sin la clave publica no hay integracion de firma que crear.
      tags: [firma]

    - name: Comprobar si la integracion de firma ya existe
      ansible.builtin.uri:
        url: "{{ acs_api }}/signatureintegrations"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: firmas_existentes
      tags: [firma]

    - name: Localizar la integracion de firma por nombre
      ansible.builtin.set_fact:
        integracion_firma: "{{ firmas_existentes.json.integrations | default([]) | selectattr('name', 'equalto', firma_nombre) | list | first | default({}) }}"
      tags: [firma]

    # Con id existente se converge (PUT: permite rotar la llave), pero SOLO si la
    # llave difiere: asi una reejecucion sin cambios reporta cero cambios de verdad.
    - name: Registrar la integracion de firma cosign en Central
      ansible.builtin.uri:
        url: "{{ acs_api }}/signatureintegrations{{ '/' + integracion_firma.id if integracion_firma else '' }}"
        method: "{{ 'PUT' if integracion_firma else 'POST' }}"
        headers:
          Authorization: "Bearer {{ acs_token }}"
        body_format: json
        body:
          name: "{{ firma_nombre }}"
          id: "{{ integracion_firma.id | default(omit) }}"
          cosign:
            publicKeys:
              - name: "{{ org_prefix }}-ci"
                publicKeyPemEnc: "{{ cosign_public_key }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      register: firma_registrada
      when: >-
        not integracion_firma or
        (integracion_firma.cosign.publicKeys | map(attribute='publicKeyPemEnc') | list != [cosign_public_key])
      tags: [firma]

    - name: Resolver el ID real de la integracion de firma
      ansible.builtin.set_fact:
        firma_id: "{{ integracion_firma.id | default(firma_registrada.json.id) }}"
      tags: [firma]

    # Las politicas de firma NO las gobierna Argo (ver acs/ansible/policies/):
    # su unico dato no reproducible es este ID, que se inyecta aqui al aplicar.
    # SSA con force_conflicts para ADOPTAR los CR si antes los aplicaba Argo.
    - name: Aplicar las SecurityPolicy de firma con el ID real
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', item.file) | replace('CHANGE_ME_SIGNATURE_INTEGRATION_ID', firma_id) }}"
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
      loop: "{{ politicas_firma }}"
      loop_control:
        label: "{{ item.nombre }}"
      tags: [firma]

    # Si estos CR los aplicaba Argo antes, conservan su tracking-id: con el, la
    # Application queda OutOfSync perpetua ("requires pruning") y, peor, el
    # selfHeal revertiria el ID inyectado al literal viejo de Git. Retirar el
    # tracking los convierte en huerfanos que Argo ignora. Solo si esta presente:
    # asi la reejecucion no reporta cambios.
    - name: Consultar el tracking de Argo en los CR de firma
      kubernetes.core.k8s_info:
        api_version: config.stackrox.io/v1alpha1
        kind: SecurityPolicy
        name: "{{ item.file | basename | regex_replace('-securitypolicy\\.yaml$', '') }}"
        namespace: stackrox
      register: crs_firma
      loop: "{{ politicas_firma }}"
      loop_control:
        label: "{{ item.nombre }}"
      tags: [firma]

    - name: Retirar el tracking de Argo de los CR de firma adoptados
      kubernetes.core.k8s:
        state: patched
        api_version: config.stackrox.io/v1alpha1
        kind: SecurityPolicy
        name: "{{ item.resources[0].metadata.name }}"
        namespace: stackrox
        definition:
          metadata:
            annotations:
              argocd.argoproj.io/tracking-id: null
              argocd.argoproj.io/sync-options: null
              kubectl.kubernetes.io/last-applied-configuration: null
      when: >-
        item.resources | default([]) | length > 0 and
        'argocd.argoproj.io/tracking-id' in (item.resources[0].metadata.annotations | default({}))
      loop: "{{ crs_firma.results }}"
      loop_control:
        label: "{{ item.item.nombre }}"
      tags: [firma]

    # VERIFICACION, no cortesia: el defecto que motivo este bloque era una
    # politica que "existia" apuntando a un ID de otra instalacion. Se espera a
    # que Central refleje el CR y luego se comprueba el criterio de verdad.
    - name: Esperar a que Central refleje cada politica de firma
      ansible.builtin.uri:
        url: "{{ acs_api }}/policies"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: politicas_central
      until: politicas_central.json.policies | default([]) | selectattr('name', 'equalto', item.nombre) | list | length > 0
      retries: 30
      delay: 10
      loop: "{{ politicas_firma }}"
      loop_control:
        label: "{{ item.nombre }}"
      tags: [firma]

    # El until reintenta hasta que el criterio apunte al ID esperado: cubre el
    # retardo de reconciliacion CR->Central y DETECTA a quien lo pelee (p. ej.
    # un Argo que aun tenga las politicas en Git y las revierta por self-heal).
    - name: Consultar el detalle de cada politica de firma
      ansible.builtin.uri:
        url: "{{ acs_api }}/policies/{{ item.json.policies | selectattr('name', 'equalto', item.item.nombre) | map(attribute='id') | first }}"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: politicas_detalle
      until: >-
        politicas_detalle.json.policySections | default([]) | map(attribute='policyGroups') | flatten
        | selectattr('fieldName', 'equalto', 'Image Signature Verified By')
        | map(attribute='values') | flatten | map(attribute='value') | list == [firma_id]
      retries: 30
      delay: 10
      loop: "{{ politicas_central.results }}"
      loop_control:
        label: "{{ item.item.nombre }}"
      tags: [firma]

    - name: Verificar que cada politica apunta al ID vivo y con enforcement
      ansible.builtin.assert:
        that:
          - item.json.policySections | map(attribute='policyGroups') | flatten | selectattr('fieldName', 'equalto', 'Image Signature Verified By') | map(attribute='values') | flatten | map(attribute='value') | list == [firma_id]
          - not (item.json.disabled | default(false))
          - item.json.enforcementActions | length > 0
        fail_msg: >-
          La politica {{ item.item.item.nombre }} no apunta al ID {{ firma_id }}
          o no tiene enforcement: el control de firma quedaria en el papel.
      loop: "{{ politicas_detalle.results }}"
      loop_control:
        label: "{{ item.item.item.nombre }}"
      tags: [firma]

    - name: Recordar el resto del ciclo
      ansible.builtin.debug:
        msg: >-
          Integracion ACS->Quay lista y politicas de firma verificadas contra la
          SignatureIntegration {{ firma_nombre }}. El resto de politicas se
          gestiona como CR SecurityPolicy via Argo (acs/gitops/base/policies/).
          Los informes de vulnerabilidades se programan en la consola
          (Vulnerability Management -> Reporting); nada de eso se versiona en Git.
