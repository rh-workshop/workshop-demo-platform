---
# Integraciones de ACS que NO tienen CRD (van por la API REST de Central).
#
# QUE VA POR GITOPS Y QUE NO:
#   - Las POLITICAS de seguridad SI tienen CRD (SecurityPolicy) desde ACS 4.11 y
#     van por Argo (ver acs/gitops/base/policies/)... con UNA excepcion: las dos
#     de firma referencian el ID de la SignatureIntegration, que lo genera
#     Central en cada instalacion, asi que las aplica ESTE playbook con el ID
#     real inyectado (acs/ansible/policies/).
#   - Las INTEGRACIONES con registros/escaneres, las colecciones y los informes
#     de vulnerabilidades solo existen tras la API de Central. Ese es el trabajo
#     de este playbook, y es idempotente.
#
# ESTE PLAYBOOK configura la integracion ACS -> Quay (decision de arquitectura):
# Clair escanea la imagen en el registro (gate al push) y ACS LEE esos resultados
# de Quay en vez de re-escanear. Tipo "Scanner + Registry" con un robot account de
# solo lectura. Asi hay defensa en profundidad y un solo panel, sin escanear dos
# veces la misma imagen. Ver docs/backlog-produccion.md (decisiones de arquitectura).
#
# CREDENCIALES: del entorno, nunca versionadas. El token de API se genera en la
# consola de ACS (Platform Configuration -> Integrations -> API Token, rol Admin).
#
#   export ACS_HOST=<host-de-central>
#   export ACS_TOKEN=<token-de-api>
#   export QUAY_HOST=<host-de-quay>
#   export QUAY_ROBOT_USER=<org+robot>       # robot de solo lectura
#   export QUAY_ROBOT_TOKEN=<token-del-robot>
#   ansible-playbook acs/ansible/integrations.yml

- name: Configurar integraciones de ACS
  hosts: localhost
  connection: local
  gather_facts: false

  # El "qué" (el prefijo de organizaciones, que da nombre a la integración) vive
  # en vars/platform-vars.yml: UN solo fichero de datos para todos los playbooks.
  vars_files:
    - "{{ playbook_dir }}/../../vars/platform-vars.yml"

  vars:
    # Raíz del repo, para las SecurityPolicy de firma que aplica este playbook (no Argo).
    repo_root: "{{ playbook_dir }}/../.."
    # Nombre de la integración en Central, derivado del prefijo del registro.
    integracion_nombre: "quay-{{ org_prefix }}"
    # Nombre de la integración de firma: parametrizable; el ID lo genera Central.
    firma_nombre: "{{ org_prefix }}-pipeline-cosign"
    # Las dos políticas que referencian esa integración y su nombre en Central (para verificarlas).
    politicas_firma:
      - file: "{{ repo_root }}/acs/ansible/policies/require-image-signature-securitypolicy.yaml"
        nombre: Exigir firma cosign verificada
      - file: "{{ repo_root }}/acs/ansible/policies/require-image-signature-deploy-securitypolicy.yaml"
        nombre: Exigir firma cosign verificada en el despliegue
    acs_host: "{{ lookup('env', 'ACS_HOST') }}"
    acs_token: "{{ lookup('env', 'ACS_TOKEN') }}"
    acs_api: "https://{{ acs_host }}/v1"
    quay_host: "{{ lookup('env', 'QUAY_HOST') }}"
    quay_robot_user: "{{ lookup('env', 'QUAY_ROBOT_USER') }}"
    quay_robot_token: "{{ lookup('env', 'QUAY_ROBOT_TOKEN') }}"
    # PRODUCCION: verificar SIEMPRE el certificado de Central. false solo es un
    # atajo de lab (MITM sobre el token Admin). Sobreescribible solo explicitamente.
    validate_certs: "{{ lookup('env', 'ACS_VALIDATE_CERTS') | default(true, true) }}"

  tasks:
    # always: tambien con --tags firma hace falta la credencial de Central.
    - name: Comprobar que hay credenciales de Central
      ansible.builtin.assert:
        that:
          - acs_host | length > 0
          - acs_token | length > 0
        fail_msg: >-
          Faltan ACS_HOST o ACS_TOKEN en el entorno. Exportalos antes de
          ejecutar; nunca los escribas aqui.
      tags: [always]

    - name: Comprobar que hay credenciales del registro
      ansible.builtin.assert:
        that:
          - quay_host | length > 0
          - quay_robot_user | length > 0
          - quay_robot_token | length > 0
        fail_msg: >-
          Faltan QUAY_HOST/QUAY_ROBOT_USER/QUAY_ROBOT_TOKEN en el entorno.
          Exportalos antes de ejecutar; nunca los escribas aqui.

    # Se consulta antes de crear: un POST sobre una integración existente falla, y un
    # PUT sobre su id permite converger endpoint/credenciales si cambian (p. ej. al
    # renombrar el registro). Mismo criterio de idempotencia que organizations.yml.
    - name: Comprobar si la integracion ya existe
      ansible.builtin.uri:
        url: "{{ acs_api }}/imageintegrations"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: integraciones_existentes

    - name: Localizar la integracion del registro por nombre
      ansible.builtin.set_fact:
        integracion_quay: "{{ integraciones_existentes.json.integrations | selectattr('name', 'equalto', integracion_nombre) | list | first | default({}) }}"

    - name: Registrar Quay como Scanner + Registry en ACS
      ansible.builtin.uri:
        # Con id existente se actualiza (PUT); sin él se crea (POST).
        url: "{{ acs_api }}/imageintegrations{{ '/' + integracion_quay.id if integracion_quay else '' }}"
        method: "{{ 'PUT' if integracion_quay else 'POST' }}"
        headers:
          Authorization: "Bearer {{ acs_token }}"
        body_format: json
        body:
          # El nombre sale del org_prefix de vars/platform-vars.yml (el mismo de quay/ansible/organizations.yml).
          name: "{{ integracion_nombre }}"
          id: "{{ integracion_quay.id | default(omit) }}"
          type: quay
          categories:
            - REGISTRY
            - SCANNER
          quay:
            endpoint: "https://{{ quay_host }}"
            # robot de SOLO LECTURA; ACS lee imagenes y resultados de Clair
            oauthToken: "{{ quay_robot_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      no_log: true

    # --- Integracion de FIRMA (cosign) + politicas que la referencian ---
    # El ID de una SignatureIntegration lo GENERA Central al crearla: un ID
    # literal en Git no es reproducible (en cada instalacion sale otro) y deja
    # la politica INERTE — existe en el papel y no bloquea nada. Por eso este
    # bloque crea (o reutiliza por NOMBRE) la integracion, resuelve su ID en
    # ejecucion y aplica las dos SecurityPolicy con el ID inyectado, con el
    # mismo patron CHANGE_ME_* del bootstrap. Reaplicable solo: --tags firma.
    - name: Leer la clave publica de cosign del secreto del CI
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: cosign-signing-key
        namespace: "{{ (ci_namespaces | first).namespace }}"
      register: cosign_secreto
      tags: [firma]

    # La MISMA llave cuyo par privado usa la task de firma: si difieren, todo lo
    # firmado quedaria "no verificado". Fallback por entorno para poder sembrar
    # Central antes de que exista el secreto del CI.
    - name: Resolver la clave publica de cosign (secreto > entorno)
      ansible.builtin.set_fact:
        cosign_public_key: >-
          {{ (cosign_secreto.resources[0].data['cosign.pub'] | b64decode)
             if cosign_secreto.resources | default([]) | length > 0
             else lookup('env', 'COSIGN_PUBLIC_KEY') }}
      tags: [firma]

    - name: Comprobar que hay clave publica de cosign
      ansible.builtin.assert:
        that: cosign_public_key | trim | length > 0
        fail_msg: >-
          Ni existe el secreto cosign-signing-key en
          {{ (ci_namespaces | first).namespace }} ni hay COSIGN_PUBLIC_KEY en el
          entorno: sin la clave publica no hay integracion de firma que crear.
      tags: [firma]

    - name: Comprobar si la integracion de firma ya existe
      ansible.builtin.uri:
        url: "{{ acs_api }}/signatureintegrations"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: firmas_existentes
      tags: [firma]

    - name: Localizar la integracion de firma por nombre
      ansible.builtin.set_fact:
        integracion_firma: "{{ firmas_existentes.json.integrations | default([]) | selectattr('name', 'equalto', firma_nombre) | list | first | default({}) }}"
      tags: [firma]

    # Con id existente se converge (PUT: permite rotar la llave), pero SOLO si la
    # llave difiere: asi una reejecucion sin cambios reporta cero cambios de verdad.
    - name: Registrar la integracion de firma cosign en Central
      ansible.builtin.uri:
        url: "{{ acs_api }}/signatureintegrations{{ '/' + integracion_firma.id if integracion_firma else '' }}"
        method: "{{ 'PUT' if integracion_firma else 'POST' }}"
        headers:
          Authorization: "Bearer {{ acs_token }}"
        body_format: json
        body:
          name: "{{ firma_nombre }}"
          id: "{{ integracion_firma.id | default(omit) }}"
          cosign:
            publicKeys:
              - name: "{{ org_prefix }}-ci"
                publicKeyPemEnc: "{{ cosign_public_key }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: true
      register: firma_registrada
      when: >-
        not integracion_firma or
        (integracion_firma.cosign.publicKeys | map(attribute='publicKeyPemEnc') | list != [cosign_public_key])
      tags: [firma]

    - name: Resolver el ID real de la integracion de firma
      ansible.builtin.set_fact:
        firma_id: "{{ integracion_firma.id | default(firma_registrada.json.id) }}"
      tags: [firma]

    # Las politicas de firma NO las gobierna Argo (ver acs/ansible/policies/):
    # su unico dato no reproducible es este ID, que se inyecta aqui al aplicar.
    # SSA con force_conflicts para ADOPTAR los CR si antes los aplicaba Argo.
    - name: Aplicar las SecurityPolicy de firma con el ID real
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', item.file) | replace('CHANGE_ME_SIGNATURE_INTEGRATION_ID', firma_id) }}"
        apply: true
        server_side_apply:
          field_manager: bootstrap-ansible
          force_conflicts: true
      loop: "{{ politicas_firma }}"
      loop_control:
        label: "{{ item.nombre }}"
      tags: [firma]

    # VERIFICACION, no cortesia: el defecto que motivo este bloque era una
    # politica que "existia" apuntando a un ID de otra instalacion. Se espera a
    # que Central refleje el CR y luego se comprueba el criterio de verdad.
    - name: Esperar a que Central refleje cada politica de firma
      ansible.builtin.uri:
        url: "{{ acs_api }}/policies"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: politicas_central
      until: politicas_central.json.policies | default([]) | selectattr('name', 'equalto', item.nombre) | list | length > 0
      retries: 30
      delay: 10
      loop: "{{ politicas_firma }}"
      loop_control:
        label: "{{ item.nombre }}"
      tags: [firma]

    # El until reintenta hasta que el criterio apunte al ID esperado: cubre el
    # retardo de reconciliacion CR->Central y DETECTA a quien lo pelee (p. ej.
    # un Argo que aun tenga las politicas en Git y las revierta por self-heal).
    - name: Consultar el detalle de cada politica de firma
      ansible.builtin.uri:
        url: "{{ acs_api }}/policies/{{ item.json.policies | selectattr('name', 'equalto', item.item.nombre) | map(attribute='id') | first }}"
        method: GET
        headers:
          Authorization: "Bearer {{ acs_token }}"
        status_code: [200]
        validate_certs: "{{ validate_certs }}"
      changed_when: false
      register: politicas_detalle
      until: >-
        politicas_detalle.json.policySections | default([]) | map(attribute='policyGroups') | flatten
        | selectattr('fieldName', 'equalto', 'Image Signature Verified By')
        | map(attribute='values') | flatten | map(attribute='value') | list == [firma_id]
      retries: 30
      delay: 10
      loop: "{{ politicas_central.results }}"
      loop_control:
        label: "{{ item.item.nombre }}"
      tags: [firma]

    - name: Verificar que cada politica apunta al ID vivo y con enforcement
      ansible.builtin.assert:
        that:
          - item.json.policySections | map(attribute='policyGroups') | flatten | selectattr('fieldName', 'equalto', 'Image Signature Verified By') | map(attribute='values') | flatten | map(attribute='value') | list == [firma_id]
          - not (item.json.disabled | default(false))
          - item.json.enforcementActions | length > 0
        fail_msg: >-
          La politica {{ item.item.item.nombre }} no apunta al ID {{ firma_id }}
          o no tiene enforcement: el control de firma quedaria en el papel.
      loop: "{{ politicas_detalle.results }}"
      loop_control:
        label: "{{ item.item.item.nombre }}"
      tags: [firma]

    - name: Recordar el resto del ciclo
      ansible.builtin.debug:
        msg: >-
          Integracion ACS->Quay lista y politicas de firma verificadas contra la
          SignatureIntegration {{ firma_nombre }}. El resto de politicas se
          gestiona como CR SecurityPolicy via Argo (acs/gitops/base/policies/).
          Los informes de vulnerabilidades se programan en la consola
          (Vulnerability Management -> Reporting); nada de eso se versiona en Git.
